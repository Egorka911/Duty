<body class="bg-slate-100 text-slate-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const tg = window.Telegram?.WebApp;

      tg.expand();
    }
    const haptic = (type = 'light') => {

    // СПИСОК TELEGRAM ID АДМИНИСТРАТОРОВ (4 ЧЕЛОВЕКА)
    const ADMIN_TELEGRAM_IDS = [
      7032931171,

        localStorage.setItem('bat_saved_admin_id', String(numId));

        alert('Такого ID нет в списке редакторов!');
      }
    };

    // СПИСОК ВЗВОДА ПО ОТДЕЛЕНИЯМ (23 ЧЕЛОВЕКА)
    const INITIAL_MEMBERS = [
      { id: 'm01', fullName: 'Кузнецов', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm02', fullName: 'Гежа', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm03', fullName: 'Казаков', squad: 1, status: 'ACTIVE', baseScore: 0 },

      { id: 'm05', fullName: 'Гагарин', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm06', fullName: 'Марков', squad: 2, status: 'ACTIVE', baseScore: 0 },

      { id: 'm08', fullName: 'Петухов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm09', fullName: 'Сейдиев', squad: 2, status: 'ACTIVE', baseScore: 0 },

      { id: 'm12', fullName: 'Файзуллин', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm13', fullName: 'Кузьминов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm14', fullName: 'Чиликанов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm15', fullName: 'Романов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm16', fullName: 'Мамадалиев', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm17', fullName: 'Корсаков', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm18', fullName: 'Сеитжалилов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm19', fullName: 'Ильиных', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm20', fullName: 'Шамардин', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm21', fullName: 'Чумаченко', squad: 3, status: 'ACTIVE', baseScore: 0 },

      { id: 'm23', fullName: 'Ялозницкий', squad: 3, status: 'ACTIVE', baseScore: 0 },
    ];

    const INITIAL_TEMPLATES = [
      { id: 't_duty', title: 'Дежурный по классу', count: 1, weight: 1.2 },
      { id: 't_clean', title: 'Уборка класса', count: 2, weight: 1.0 },
    ];

    const STATUS_INFO = {
      ACTIVE: { label: 'В строю', color: 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-800' },
      SICK: { label: 'Больничный', color: 'bg-rose-100 text-rose-800 border-rose-200 dark:bg-rose-950 dark:text-rose-300 dark:border-rose-800' },
      LEAVE: { label: 'Отпуск', color: 'bg-slate-200 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700' },
    };

    const SQUAD_BADGE = {
      1: 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300',
      2: 'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300',
      3: 'bg-teal-100 text-teal-800 dark:bg-teal-950 dark:text-teal-300',
    };

    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const addDaysISO = (isoStr, days) => {
      const d = new Date(isoStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return toISO(d);
    };

    const daysDiff = (a, b) => {
      const tA = new Date(a + 'T00:00:00').getTime();
      const tB = new Date(b + 'T00:00:00').getTime();
      return Math.round(Math.abs(tA - tB) / 86400000);
    };

    const formatRuDate = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: '2-digit', month: 'short' });
    };

    // Подсветка текста при поиске
    function HighlightText({ text, query }) {
      if (!query || !query.trim()) return <span>{text}</span>;
      const q = query.trim();
      const parts = text.split(new RegExp(`(${q})`, 'gi'));
      return (
        <span>
          {parts.map((part, i) =>
            part.toLowerCase() === q.toLowerCase() ? (
              <mark key={i} className="bg-amber-300 text-slate-950 rounded px-0.5 font-extrabold">
                {part}
              </mark>
            ) : (
              <span key={i}>{part}</span>
            )
          )}
        </span>
      );
    }

    // SUPABASE КОНФИГУРАЦИЯ И REALTIME КЛИЕНТ
    const SUPA_URL = 'https://yasxjwbyhiryslkwfhof.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhc3hqd2J5aGlyeXNsa3dmaG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjE5NjUsImV4cCI6MjEwNzczNzk2NX0.WB4ANU1rdyXsF43aRNuXZ1bchUfhdZ4BNahTu6vtnPE';
    const ROOM_CODE = 'battery_main';

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPA_URL, SUPA_KEY)
      : null;

    function BatteryDutyApp() {
      const todayISO = useMemo(() => toISO(new Date()), []);

      const [tab, setTab] = useState('SCHEDULE'); // SCHEDULE | STATS | DEBTS | TASKS | CLOUD
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('bat_dark') === '1');
      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('⏳ Синхронизация...');

      // Навигация по календарю (выбранный месяц и фильтр отображения дней)
      const [calendarMonthISO, setCalendarMonthISO] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [selectedDayISO, setSelectedDayISO] = useState(() => toISO(new Date()));
      const [dayFilterMode, setDayFilterMode] = useState('ALL_MONTH'); // ALL_MONTH | SINGLE_DAY

      // Состояния данных
      const [members, setMembers] = useState(() => {
        const s = localStorage.getItem('bat_v9_members') || localStorage.getItem('bat_v8_members');
        return s ? JSON.parse(s) : INITIAL_MEMBERS;
      });
      const [taskTemplates, setTaskTemplates] = useState(() => {
        const s = localStorage.getItem('bat_v9_templates') || localStorage.getItem('bat_v8_templates');
        return s ? JSON.parse(s) : INITIAL_TEMPLATES;
      });
      const [schedules, setSchedules] = useState(() => {
        const s = localStorage.getItem('bat_v9_schedules') || localStorage.getItem('bat_v8_schedules');
        return s ? JSON.parse(s) : {};
      });
      const [debts, setDebts] = useState(() => {
        const s = localStorage.getItem('bat_v9_debts') || localStorage.getItem('bat_v8_debts');
        return s ? JSON.parse(s) : [];
      });
      const [batteryWeight, setBatteryWeight] = useState(() => {
        const s = localStorage.getItem('bat_v9_bweight') || localStorage.getItem('bat_v8_bweight');
        return s !== null ? Number(s) : 0.5;
      });
      const [protectRestDay, setProtectRestDay] = useState(true);
      const [logs, setLogs] = useState(() => {
        const s = localStorage.getItem('bat_v9_logs') || localStorage.getItem('bat_v8_logs');
        return s ? JSON.parse(s) : [];
      });
      const [backups, setBackups] = useState(() => {
        const s = localStorage.getItem('bat_v9_backups') || localStorage.getItem('bat_v8_backups');
        return s ? JSON.parse(s) : [];
      });

      const lastSyncTimestampRef = useRef(0);

      // Фильтры таблицы статистики
      const [statSquadFilter, setStatSquadFilter] = useState(0);
      const [statStatusFilter, setStatStatusFilter] = useState('ALL');
      const [statTaskFilter, setStatTaskFilter] = useState('ALL');
      const [statDateScope, setStatDateScope] = useState('ALL'); // ALL | MONTH | CUSTOM
      const [statCustomFrom, setStatCustomFrom] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [statCustomTo, setStatCustomTo] = useState(() => toISO(new Date()));
      const [statSearch, setStatSearch] = useState('');
      const [statSortBy, setStatSortBy] = useState('SCORE_DESC');

      // Модалки
      const [confirmDialog, setConfirmDialog] = useState(null);
      const [recalcModalOpen, setRecalcModalOpen] = useState(false);
      const [modalSlot, setModalSlot] = useState(null);
      const [assignMode, setAssignMode] = useState('REGULAR');
      const [batteryModalDate, setBatteryModalDate] = useState(null);
      const [addSlotDate, setAddSlotDate] = useState(null);
      const [customSlotTitle, setCustomSlotTitle] = useState('');
      const [customSlotWeight, setCustomSlotWeight] = useState(1.0);
      const [testResults, setTestResults] = useState(null);

      const [manualDebtor, setManualDebtor] = useState('m01');
      const [manualCreditor, setManualCreditor] = useState('m06');
      const [newTplTitle, setNewTplTitle] = useState('');
      const [newTplCount, setNewTplCount] = useState(1);
      const [newTplWeight, setNewTplWeight] = useState(1.0);

      useEffect(() => {
        localStorage.setItem('bat_dark', darkMode ? '1' : '0');
      }, [darkMode]);

      // Сохранение в LocalStorage
      useEffect(() => localStorage.setItem('bat_v9_members', JSON.stringify(members)), [members]);
      useEffect(() => localStorage.setItem('bat_v9_templates', JSON.stringify(taskTemplates)), [taskTemplates]);
      useEffect(() => localStorage.setItem('bat_v9_schedules', JSON.stringify(schedules)), [schedules]);
      useEffect(() => localStorage.setItem('bat_v9_debts', JSON.stringify(debts)), [debts]);
      useEffect(() => localStorage.setItem('bat_v9_bweight', String(batteryWeight)), [batteryWeight]);
      useEffect(() => localStorage.setItem('bat_v9_logs', JSON.stringify(logs)), [logs]);
      useEffect(() => localStorage.setItem('bat_v9_backups', JSON.stringify(backups)), [backups]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const getMember = (id, list = members) => list.find((m) => m.id === id);
      const getName = (id, list = members) => {
        const m = getMember(id, list);
        return m ? `${m.fullName} (${m.squad} отд.)` : 'Не назначен';
      };

      // Информация о выбранном месяце календаря (все даты месяца с 1 по 28/30/31)
      const currentMonthInfo = useMemo(() => {
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const daysInMonth = new Date(y, m, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7; // Пн = 0 .. Вс = 6

        const datesList = [];
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);

        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          datesList.push(iso);
          cells.push({ dayNum: d, iso });
        }

        const monthTitle = firstDay.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        return {
          year: y,
          month: m,
          firstDateISO: datesList[0],
          lastDateISO: datesList[datesList.length - 1],
          daysInMonth,
          datesList,
          cells,
          monthTitle,
        };
      }, [calendarMonthISO]);

      // Переключение месяцев (Прошлый / Будущий / Сегодня)
      const changeMonth = (delta) => {
        haptic('light');
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const next = new Date(y, m - 1 + delta, 1);
        const nextMonthISO = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`;
        setCalendarMonthISO(nextMonthISO);
        setDayFilterMode('ALL_MONTH');
      };

      const goToToday = () => {
        haptic('light');
        const now = new Date();
        const thisMonthISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        const tISO = toISO(now);
        setCalendarMonthISO(thisMonthISO);
        setSelectedDayISO(tISO);
        setDayFilterMode('ALL_MONTH');
        setTimeout(() => {
          const el = document.getElementById(`day-card-${tISO}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      };

      // =========================================================
      // ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ SUPABASE (REALTIME + ЗАЩИТА ИСТОРИИ)
      // =========================================================
      const applyRemoteState = (st, updatedAtStr) => {
        if (!st) return;
        const remoteTs = updatedAtStr ? new Date(updatedAtStr).getTime() : Date.now();
        if (remoteTs <= lastSyncTimestampRef.current) return;
        lastSyncTimestampRef.current = remoteTs;

        if (st.members) setMembers(st.members);
        if (st.taskTemplates) setTaskTemplates(st.taskTemplates);
        // Объединяем расписание, чтобы ни один прошлый день никогда не потерялся
        if (st.schedules) {
          setSchedules((prev) => ({ ...prev, ...st.schedules }));
        }
        if (st.debts) setDebts(st.debts);
        if (st.batteryWeight !== undefined) setBatteryWeight(st.batteryWeight);
        if (st.logs) setLogs(st.logs);
        if (st.backups) setBackups(st.backups);
        setCloudStatus('🟢 Live-синхронизация активна');
      };

      const pushToCloudNow = async (overrides = {}) => {
        if (!isUserAdmin) return false;
        const nowIso = new Date().toISOString();
        lastSyncTimestampRef.current = new Date(nowIso).getTime();

        const nextState = {
          members: overrides.members ?? members,
          taskTemplates: overrides.taskTemplates ?? taskTemplates,
          schedules: overrides.schedules ?? schedules,
          debts: overrides.debts ?? debts,
          batteryWeight: overrides.batteryWeight ?? batteryWeight,
          logs: overrides.logs ?? logs,
          backups: overrides.backups ?? backups,
        };

        try {
          setCloudStatus('⏳ Сохранение изменений...');
          const res = await fetch(`${SUPA_URL}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPA_KEY,
              Authorization: `Bearer ${SUPA_KEY}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify({
              room_code: ROOM_CODE,
              state_json: nextState,
              updated_at: nowIso,
            }),
          });
          if (!res.ok) {
            setCloudStatus(`❌ Ошибка сохранения (${res.status})`);
            return false;
          }
          setCloudStatus('🟢 Все изменения синхронизированы');
          return true;
        } catch (e) {
          setCloudStatus('❌ Ошибка сети');
          return false;
        }
      };

      const pullFromCloudNow = async (silent = false) => {
        try {
          if (!silent) setCloudStatus('⏳ Загрузка из облака...');
          const res = await fetch(
            `${SUPA_URL}/rest/v1/duty_sync?room_code=eq.${ROOM_CODE}&select=state_json,updated_at`,
            {
              headers: {
                apikey: SUPA_KEY,
                Authorization: `Bearer ${SUPA_KEY}`,
                'Cache-Control': 'no-cache',
              },
            }
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data?.[0]?.state_json) {
            applyRemoteState(data[0].state_json, data[0].updated_at);
          }
        } catch (e) {
          if (!silent) setCloudStatus('⚠️ Автономный режим');
        }
      };

      useEffect(() => {
        pullFromCloudNow(false);

        let channel = null;
        if (supabaseClient) {
          channel = supabaseClient
            .channel('public:duty_sync')
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'duty_sync', filter: `room_code=eq.${ROOM_CODE}` },
              (payload) => {
                if (payload?.new?.state_json) {
                  applyRemoteState(payload.new.state_json, payload.new.updated_at);
                }
              }
            )
            .subscribe();
        }

        const interval = setInterval(() => {
          pullFromCloudNow(true);
        }, 5000);

        return () => {
          clearInterval(interval);
          if (channel && supabaseClient) supabaseClient.removeChannel(channel);
        };
      }, []);

      const createLogAndBackup = (actionTitle, detailsText, createSnapshot = false) => {
        const timeStr = new Date().toLocaleString('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        });
        const author = tg?.initDataUnsafe?.user?.first_name || `ID:${currentTelegramId || 'Админ'}`;
        const newEntry = {
          id: `log_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          time: timeStr,
          author,
          action: actionTitle,
          details: detailsText,
        };
        const nextLogs = [newEntry, ...logs.slice(0, 99)];
        setLogs(nextLogs);

        let nextBackups = backups;
        if (createSnapshot) {
          const snap = {
            id: `bk_${Date.now()}`,
            time: timeStr,
            label: `${actionTitle}: ${detailsText.slice(0, 40)}`,
            schedules: JSON.parse(JSON.stringify(schedules)),
            debts: JSON.parse(JSON.stringify(debts)),
            members: JSON.parse(JSON.stringify(members)),
          };
          nextBackups = [snap, ...backups.slice(0, 9)];
          setBackups(nextBackups);
        }

        return { nextLogs, nextBackups };
      };

      const restoreBackupSnapshot = (snap) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: '⏪ Восстановить бэкап?',
          message: `График вернется к состоянию от ${snap.time} («${snap.label}»).`,
          confirmLabel: 'Восстановить',
          onConfirm: () => {
            setSchedules(snap.schedules);
            setDebts(snap.debts || []);
            if (snap.members) setMembers(snap.members);
            const { nextLogs } = createLogAndBackup('⏪ Откат из бэкапа', `Восстановлена версия от ${snap.time}`, false);
            pushToCloudNow({
              schedules: snap.schedules,
              debts: snap.debts || [],
              members: snap.members || members,
              logs: nextLogs,
            });
            setConfirmDialog(null);
            showToast('⏪ График успешно восстановлен!');
          },
        });
      };

      const isOnBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        return Boolean(schedMap[dateStr]?.batteryDutyIds?.includes(memberId));
      };

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      const allWorkloadTitles = useMemo(() => {
        const titles = new Set(taskTemplates.map((t) => t.title));
        Object.values(schedules).forEach((day) => {
          (day?.slots || []).forEach((s) => {
            if (s.title) titles.add(s.title);
          });
        });
        return Array.from(titles);
      }, [taskTemplates, schedules]);

      // =========================================================
      // РАСЧЕТ СТАТИСТИКИ И ИНДИКАТОРА РАВНОМЕРНОСТИ
      // =========================================================
      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = {
            ...m,
            regularShifts: 0,
            penaltyShifts: 0,
            batteryCount: 0,
            totalAll: 0,
            score: m.baseScore || 0,
            owesCount: 0,
            owedToMeCount: 0,
            byTitle: {},
          };
        });

        Object.keys(schedules).sort().forEach((date) => {
          if (statDateScope === 'MONTH') {
            if (date < currentMonthInfo.firstDateISO || date > currentMonthInfo.lastDateISO) return;
          } else if (statDateScope === 'CUSTOM') {
            if (date < statCustomFrom || date > statCustomTo) return;
          }

          const day = schedules[date];
          if (!day) return;

          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) {
              map[mId].batteryCount += 1;
              map[mId].totalAll += 1;
              map[mId].score += Number(batteryWeight) || 0;
            }
          });

          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalAll += 1;
            const w = Number(s.weight) || 1.0;
            st.byTitle[s.title] = (st.byTitle[s.title] || 0) + 1;

            if (s.isPenalty) {
              st.penaltyShifts += 1;
            } else {
              st.regularShifts += 1;
              st.score += w;
            }
          });
        });

        debts.forEach((d) => {
          if (map[d.debtorId]) map[d.debtorId].owesCount += d.count;
          if (map[d.creditorId]) map[d.creditorId].owedToMeCount += d.count;
        });

        return map;
      }, [members, schedules, batteryWeight, debts, statDateScope, currentMonthInfo, statCustomFrom, statCustomTo]);

      const fairnessMetrics = useMemo(() => {
        const activeList = Object.values(statsMap).filter((m) => m.status === 'ACTIVE');
        if (activeList.length === 0) return { index: 100, stdDev: 0, min: 0, max: 0, avg: 0 };

        const scores = activeList.map((m) => m.score);
        const min = Math.min(...scores);
        const max = Math.max(...scores);
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
        const variance = scores.reduce((acc, s) => acc + Math.pow(s - avg, 2), 0) / scores.length;
        const stdDev = Math.sqrt(variance);

        const index = Math.max(0, Math.min(100, Math.round(100 - stdDev * 18)));
        return { index, stdDev, min, max, avg };
      }, [statsMap]);

      const filteredStatsList = useMemo(() => {
        return Object.values(statsMap)
          .filter((st) => {
            if (statSquadFilter !== 0 && st.squad !== statSquadFilter) return false;
            if (statStatusFilter !== 'ALL' && st.status !== statStatusFilter) return false;
            if (statSearch.trim() && !st.fullName.toLowerCase().includes(statSearch.trim().toLowerCase())) {
              return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (statSortBy === 'NAME_ASC') return a.fullName.localeCompare(b.fullName, 'ru');
            if (statSortBy === 'SCORE_ASC') return a.score - b.score;
            if (statSortBy === 'TOTAL_DESC') return b.totalAll - a.totalAll;
            if (statSortBy === 'TASK_DESC') {
              const getVal = (item) => {
                if (statTaskFilter === 'ALL') return item.totalAll;
                if (statTaskFilter === 'BATTERY') return item.batteryCount;
                if (statTaskFilter === 'PENALTY') return item.penaltyShifts;
                return item.byTitle[statTaskFilter] || 0;
              };
              return getVal(b) - getVal(a);
            }
            return b.score - a.score;
          });
      }, [statsMap, statSquadFilter, statStatusFilter, statSearch, statSortBy, statTaskFilter]);

      // =========================================================
      // АЛГОРИТМ СПРАВЕДЛИВОЙ ГЕНЕРАЦИИ (СОХРАНЯЕТ ПРОШЛЫЕ ДНИ!)
      // =========================================================
      const runScheduleGenerator = (
        baseSchedules,
        keepExistingSlots,
        periodStart,
        periodDays,
        currentMembers,
        currentTemplates,
        currentDebts
      ) => {
        // Клонируем ВСЮ историю расписания (никакие прошлые дни не удаляются!)
        const updated = JSON.parse(JSON.stringify(baseSchedules));
        const tempScore = {};
        const tempRoleCount = {};
        const lastDate = {};

        let workingDebts = JSON.parse(JSON.stringify(currentDebts));
        let autoRepaidCount = 0;

        currentMembers.forEach((m) => {
          tempScore[m.id] = m.baseScore || 0;
          tempRoleCount[m.id] = {};
        });

        const base = new Date(periodStart + 'T00:00:00');
        const period = [];
        for (let i = 0; i < periodDays; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        // 1. Учитываем всю историю смен до начала пересчитываемого периода
        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (tempScore[mId] !== undefined) {
                tempScore[mId] += Number(batteryWeight) || 0;
                lastDate[mId] = dKey;
              }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && tempScore[s.memberId] !== undefined) {
                if (!s.isPenalty) {
                  tempScore[s.memberId] += Number(s.weight) || 1;
                  tempRoleCount[s.memberId][s.title] = (tempRoleCount[s.memberId][s.title] || 0) + 1;
                }
                lastDate[s.memberId] = dKey;
              }
            });
          }
        });

        // 2. Посуточная балансировка выбранного диапазона
        period.forEach((dateStr) => {
          const existing = updated[dateStr];
          const batteryDutyIds = existing?.batteryDutyIds || [];

          batteryDutyIds.forEach((mId) => {
            if (tempScore[mId] !== undefined) {
              tempScore[mId] += Number(batteryWeight) || 0;
              lastDate[mId] = dateStr;
            }
          });

          const templateSlots = [];
          currentTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr,
                title: tpl.title,
                weight: tpl.weight,
                memberId: null,
                isPenalty: false,
                isManual: false,
                repaidForName: null,
              });
            }
          });

          let slots = templateSlots;
          // Если выбран режим "Заполнить пустые", сохраняем ВСЕ уже назначенные смены (и прошлые, и ручные)
          if (existing && keepExistingSlots && existing.slots && existing.slots.length > 0) {
            slots = existing.slots.map((s) => {
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, repaidForName: null };
              }
              return s.memberId ? { ...s } : { ...s, memberId: null, isPenalty: false, repaidForName: null };
            });
          }

          const usedToday = new Set(batteryDutyIds);
          slots.forEach((slot) => {
            if (slot.memberId) {
              usedToday.add(slot.memberId);
              if (!slot.isPenalty && tempScore[slot.memberId] !== undefined) {
                tempScore[slot.memberId] += Number(slot.weight) || 1;
                tempRoleCount[slot.memberId][slot.title] =
                  (tempRoleCount[slot.memberId][slot.title] || 0) + 1;
              }
              lastDate[slot.memberId] = dateStr;
            }
          });

          slots.forEach((slot) => {
            if (slot.memberId) return;

            const eligible = currentMembers.filter((m) => {
              if (m.status !== 'ACTIVE') return false;
              if (usedToday.has(m.id)) return false;
              if (isRecoveringFromBatteryDuty(m.id, dateStr, updated)) return false;
              return true;
            });

            const scored = eligible.map((m) => {
              const roleCnt = tempRoleCount[m.id]?.[slot.title] || 0;
              const totalSc = tempScore[m.id] || 0;
              const cooldown = lastDate[m.id] && daysDiff(dateStr, lastDate[m.id]) <= 2;
              const priority = roleCnt * 2.2 + totalSc + (cooldown ? 1000 : 0);
              return { m, priority };
            });

            scored.sort((a, b) => a.priority - b.priority);

            if (scored.length > 0) {
              const minP = scored[0].priority;
              const bestPool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.15);
              let chosen = bestPool[0].m;
              let repaidForName = null;

              const activeDebt = workingDebts.find(
                (d) =>
                  d.creditorId === chosen.id &&
                  d.count > 0 &&
                  eligible.some((el) => el.id === d.debtorId)
              );

              if (activeDebt) {
                const debtorMember = getMember(activeDebt.debtorId, currentMembers);
                if (debtorMember) {
                  repaidForName = chosen.fullName;
                  chosen = debtorMember;
                  activeDebt.count -= 1;
                  autoRepaidCount += 1;
                }
              }

              slot.memberId = chosen.id;
              slot.repaidForName = repaidForName;
              usedToday.add(chosen.id);
              tempScore[chosen.id] += Number(slot.weight) || 1;
              tempRoleCount[chosen.id][slot.title] = (tempRoleCount[chosen.id][slot.title] || 0) + 1;
              lastDate[chosen.id] = dateStr;
            }
          });

          updated[dateStr] = { date: dateStr, batteryDutyIds, slots };
        });

        return {
          updatedSchedules: updated,
          updatedDebts: workingDebts.filter((d) => d.count > 0),
          autoRepaidCount,
        };
      };

      // Заполнить пустые дни выбранного месяца (прошлые и уже заполненные дни сохраняются!)
      const fillEmptyDaysInMonth = () => {
        if (!isUserAdmin) return;
        haptic('medium');
        const { nextLogs, nextBackups } = createLogAndBackup(
          '⚡ Заполнение месяца',
          `Заполнены пустые дни за ${currentMonthInfo.monthTitle}`,
          true
        );

        const { updatedSchedules, updatedDebts } = runScheduleGenerator(
          schedules,
          true, // сохраняем все уже стоящие назначения!
          currentMonthInfo.firstDateISO,
          currentMonthInfo.daysInMonth,
          members,
          taskTemplates,
          debts
        );

        setSchedules(updatedSchedules);
        setDebts(updatedDebts);
        pushToCloudNow({
          schedules: updatedSchedules,
          debts: updatedDebts,
          logs: nextLogs,
          backups: nextBackups,
        });
        showToast(`✅ Пустые дни (${currentMonthInfo.monthTitle}) заполнены!`);
      };

      // Пересчет с сохранением прошедших дней (или всего месяца)
      const executeRecalculate = (onlyFromToday) => {
        if (!isUserAdmin) return;
        haptic('medium');

        let startISO = currentMonthInfo.firstDateISO;
        let countDays = currentMonthInfo.daysInMonth;

        if (onlyFromToday && todayISO >= currentMonthInfo.firstDateISO && todayISO <= currentMonthInfo.lastDateISO) {
          startISO = todayISO;
          countDays = daysDiff(currentMonthInfo.lastDateISO, todayISO) + 1;
        }

        const { nextLogs, nextBackups } = createLogAndBackup(
          '🔄 Пересчет графика',
          `Пересчитан период с ${startISO} (${countDays} дн.). Прошедшие дни сохранены.`,
          true
        );

        const { updatedSchedules, updatedDebts } = runScheduleGenerator(
          schedules,
          false,
          startISO,
          countDays,
          members,
          taskTemplates,
          debts
        );

        setSchedules(updatedSchedules);
        setDebts(updatedDebts);
        pushToCloudNow({
          schedules: updatedSchedules,
          debts: updatedDebts,
          logs: nextLogs,
          backups: nextBackups,
        });
        setRecalcModalOpen(false);
        showToast('🔄 График пересчитан (прошлые дни сохранены)!');
      };

      // Подтверждение перед очисткой суток
      const askConfirmClearDay = (dateStr) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: `🗑 Очистить сутки ${formatRuDate(dateStr)}?`,
          message: `Все задачи по классу и суточные наряды на ${dateStr} будут сняты. Остальные дни месяца не изменятся.`,
          confirmLabel: 'Да, очистить сутки',
          onConfirm: () => {
            haptic('medium');
            const { nextLogs, nextBackups } = createLogAndBackup(
              '🗑 Очистка суток',
              `Очищены все задачи на ${formatRuDate(dateStr)} (${dateStr})`,
              true
            );
            const nextSchedules = {
              ...schedules,
              [dateStr]: { date: dateStr, batteryDutyIds: [], slots: [] },
            };
            setSchedules(nextSchedules);
            pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
            setConfirmDialog(null);
            showToast(`Сутки ${formatRuDate(dateStr)} очищены`);
          },
        });
      };

      // Ручная замена / Подмена в долг / Штрафной наряд
      const handleAssignMember = (newMemberId) => {
        if (!isUserAdmin || !modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const oldMemberId = slot.memberId;
        const oldName = getName(oldMemberId);
        const newName = getName(newMemberId);

        const isPenalty = assignMode === 'PENALTY';
        const isDebtCover = assignMode === 'DEBT_COVER';
        let repaidLabel = null;
        let nextDebts = [...debts];

        if (isDebtCover && oldMemberId && oldMemberId !== newMemberId) {
          const reverseIdx = nextDebts.findIndex(
            (d) => d.debtorId === newMemberId && d.creditorId === oldMemberId && d.count > 0
          );
          if (reverseIdx !== -1) {
            nextDebts[reverseIdx] = { ...nextDebts[reverseIdx], count: nextDebts[reverseIdx].count - 1 };
            nextDebts = nextDebts.filter((d) => d.count > 0);
          } else {
            const existIdx = nextDebts.findIndex(
              (d) => d.debtorId === oldMemberId && d.creditorId === newMemberId
            );
            if (existIdx !== -1) {
              nextDebts[existIdx] = {
                ...nextDebts[existIdx],
                count: nextDebts[existIdx].count + 1,
                lastReason: `${formatRuDate(date)} (${slot.title})`,
              };
            } else {
              nextDebts.push({
                id: `debt_${Date.now()}`,
                debtorId: oldMemberId,
                creditorId: newMemberId,
                count: 1,
                lastReason: `${formatRuDate(date)} (${slot.title})`,
              });
            }
          }
          repaidLabel = `Подмена за ${getMember(oldMemberId)?.fullName}`;
        }

        const nextSchedules = {
          ...schedules,
          [date]: {
            ...schedules[date],
            slots: (schedules[date]?.slots || []).map((s) =>
              s.id === slot.id
                ? { ...s, memberId: newMemberId, isPenalty, isManual: true, repaidForName: repaidLabel }
                : s
            ),
          },
        };

        const { nextLogs, nextBackups } = createLogAndBackup(
          isDebtCover ? '🤝 Подмена в долг' : isPenalty ? '⚠ Штрафной наряд' : '🔄 Замена в смене',
          `${formatRuDate(date)} [${slot.title}]: ${oldName} → ${newName}`,
          true
        );

        setSchedules(nextSchedules);
        setDebts(nextDebts);
        pushToCloudNow({
          schedules: nextSchedules,
          debts: nextDebts,
          logs: nextLogs,
          backups: nextBackups,
        });

        setModalSlot(null);
        showToast(`✅ Замена синхронизирована: ${newName}`);
      };

      // Случайный выбор из наименее загруженных
      const replaceWithRandomLeastLoaded = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;

        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members.filter(
          (m) =>
            m.status === 'ACTIVE' &&
            !usedToday.has(m.id) &&
            m.id !== slotObj.memberId &&
            !isRecoveringFromBatteryDuty(m.id, dateStr)
        );

        if (eligible.length === 0) {
          showToast('Нет свободных бойцов на этот день!');
          return;
        }

        const sorted = eligible
          .map((m) => ({ m, score: statsMap[m.id]?.score || 0 }))
          .sort((a, b) => a.score - b.score);

        const minScore = sorted[0].score;
        let pool = sorted.filter((x) => x.score <= minScore + 1.2);
        if (pool.length < 3) pool = sorted.slice(0, Math.min(4, sorted.length));

        const chosen = pool[Math.floor(Math.random() * pool.length)].m;
        const oldName = getName(slotObj.memberId);
        const newName = getName(chosen.id);

        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: schedules[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: chosen.id, isManual: true, repaidForName: null } : s
            ),
          },
        };

        const { nextLogs, nextBackups } = createLogAndBackup(
          '🎲 Случайная замена',
          `${formatRuDate(dateStr)} [${slotObj.title}]: ${oldName} → ${newName}`,
          true
        );

        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
        showToast(`🎲 Выбран и синхронизирован: ${chosen.fullName}`);
        if (modalSlot) setModalSlot(null);
      };

      const toggleBatteryDutyMember = (dateStr, memberId) => {
        if (!isUserAdmin) return;
        haptic('light');
        const day = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const currentList = day.batteryDutyIds || [];
        const exists = currentList.includes(memberId);
        const nextList = exists ? currentList.filter((id) => id !== memberId) : [...currentList, memberId];

        const updatedSchedules = {
          ...schedules,
          [dateStr]: { ...day, batteryDutyIds: nextList },
        };

        if (!exists) {
          const datesToCheck = protectRestDay ? [dateStr, addDaysISO(dateStr, 1)] : [dateStr];
          datesToCheck.forEach((dKey) => {
            const targetDay = updatedSchedules[dKey];
            if (!targetDay?.slots) return;

            const busy = new Set([
              ...(targetDay.batteryDutyIds || []),
              ...targetDay.slots.map((s) => s.memberId).filter(Boolean),
            ]);

            targetDay.slots = targetDay.slots.map((slot) => {
              if (slot.memberId !== memberId) return slot;
              const replacement = members
                .filter(
                  (m) =>
                    m.status === 'ACTIVE' &&
                    !busy.has(m.id) &&
                    !isRecoveringFromBatteryDuty(m.id, dKey, updatedSchedules)
                )
                .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))[0];

              if (replacement) {
                busy.add(replacement.id);
                return { ...slot, memberId: replacement.id, isManual: true };
              }
              return { ...slot, memberId: null };
            });
          });
        }

        const { nextLogs, nextBackups } = createLogAndBackup(
          '🛡️ Наряд по батарее',
          `${formatRuDate(dateStr)}: ${getName(memberId)} (${exists ? 'снят' : 'назначен'})`,
          true
        );
        setSchedules(updatedSchedules);
        pushToCloudNow({ schedules: updatedSchedules, logs: nextLogs, backups: nextBackups });
      };

      const handleAddCustomSlotToDay = (e) => {
        e.preventDefault();
        if (!isUserAdmin || !addSlotDate || !customSlotTitle.trim()) return;
        const day = schedules[addSlotDate] || { date: addSlotDate, batteryDutyIds: [], slots: [] };
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members
          .filter(
            (m) =>
              m.status === 'ACTIVE' &&
              !usedToday.has(m.id) &&
              !isRecoveringFromBatteryDuty(m.id, addSlotDate)
          )
          .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0));

        const chosen = eligible[0] || null;
        const newSlot = {
          id: `${addSlotDate}_custom_${Date.now()}`,
          date: addSlotDate,
          title: customSlotTitle.trim(),
          weight: Number(customSlotWeight) || 1.0,
          memberId: chosen ? chosen.id : null,
          isPenalty: false,
          isManual: true,
        };

        const nextSchedules = {
          ...schedules,
          [addSlotDate]: { ...day, slots: [...(day.slots || []), newSlot] },
        };
        const { nextLogs } = createLogAndBackup(
          '➕ Добавлена задача',
          `${formatRuDate(addSlotDate)}: «${newSlot.title}» → ${chosen ? getName(chosen.id) : '—'}`,
          false
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs });
        setCustomSlotTitle('');
        setAddSlotDate(null);
        showToast('Задача добавлена и синхронизирована');
      };

      const handleDeleteSlotFromDay = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: (schedules[dateStr]?.slots || []).filter((s) => s.id !== slotObj.id),
          },
        };
        const { nextLogs, nextBackups } = createLogAndBackup(
          '🗑 Удалена задача',
          `${formatRuDate(dateStr)}: удалена «${slotObj.title}» (${getName(slotObj.memberId)})`,
          true
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
        showToast('Задача удалена');
        if (modalSlot) setModalSlot(null);
      };

      // Встроенные тесты алгоритма
      const runBuiltInUnitTests = () => {
        const results = [];
        try {
          const r1 = runScheduleGenerator({}, false, '2026-10-01', 14, INITIAL_MEMBERS, INITIAL_TEMPLATES, []);
          const counts1 = {};
          INITIAL_MEMBERS.forEach((m) => (counts1[m.id] = 0));
          Object.values(r1.updatedSchedules).forEach((d) =>
            d.slots.forEach((s) => {
              if (s.memberId) counts1[s.memberId] += s.weight;
            })
          );
          const vals1 = Object.values(counts1);
          const spread1 = Math.max(...vals1) - Math.min(...vals1);
          results.push({
            name: '1. Равномерность очереди (23 чел. / 14 дней)',
            passed: spread1 <= 2.4,
            detail: `Макс. разброс индекса: ${spread1.toFixed(1)} б. (норма ≤ 2.4)`,
          });

          const manualSeed = {
            '2026-10-01': {
              date: '2026-10-01',
              batteryDutyIds: [],
              slots: [{ id: 's1', date: '2026-10-01', title: 'Дежурный по классу', weight: 1.2, memberId: 'm01', isManual: true, isPenalty: false }],
            },
            '2026-10-02': {
              date: '2026-10-02',
              batteryDutyIds: [],
              slots: [{ id: 's2', date: '2026-10-02', title: 'Дежурный по классу', weight: 1.2, memberId: 'm01', isManual: true, isPenalty: false }],
            },
          };
          const r2 = runScheduleGenerator(manualSeed, true, '2026-10-01', 10, INITIAL_MEMBERS, INITIAL_TEMPLATES, []);
          let m01AutoAssignedAfterManual = 0;
          for (let d = 3; d <= 10; d++) {
            const iso = `2026-10-${String(d).padStart(2, '0')}`;
            r2.updatedSchedules[iso].slots.forEach((s) => {
              if (s.memberId === 'm01') m01AutoAssignedAfterManual++;

              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 max-h-[85vh] flex flex-col">
                  <div className="flex items-center justify-between border-b dark:border-slate-800 pb-2">
                    <div className="text-sm font-extrabold">{modalSlot.slot.title} • {formatRuDate(modalSlot.date)}</div>
                    <button onClick={() => setModalSlot(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <button onClick={() => replaceWithRandomLeastLoaded(modalSlot.date, modalSlot.slot)} className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">
                    🎲 Случайный (из менее загруженных)
                  </button>
                  <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button onClick={() => setAssignMode('REGULAR')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'REGULAR' ? 'bg-white dark:bg-slate-900 text-indigo-600' : 'text-slate-500'}`}>Очередь</button>
                    <button onClick={() => setAssignMode('DEBT_COVER')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'DEBT_COVER' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>В долг</button>
                    <button onClick={() => setAssignMode('PENALTY')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'PENALTY' ? 'bg-rose-600 text-white' : 'text-slate-500'}`}>Штраф</button>
                  </div>
                  <div className="overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800 border dark:border-slate-800 rounded-xl">
                    {members
                      .filter((m) => m.status === 'ACTIVE')
                      .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))
                      .map((m) => (
                        <div key={m.id} className="p-2.5 flex items-center justify-between">
                          <div>
                            <div className="text-xs font-bold">{m.fullName} ({m.squad} отд.)</div>
                            <div className="text-[10px] text-slate-500">Индекс: {(statsMap[m.id]?.score || 0).toFixed(1)}</div>
                          </div>
                          <button onClick={() => handleAssignMember(m.id)} className="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-xl">
                            Назначить
                          </button>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* МОДАЛКА ДОБАВЛЕНИЯ РАЗОВОЙ ЗАДАЧИ */}
            {isUserAdmin && addSlotDate && (
              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <form onSubmit={handleAddCustomSlotToDay} className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b dark:border-slate-800 pb-2">
                    <div className="text-sm font-extrabold">+ Нагрузка на {formatRuDate(addSlotDate)}</div>
                    <button type="button" onClick={() => setAddSlotDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <input
                    type="text"
                    required
                    placeholder="Название (напр. ПХД)"
                    value={customSlotTitle}
                    onChange={(e) => setCustomSlotTitle(e.target.value)}
                    className="w-full px-3 py-2 border dark:border-slate-700 dark:bg-slate-800 rounded-xl text-xs"
                  />
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">
                    Добавить
                  </button>
                </form>
              </div>
            )}

            {/* НИЖНЯЯ НАВИГАЦИЯ */}
            <nav className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 grid ${isUserAdmin ? 'grid-cols-5' : 'grid-cols-4'} py-2 z-30`}>
              <button onClick={() => setTab('SCHEDULE')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'SCHEDULE' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>📅</span><span>Календарь</span>
              </button>
              <button onClick={() => setTab('STATS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'STATS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>📊</span><span>Таблица</span>
              </button>
              <button onClick={() => setTab('DEBTS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'DEBTS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>🤝</span><span>Долги ({totalActiveDebts})</span>
              </button>
              {isUserAdmin && (
                <button onClick={() => setTab('TASKS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'TASKS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                  <span>⚙️</span><span>Нагрузки</span>
                </button>
              )}
              <button onClick={() => setTab('CLOUD')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'CLOUD' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>☁️</span><span>Архив/БД</span>
              </button>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
  </html>
