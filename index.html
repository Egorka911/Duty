<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Дежурство-Контроль PRO • Батарея</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: calc(5.2rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Инициализация Telegram WebApp API
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const haptic = (type = 'light') => {
      try {
        tg?.HapticFeedback?.impactOccurred(type);
      } catch (e) {}
    };

    // 1. СПИСОК ГРУППЫ ПО ОТДЕЛЕНИЯМ (23 ЧЕЛОВЕКА)
    const INITIAL_MEMBERS = [
      // 1 отделение (5 чел.)
      { id: 'm01', fullName: 'Кузнецов', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm02', fullName: 'Гежа', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm03', fullName: 'Казаков', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm04', fullName: 'Ряховский', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm05', fullName: 'Гагарин', squad: 1, status: 'ACTIVE', baseScore: 0 },
      // 2 отделение (9 чел.)
      { id: 'm06', fullName: 'Марков', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm07', fullName: 'Андрушко', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm08', fullName: 'Петухов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm09', fullName: 'Сейдиев', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm10', fullName: 'Ремыга', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm11', fullName: 'Гриневский', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm12', fullName: 'Файзуллин', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm13', fullName: 'Кузьминов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm14', fullName: 'Чиликанов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      // 3 отделение (9 чел.)
      { id: 'm15', fullName: 'Романов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm16', fullName: 'Мамадалиев', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm17', fullName: 'Корсаков', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm18', fullName: 'Сеитжалилов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm19', fullName: 'Ильиных', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm20', fullName: 'Шамардин', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm21', fullName: 'Чумаченко', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm22', fullName: 'Кроль', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm23', fullName: 'Ялозницкий', squad: 3, status: 'ACTIVE', baseScore: 0 },
    ];

    const INITIAL_TEMPLATES = [
      { id: 't_duty', title: 'Дежурный по классу', count: 1, weight: 1.2 },
      { id: 't_clean', title: 'Уборка класса', count: 2, weight: 1.0 },
    ];

    const STATUS_INFO = {
      ACTIVE: { label: 'В строю', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      SICK: { label: 'Больничный', color: 'bg-rose-100 text-rose-800 border-rose-200' },
      LEAVE: { label: 'Командировка / Отпуск', color: 'bg-slate-200 text-slate-700 border-slate-300' },
    };

    const SQUAD_BADGE = {
      1: 'bg-blue-100 text-blue-800',
      2: 'bg-purple-100 text-purple-800',
      3: 'bg-teal-100 text-teal-800',
    };

    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const addDaysISO = (isoStr, days) => {
      const d = new Date(isoStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return toISO(d);
    };

    const daysDiff = (a, b) => {
      const tA = new Date(a + 'T00:00:00').getTime();
      const tB = new Date(b + 'T00:00:00').getTime();
      return Math.round(Math.abs(tA - tB) / 86400000);
    };

    const formatRuDate = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: '2-digit', month: 'short' });
    };

    function BatteryDutyApp() {
      const [tab, setTab] = useState('SCHEDULE'); // SCHEDULE | DEBTS | MEMBERS | TASKS | CLOUD
      const [toast, setToast] = useState(null);
      const [squadFilter, setSquadFilter] = useState(0);

      // Основные состояния
      const [members, setMembers] = useState(() => {
        const s = localStorage.getItem('bat_v4_members');
        return s ? JSON.parse(s) : INITIAL_MEMBERS;
      });

      const [taskTemplates, setTaskTemplates] = useState(() => {
        const s = localStorage.getItem('bat_v4_templates');
        return s ? JSON.parse(s) : INITIAL_TEMPLATES;
      });

      // Расписание: { [date]: { date, slots: [...], batteryDutyIds: ['m01', ...] } }
      const [schedules, setSchedules] = useState(() => {
        const s = localStorage.getItem('bat_v4_schedules');
        return s ? JSON.parse(s) : {};
      });

      // Книга долгов (Peer-to-Peer): [{ id, debtorId, creditorId, count, lastReason }]
      const [debts, setDebts] = useState(() => {
        const s = localStorage.getItem('bat_v4_debts');
        return s ? JSON.parse(s) : [];
      });

      // Настройки суточного наряда по батарее
      const [batteryWeight, setBatteryWeight] = useState(() => {
        const s = localStorage.getItem('bat_v4_bweight');
        return s !== null ? Number(s) : 0.5;
      });
      const [protectRestDay, setProtectRestDay] = useState(true); // Защита дня сдачи наряда (D+1)

      const [logs, setLogs] = useState(() => {
        const s = localStorage.getItem('bat_v4_logs');
        return s ? JSON.parse(s) : [];
      });

      // Настройки облака Supabase
      const [supaUrl, setSupaUrl] = useState(() => localStorage.getItem('bat_supa_url') || '');
      const [supaKey, setSupaKey] = useState(() => localStorage.getItem('bat_supa_key') || '');
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem('bat_room_code') || 'battery_main');
      const [backupString, setBackupString] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);

      // Период
      const [startDate, setStartDate] = useState(() => toISO(new Date()));
      const [daysCount, setDaysCount] = useState(7);

      // Модалки
      const [modalSlot, setModalSlot] = useState(null);
      const [assignMode, setAssignMode] = useState('REGULAR'); // REGULAR | DEBT_COVER | PENALTY
      const [batteryModalDate, setBatteryModalDate] = useState(null);
      const [addSlotDate, setAddSlotDate] = useState(null);
      const [customSlotTitle, setCustomSlotTitle] = useState('');
      const [customSlotWeight, setCustomSlotWeight] = useState(1.0);

      // Форма ручного добавления долга
      const [manualDebtor, setManualDebtor] = useState('m01');
      const [manualCreditor, setManualCreditor] = useState('m06');

      // Форма шаблонов
      const [newTplTitle, setNewTplTitle] = useState('');
      const [newTplCount, setNewTplCount] = useState(1);
      const [newTplWeight, setNewTplWeight] = useState(1.0);

      // Автосохранение в LocalStorage
      useEffect(() => localStorage.setItem('bat_v4_members', JSON.stringify(members)), [members]);
      useEffect(() => localStorage.setItem('bat_v4_templates', JSON.stringify(taskTemplates)), [taskTemplates]);
      useEffect(() => localStorage.setItem('bat_v4_schedules', JSON.stringify(schedules)), [schedules]);
      useEffect(() => localStorage.setItem('bat_v4_debts', JSON.stringify(debts)), [debts]);
      useEffect(() => localStorage.setItem('bat_v4_bweight', String(batteryWeight)), [batteryWeight]);
      useEffect(() => localStorage.setItem('bat_v4_logs', JSON.stringify(logs)), [logs]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const addLog = (action, details, badge = 'INFO') => {
        const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const userTag = tg?.initDataUnsafe?.user?.first_name
          ? ` (${tg.initDataUnsafe.user.first_name})`
          : '';
        setLogs((prev) => [
          { id: Date.now() + Math.random(), time, action: action + userTag, details, badge },
          ...prev.slice(0, 149),
        ]);
      };

      const getMember = (id) => members.find((m) => m.id === id);
      const getName = (id) => {
        const m = getMember(id);
        return m ? `${m.fullName} (${m.squad} отд.)` : 'Не назначен';
      };

      // =========================================================
      // P2P КНИГА ДОЛГОВ: ЗАПИСЬ И АВТО-ВЗАИМОЗАЧЕТ (КЛИРИНГ)
      // =========================================================
      const recordPeerDebt = (debtorId, creditorId, reasonStr) => {
        if (!debtorId || !creditorId || debtorId === creditorId) return;

        setDebts((prev) => {
          const copy = [...prev];
          // Проверяем, не должен ли уже Кредитор Должнику (встречный долг)
          const reverseIdx = copy.findIndex(
            (d) => d.debtorId === creditorId && d.creditorId === debtorId && d.count > 0
          );

          if (reverseIdx !== -1) {
            // Автоматический взаимозачет встречного долга!
            copy[reverseIdx] = {
              ...copy[reverseIdx],
              count: copy[reverseIdx].count - 1,
              lastReason: `Взаимозачет (${reasonStr})`,
            };
            addLog(
              '🤝 Взаимозачет долга',
              `Списан встречный долг между ${getName(debtorId)} и ${getName(creditorId)}`,
              'DEBT'
            );
            return copy.filter((d) => d.count > 0);
          }

          // Иначе увеличиваем или создаем долг debtorId -> creditorId
          const existingIdx = copy.findIndex(
            (d) => d.debtorId === debtorId && d.creditorId === creditorId
          );

          if (existingIdx !== -1) {
            copy[existingIdx] = {
              ...copy[existingIdx],
              count: copy[existingIdx].count + 1,
              lastReason: reasonStr,
            };
          } else {
            copy.push({
              id: `debt_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
              debtorId,
              creditorId,
              count: 1,
              lastReason: reasonStr,
            });
          }

          return copy;
        });
      };

      // =========================================================
      // ПРОВЕРКА СУТОЧНЫХ НАРЯДОВ ПО БАТАРЕЕ (ДЕНЬ D И ДЕНЬ СДАЧИ D+1)
      // =========================================================
      const isOnBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        const day = schedMap[dateStr];
        return Boolean(day?.batteryDutyIds?.includes(memberId));
      };

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      // =========================================================
      // РАСЧЕТ СТАТИСТИКИ И БАЛАНСА (С УЧЕТОМ НАРЯДОВ ПО БАТАРЕЕ И ДОЛГОВ)
      // =========================================================
      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = {
            ...m,
            regularShifts: 0,
            penaltyShifts: 0,
            batteryCount: 0,
            totalClassShifts: 0,
            score: m.baseScore || 0,
            owesCount: 0,
            owedToMeCount: 0,
          };
        });

        Object.keys(schedules).sort().forEach((date) => {
          const day = schedules[date];
          if (!day) return;

          // Учет суточных нарядов по батарее
          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) {
              map[mId].batteryCount += 1;
              map[mId].score += Number(batteryWeight) || 0;
            }
          });

          // Учет смен по классу
          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalClassShifts += 1;
            const w = Number(s.weight) || 1.0;

            if (s.isPenalty) {
              st.penaltyShifts += 1;
            } else {
              st.regularShifts += 1;
              st.score += w;
            }
          });
        });

        // Учет активных долгов
        debts.forEach((d) => {
          if (map[d.debtorId]) map[d.debtorId].owesCount += d.count;
          if (map[d.creditorId]) map[d.creditorId].owedToMeCount += d.count;
        });

        return map;
      }, [members, schedules, batteryWeight, debts]);

      // =========================================================
      // ГЕНЕРАЦИЯ СПРАВЕДЛИВОГО ГРАФИКА (С АВТОПОГАШЕНИЕМ ДОЛГОВ И ЗАЩИТОЙ БАТАРЕИ)
      // =========================================================
      const generateSchedule = (keepManual = true) => {
        haptic('medium');
        const updated = { ...schedules };
        const tempScore = {};
        const tempRoleCount = {};
        const lastDate = {};

        // Копия текущих долгов для автоматического погашения при генерации
        let workingDebts = debts.map((d) => ({ ...d }));
        let autoRepaidCount = 0;

        members.forEach((m) => {
          tempScore[m.id] = m.baseScore || 0;
          tempRoleCount[m.id] = {};
        });

        const base = new Date(startDate + 'T00:00:00');
        const period = [];
        for (let i = 0; i < daysCount; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        // Учитываем историю до даты начала периода
        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (tempScore[mId] !== undefined) {
                tempScore[mId] += Number(batteryWeight) || 0;
                lastDate[mId] = dKey;
              }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && tempScore[s.memberId] !== undefined) {
                if (!s.isPenalty) {
                  tempScore[s.memberId] += Number(s.weight) || 1;
                  tempRoleCount[s.memberId][s.title] = (tempRoleCount[s.memberId][s.title] || 0) + 1;
                }
                lastDate[s.memberId] = dKey;
              }
            });
          }
        });

        period.forEach((dateStr) => {
          const existing = updated[dateStr];
          const batteryDutyIds = existing?.batteryDutyIds || [];

          // Начисляем тяжесть суточного наряда тем, кто сегодня в наряде по батарее
          batteryDutyIds.forEach((mId) => {
            if (tempScore[mId] !== undefined) {
              tempScore[mId] += Number(batteryWeight) || 0;
              lastDate[mId] = dateStr;
            }
          });

          const templateSlots = [];
          taskTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr,
                title: tpl.title,
                weight: tpl.weight,
                memberId: null,
                isPenalty: false,
                isManual: false,
                repaidForName: null,
              });
            }
          });

          let slots = templateSlots;
          if (existing && keepManual && existing.slots?.length > 0) {
            slots = existing.slots.map((s) => {
              // Если человек вручную стоял, но его поставили в наряд по батарее — освобождаем слот
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, repaidForName: null };
              }
              return s.isManual
                ? { ...s }
                : { ...s, memberId: null, isPenalty: false, repaidForName: null };
            });
          }

          const usedToday = new Set([
            ...batteryDutyIds,
            ...slots.map((s) => s.memberId).filter(Boolean),
          ]);

          slots.forEach((slot) => {
            if (slot.memberId) {
              if (!slot.isPenalty && tempScore[slot.memberId] !== undefined) {
                tempScore[slot.memberId] += Number(slot.weight) || 1;
                tempRoleCount[slot.memberId][slot.title] =
                  (tempRoleCount[slot.memberId][slot.title] || 0) + 1;
              }
              lastDate[slot.memberId] = dateStr;
              return;
            }

            // Доступные бойцы (в строю, не заняты сегодня, не в наряде по батарее и не после сдачи наряда)
            const eligible = members.filter((m) => {
              if (m.status !== 'ACTIVE') return false;
              if (usedToday.has(m.id)) return false;
              if (isRecoveringFromBatteryDuty(m.id, dateStr, updated)) return false;
              return true;
            });

            const scored = eligible.map((m) => {
              const roleCnt = tempRoleCount[m.id]?.[slot.title] || 0;
              const totalSc = tempScore[m.id] || 0;
              const cooldown = lastDate[m.id] && daysDiff(dateStr, lastDate[m.id]) <= 2;
              const priority = roleCnt * 2.2 + totalSc + (cooldown ? 1000 : 0);
              return { m, priority };
            });

            scored.sort((a, b) => a.priority - b.priority);

            if (scored.length > 0) {
              const minP = scored[0].priority;
              const bestPool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.25);
              let chosen = bestPool[Math.floor(Math.random() * bestPool.length)].m;
              let repaidForName = null;

              // ПРОВЕРКА КНИГИ ДОЛГОВ: должен ли кто-то из доступных сегодня нашему кандидату chosen?
              const activeDebt = workingDebts.find(
                (d) =>
                  d.creditorId === chosen.id &&
                  d.count > 0 &&
                  eligible.some((el) => el.id === d.debtorId)
              );

              if (activeDebt) {
                const debtorMember = getMember(activeDebt.debtorId);
                if (debtorMember) {
                  repaidForName = chosen.fullName;
                  // Вместо chosen выходит должник debtorMember, но балл очереди зачтется как отработанный!
                  chosen = debtorMember;
                  activeDebt.count -= 1;
                  autoRepaidCount += 1;
                }
              }

              slot.memberId = chosen.id;
              slot.repaidForName = repaidForName;
              usedToday.add(chosen.id);
              tempScore[chosen.id] += Number(slot.weight) || 1;
              tempRoleCount[chosen.id][slot.title] = (tempRoleCount[chosen.id][slot.title] || 0) + 1;
              lastDate[chosen.id] = dateStr;
            }
          });

          updated[dateStr] = { date: dateStr, batteryDutyIds, slots };
        });

        if (autoRepaidCount > 0) {
          setDebts(workingDebts.filter((d) => d.count > 0));
          addLog('🤝 Автовозврат долгов', `При составлении графика автоматически погашено смен по долгам: ${autoRepaidCount}`, 'DEBT');
        }

        setSchedules(updated);
        addLog('⚡ Автораспределение', `График сформирован на ${daysCount} дн. (с учетом нарядов по батарее)`);
        showToast(
          autoRepaidCount > 0
            ? `График готов! Автоматически закрыто долгов: ${autoRepaidCount}`
            : 'График успешно распределен!'
        );
      };

      useEffect(() => {
        if (Object.keys(schedules).length === 0) generateSchedule(false);
      }, []);

      // =========================================================
      // НАЗНАЧЕНИЕ В СУТОЧНЫЙ НАРЯД ПО БАТАРЕЕ (С АВТОЗАМЕНОЙ В КЛАССЕ)
      // =========================================================
      const toggleBatteryDutyMember = (dateStr, memberId) => {
        haptic('light');
        const day = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const currentList = day.batteryDutyIds || [];
        const exists = currentList.includes(memberId);

        const nextList = exists
          ? currentList.filter((id) => id !== memberId)
          : [...currentList, memberId];

        const updatedSchedules = {
          ...schedules,
          [dateStr]: {
            ...day,
            batteryDutyIds: nextList,
          },
        };

        // Если человека поставили в суточный наряд по батарее, освобождаем его от смены в классе в день D и D+1
        if (!exists) {
          const datesToCheck = protectRestDay ? [dateStr, addDaysISO(dateStr, 1)] : [dateStr];
          datesToCheck.forEach((dKey) => {
            const targetDay = updatedSchedules[dKey];
            if (!targetDay?.slots) return;

            const busy = new Set([
              ...(targetDay.batteryDutyIds || []),
              ...targetDay.slots.map((s) => s.memberId).filter(Boolean),
            ]);

            targetDay.slots = targetDay.slots.map((slot) => {
              if (slot.memberId !== memberId) return slot;

              const replacement = members
                .filter(
                  (m) =>
                    m.status === 'ACTIVE' &&
                    !busy.has(m.id) &&
                    !isRecoveringFromBatteryDuty(m.id, dKey, updatedSchedules)
                )
                .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))[0];

              if (replacement) {
                busy.add(replacement.id);
                addLog(
                  '🛡️ Замена из-за наряда по батарее',
                  `${formatRuDate(dKey)} [${slot.title}]: ${getName(memberId)} → ${getName(replacement.id)}`
                );
                return { ...slot, memberId: replacement.id, isManual: true };
              }
              return { ...slot, memberId: null };
            });
          });
        }

        setSchedules(updatedSchedules);
      };

      // =========================================================
      // 🎲 СЛУЧАЙНЫЙ ВЫБОР ИЗ МЕНЕЕ ЗАГРУЖЕННЫХ
      // =========================================================
      const replaceWithRandomLeastLoaded = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;

        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...day.slots.map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members.filter(
          (m) =>
            m.status === 'ACTIVE' &&
            !usedToday.has(m.id) &&
            m.id !== slotObj.memberId &&
            !isRecoveringFromBatteryDuty(m.id, dateStr)
        );

        if (eligible.length === 0) {
          showToast('Нет свободных бойцов на эту дату!');
          return;
        }

        const sorted = eligible
          .map((m) => ({ m, score: statsMap[m.id]?.score || 0 }))
          .sort((a, b) => a.score - b.score);

        const minScore = sorted[0].score;
        let pool = sorted.filter((x) => x.score <= minScore + 1.2);
        if (pool.length < 3) pool = sorted.slice(0, Math.min(4, sorted.length));

        const chosen = pool[Math.floor(Math.random() * pool.length)].m;
        const oldName = getName(slotObj.memberId);
        const newName = getName(chosen.id);

        setSchedules((prev) => ({
          ...prev,
          [dateStr]: {
            ...prev[dateStr],
            slots: prev[dateStr].slots.map((s) =>
              s.id === slotObj.id
                ? { ...s, memberId: chosen.id, isManual: true, repaidForName: null }
                : s
            ),
          },
        }));

        addLog('🎲 Рандом (менее загруженные)', `${formatRuDate(dateStr)} [${slotObj.title}]: ${oldName} → ${newName}`);
        showToast(`🎲 Выбран: ${newName}`);
        if (modalSlot) setModalSlot(null);
      };

      // =========================================================
      // РУЧНАЯ ЗАМЕНА / ПОДМЕНА В ДОЛГ / ШТРАФНОЙ НАРЯД
      // =========================================================
      const handleAssignMember = (newMemberId) => {
        if (!modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const oldMemberId = slot.memberId;
        const oldName = getName(oldMemberId);
        const newName = getName(newMemberId);

        const isPenalty = assignMode === 'PENALTY';
        const isDebtCover = assignMode === 'DEBT_COVER';

        let repaidLabel = null;

        if (isDebtCover && oldMemberId && oldMemberId !== newMemberId) {
          // oldMemberId просит newMemberId выйти за него -> oldMemberId становится должен newMemberId
          recordPeerDebt(oldMemberId, newMemberId, `${formatRuDate(date)} (${slot.title})`);
          repaidLabel = `Подмена за ${getMember(oldMemberId)?.fullName}`;
        }

        setSchedules((prev) => ({
          ...prev,
          [date]: {
            ...prev[date],
            slots: prev[date].slots.map((s) =>
              s.id === slot.id
                ? {
                    ...s,
                    memberId: newMemberId,
                    isPenalty,
                    isManual: true,
                    repaidForName: repaidLabel,
                  }
                : s
            ),
          },
        }));

        addLog(
          isDebtCover
            ? '🤝 Подмена в долг'
            : isPenalty
            ? '⚠ Штрафной наряд'
            : 'Ручная замена',
          `${formatRuDate(date)} [${slot.title}]: ${oldName} → ${newName}`,
          isDebtCover ? 'DEBT' : isPenalty ? 'PENALTY' : 'INFO'
        );

        setModalSlot(null);
        showToast(
          isDebtCover
            ? `🤝 Записан долг за ${getMember(oldMemberId)?.fullName}`
            : `Назначен: ${newName}`
        );
      };

      // Добавление и удаление слота на конкретный день
      const handleAddCustomSlotToDay = (e) => {
        e.preventDefault();
        if (!addSlotDate || !customSlotTitle.trim()) return;
        const day = schedules[addSlotDate] || { date: addSlotDate, batteryDutyIds: [], slots: [] };
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...day.slots.map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members
          .filter(
            (m) =>
              m.status === 'ACTIVE' &&
              !usedToday.has(m.id) &&
              !isRecoveringFromBatteryDuty(m.id, addSlotDate)
          )
          .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0));

        const chosen = eligible[0] || null;
        const newSlot = {
          id: `${addSlotDate}_custom_${Date.now()}`,
          date: addSlotDate,
          title: customSlotTitle.trim(),
          weight: Number(customSlotWeight) || 1.0,
          memberId: chosen ? chosen.id : null,
          isPenalty: false,
          isManual: true,
        };

        setSchedules((prev) => ({
          ...prev,
          [addSlotDate]: {
            ...day,
            slots: [...day.slots, newSlot],
          },
        }));

        addLog('➕ Новая нагрузка', `${formatRuDate(addSlotDate)}: «${newSlot.title}» → ${chosen ? getName(chosen.id) : '—'}`);
        setCustomSlotTitle('');
        setAddSlotDate(null);
        showToast(`Добавлена задача «${newSlot.title}»`);
      };

      const handleDeleteSlotFromDay = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        setSchedules((prev) => ({
          ...prev,
          [dateStr]: {
            ...prev[dateStr],
            slots: prev[dateStr].slots.filter((s) => s.id !== slotObj.id),
          },
        }));
        showToast(`Убрана нагрузка «${slotObj.title}»`);
        if (modalSlot) setModalSlot(null);
      };

      // =========================================================
      // ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (SUPABASE REST API + КОД БЭКАПА)
      // =========================================================
      const pushToSupabaseCloud = async () => {
        if (!supaUrl || !supaKey) {
          showToast('Введите URL и Key Supabase во вкладке Облако');
          return;
        }
        setIsSyncing(true);
        try {
          localStorage.setItem('bat_supa_url', supaUrl);
          localStorage.setItem('bat_supa_key', supaKey);
          localStorage.setItem('bat_room_code', roomCode);

          const payload = {
            room_code: roomCode,
            state_json: { members, taskTemplates, schedules, debts, batteryWeight },
            updated_at: new Date().toISOString(),
          };

          const res = await fetch(`${supaUrl}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: supaKey,
              Authorization: `Bearer ${supaKey}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify(payload),
          });

          if (!res.ok) throw new Error('Ошибка ответа сервера');
          showToast('☁️ Данные успешно выгружены в облако!');
        } catch (err) {
          showToast('Ошибка выгрузки. Проверьте таблицу duty_sync');
        } finally {
          setIsSyncing(false);
        }
      };

      const pullFromSupabaseCloud = async () => {
        if (!supaUrl || !supaKey) {
          showToast('Введите URL и Key Supabase');
          return;
        }
        setIsSyncing(true);
        try {
          const res = await fetch(
            `${supaUrl}/rest/v1/duty_sync?room_code=eq.${encodeURIComponent(roomCode)}&select=state_json`,
            {
              headers: {
                apikey: supaKey,
                Authorization: `Bearer ${supaKey}`,
              },
            }
          );
          const data = await res.json();
          if (data?.[0]?.state_json) {
            const st = data[0].state_json;
            if (st.members) setMembers(st.members);
            if (st.taskTemplates) setTaskTemplates(st.taskTemplates);
            if (st.schedules) setSchedules(st.schedules);
            if (st.debts) setDebts(st.debts);
            showToast('☁️ График загружен из облака!');
          } else {
            showToast('В облаке пока нет записи для этой комнаты');
          }
        } catch (err) {
          showToast('Ошибка загрузки из облака');
        } finally {
          setIsSyncing(false);
        }
      };

      const exportSnapshotCode = () => {
        const snapshot = btoa(
          unescape(
            encodeURIComponent(
              JSON.stringify({ members, taskTemplates, schedules, debts, batteryWeight })
            )
          )
        );
        navigator.clipboard.writeText(snapshot);
        showToast('Код базы скопирован! Перешлите его в Telegram');
      };

      const importSnapshotCode = () => {
        if (!backupString.trim()) return;
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(backupString.trim()))));
          if (decoded.members) setMembers(decoded.members);
          if (decoded.taskTemplates) setTaskTemplates(decoded.taskTemplates);
          if (decoded.schedules) setSchedules(decoded.schedules);
          if (decoded.debts) setDebts(decoded.debts);
          setBackupString('');
          showToast('✅ База успешно синхронизирована по коду!');
        } catch (e) {
          showToast('❌ Неверный формат кода базы');
        }
      };

      // Сводка в Telegram
      const shareToTelegramChat = () => {
        const lines = [`📋 *ГРАФИК НАРЯДОВ И ДЕЖУРСТВ*`, ''];
        visibleDays.forEach((d) => {
          lines.push(`📅 *${formatRuDate(d.date).toUpperCase()}* (${d.date})`);
          if (d.batteryDutyIds?.length > 0) {
            const bNames = d.batteryDutyIds.map((id) => getMember(id)?.fullName).join(', ');
            lines.push(`🛡️ *Наряд по батарее (сутки):* ${bNames}`);
          }
          d.slots.forEach((s) => {
            const extra = s.isPenalty
              ? ' [ШТРАФ]'
              : s.repaidForName
              ? ` [🤝 ${s.repaidForName}]`
              : '';
            lines.push(`• ${s.title}: *${getName(s.memberId)}*${extra}`);
          });
          lines.push('');
        });

        if (debts.length > 0) {
          lines.push(`🤝 *АКТИВНЫЕ ДОЛГИ ПО ПОДМЕНАМ:*`);
          debts.forEach((d) => {
            lines.push(
              `• ${getMember(d.debtorId)?.fullName} должен ${d.count} см. → ${getMember(d.creditorId)?.fullName}`
            );
          });
        }

        const text = lines.join('\n');
        navigator.clipboard.writeText(text);
        showToast('Сводка скопирована для чата Telegram!');
      };

      const visibleDays = useMemo(() => {
        const list = [];
        const base = new Date(startDate + 'T00:00:00');
        for (let i = 0; i < daysCount; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          const iso = toISO(d);
          if (schedules[iso]) list.push(schedules[iso]);
        }
        return list;
      }, [schedules, startDate, daysCount]);

      const totalActiveDebts = debts.reduce((acc, d) => acc + d.count, 0);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-100 safe-bottom relative shadow-xl">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap">
              {toast}
            </div>
          )}

          {/* ВЕРХНЯЯ ШАПКА */}
          <header className="bg-indigo-700 text-white px-4 pt-4 pb-3 sticky top-0 z-20 shadow">
            <div className="flex items-center justify-between">
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="text-base font-extrabold tracking-tight">Контроль Взвода • PRO</h1>
                  {tg?.initDataUnsafe?.user && (
                    <span className="text-[10px] bg-emerald-400/20 text-emerald-200 px-1.5 py-0.5 rounded font-bold">
                      TG MiniApp
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-indigo-200">
                  Строй: {members.filter((m) => m.status === 'ACTIVE').length}/23 • Долгов: {totalActiveDebts}
                </p>
              </div>
              <button
                onClick={shareToTelegramChat}
                className="bg-white/15 active:bg-white/25 text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-white/20"
              >
                📤 В Telegram
              </button>
            </div>
          </header>

          {/* =========================================================
              ВКЛАДКА 1: РАСПИСАНИЕ (С НАРЯДОМ ПО БАТАРЕЕ И ДОЛГАМИ)
             ========================================================= */}
          {tab === 'SCHEDULE' && (
            <div className="p-3 space-y-3">
              <div className="bg-white rounded-2xl p-3 shadow-xs border border-slate-200 space-y-2.5">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] font-bold uppercase text-slate-400">Дата старта</label>
                    <input
                      type="date"
                      value={startDate}
                      onChange={(e) => setStartDate(e.target.value)}
                      className="w-full mt-0.5 px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold uppercase text-slate-400">Период (Пн–Вс)</label>
                    <select
                      value={daysCount}
                      onChange={(e) => setDaysCount(Number(e.target.value))}
                      className="w-full mt-0.5 px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                    >
                      <option value={7}>7 дней (Неделя)</option>
                      <option value={14}>14 дней</option>
                      <option value={30}>30 дней (Месяц)</option>
                    </select>
                  </div>
                </div>

                <div className="flex items-center justify-between gap-2 pt-1">
                  <button
                    onClick={() => generateSchedule(true)}
                    className="flex-1 py-2 bg-indigo-600 active:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs"
                  >
                    ⚡ Заполнить (с учетом долгов)
                  </button>
                  <button
                    onClick={() => generateSchedule(false)}
                    className="px-3 py-2 bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl"
                  >
                    🔄 Сброс
                  </button>
                </div>
              </div>

              {visibleDays.map((day) => {
                const batteryIds = day.batteryDutyIds || [];
                const prevDayBatteryIds = schedules[addDaysISO(day.date, -1)]?.batteryDutyIds || [];

                return (
                  <div key={day.date} className="rounded-2xl border bg-white border-slate-200 p-3.5 shadow-xs space-y-2.5">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                      <div>
                        <span className="text-sm font-extrabold capitalize text-slate-900">
                          {formatRuDate(day.date)}
                        </span>
                        <span className="ml-2 text-xs font-mono text-slate-400">{day.date}</span>
                      </div>
                      <div className="flex gap-1.5">
                        <button
                          onClick={() => setBatteryModalDate(day.date)}
                          className="text-[11px] font-bold px-2 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200"
                        >
                          🛡️ Наряд батареи
                        </button>
                        <button
                          onClick={() => setAddSlotDate(day.date)}
                          className="text-[11px] font-bold px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200"
                        >
                          + Задача
                        </button>
                      </div>
                    </div>

                    {/* Плашка суточного наряда по батарее и сдачи наряда */}
                    {(batteryIds.length > 0 || (protectRestDay && prevDayBatteryIds.length > 0)) && (
                      <div className="p-2 rounded-xl bg-amber-50/90 border border-amber-200 text-xs space-y-1">
                        {batteryIds.length > 0 && (
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-amber-900">
                              🛡️ В суточном наряде (+{batteryWeight} б.):
                            </span>
                            <span className="font-extrabold text-amber-950">
                              {batteryIds.map((id) => getMember(id)?.fullName).join(', ')}
                            </span>
                          </div>
                        )}
                        {protectRestDay && prevDayBatteryIds.length > 0 && (
                          <div className="flex items-center justify-between text-[11px] text-slate-500">
                            <span>💤 После наряда (сдача/отдых):</span>
                            <span className="font-semibold">
                              {prevDayBatteryIds.map((id) => getMember(id)?.fullName).join(', ')}
                            </span>
                          </div>
                        )}
                      </div>
                    )}

                    {/* Слоты дежурств и уборок по классу */}
                    <div className="space-y-2">
                      {day.slots.map((slot) => {
                        const m = getMember(slot.memberId);
                        return (
                          <div
                            key={slot.id}
                            onClick={() => {
                              setAssignMode('REGULAR');
                              setModalSlot({ date: day.date, slot });
                            }}
                            className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 active:scale-[0.99] transition ${
                              slot.isPenalty
                                ? 'bg-rose-50 border-rose-300'
                                : slot.repaidForName
                                ? 'bg-emerald-50/70 border-emerald-300'
                                : 'bg-slate-50/90 border-slate-200'
                            }`}
                          >
                            <div className="min-w-0 flex-1">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="text-[10px] font-extrabold uppercase tracking-wide text-indigo-700">
                                  {slot.title}
                                </span>
                                {slot.isPenalty && (
                                  <span className="text-[9px] font-bold px-1.5 py-0.2 bg-rose-200 text-rose-900 rounded">
                                    ШТРАФНОЙ
                                  </span>
                                )}
                                {slot.repaidForName && (
                                  <span className="text-[9px] font-bold px-1.5 py-0.2 bg-emerald-200 text-emerald-900 rounded">
                                    🤝 Долг за: {slot.repaidForName}
                                  </span>
                                )}
                              </div>
                              <div className="flex items-center gap-1.5 mt-1">
                                <span className="text-sm font-bold text-slate-900 truncate">
                                  {m ? m.fullName : 'Не назначен'}
                                </span>
                                {m && (
                                  <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${SQUAD_BADGE[m.squad]}`}>
                                    {m.squad} отд.
                                  </span>
                                )}
                              </div>
                            </div>

                            <div className="flex items-center gap-1 shrink-0">
                              <button
                                onClick={(e) => replaceWithRandomLeastLoaded(day.date, slot, e)}
                                className="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 active:bg-indigo-50 text-xs font-bold shadow-2xs"
                                title="Случайный из менее загруженных"
                              >
                                🎲
                              </button>
                              <button
                                onClick={(e) => handleDeleteSlotFromDay(day.date, slot, e)}
                                className="px-2 py-1.5 rounded-lg bg-white border border-slate-200 text-rose-500 text-xs font-bold"
                                title="Удалить нагрузку"
                              >
                                🗑
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* =========================================================
              ВКЛАДКА 2: P2P КНИГА ДОЛГОВ ПО ПОДМЕНАМ
             ========================================================= */}
          {tab === 'DEBTS' && (
            <div className="p-3 space-y-3">
              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 space-y-3">
                <div>
                  <h2 className="text-sm font-extrabold text-slate-900">
                    🤝 Книга долгов (Peer-to-Peer взаимозачет)
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    Когда один боец подменяет другого в графике через кнопку «Подмена в долг», запись появляется здесь. При следующей генерации графика система автоматически поставит должника вместо кредитора!
                  </p>
                </div>

                {debts.length === 0 ? (
                  <div className="py-6 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200 text-xs text-slate-400">
                    Активных долгов по подменам нет. Все в расчете!
                  </div>
                ) : (
                  <div className="space-y-2">
                    {debts.map((d) => (
                      <div
                        key={d.id}
                        className="p-3 rounded-xl bg-amber-50/70 border border-amber-200 flex items-center justify-between gap-2"
                      >
                        <div>
                          <div className="text-xs font-bold text-slate-900">
                            <span className="text-rose-700">{getName(d.debtorId)}</span>
                            {' → должен → '}
                            <span className="text-emerald-700">{getName(d.creditorId)}</span>
                          </div>
                          <div className="text-[11px] text-slate-500 mt-0.5">
                            Количество смен: <b>{d.count}</b> • {d.lastReason || 'Личная подмена'}
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            setDebts((prev) =>
                              prev
                                .map((x) => (x.id === d.id ? { ...x, count: x.count - 1 } : x))
                                .filter((x) => x.count > 0)
                            );
                            showToast('1 смена долга списана вручную');
                          }}
                          className="px-2.5 py-1.5 rounded-lg bg-white border border-amber-300 text-amber-900 text-xs font-bold shrink-0"
                        >
                          Простить 1
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {/* Ручное добавление долга */}
                <div className="pt-3 border-t border-slate-100 space-y-2">
                  <div className="text-xs font-bold text-slate-700">Записать долг вручную:</div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-400">Кто должен</label>
                      <select
                        value={manualDebtor}
                        onChange={(e) => setManualDebtor(e.target.value)}
                        className="w-full mt-0.5 px-2 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                      >
                        {members.map((m) => (

              <span>Нагрузки</span>
            </button>
            <button
              onClick={() => setTab('CLOUD')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${
                tab === 'CLOUD' ? 'text-indigo-600' : 'text-slate-400'
              }`}
            >
              <span>☁️</span>
              <span>TG Облако</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
