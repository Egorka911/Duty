<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<body class="bg-slate-100 text-slate-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
    const haptic = (type = 'light') => {
      try {
        tg?.HapticFeedback?.impactOccurred(type);
      } catch (e) {}
    };

    // СПИСОК TELEGRAM ID АДМИНИСТРАТОРОВ (4 ЧЕЛОВЕКА)
    const ADMIN_TELEGRAM_IDS = [
      7032931171,
      8908389240,
      8654413624,
      1017627172
    ];

    const currentTelegramId = Number(
      tg?.initDataUnsafe?.user?.id || localStorage.getItem('bat_saved_admin_id') || 0
    );
    const isUserAdmin = ADMIN_TELEGRAM_IDS.includes(currentTelegramId);

    const unlockAdminAccess = () => {
      const input = prompt('Введите ваш Telegram ID для включения режима Редактора:');
      if (!input) return;
      const numId = Number(input.trim());
      if (ADMIN_TELEGRAM_IDS.includes(numId)) {
        localStorage.setItem('bat_saved_admin_id', String(numId));
        window.location.reload();
      } else {
        alert('Такого ID нет в списке редакторов!');
      }
    };

    // СПИСОК ВЗВОДА ПО ОТДЕЛЕНИЯМ (23 ЧЕЛОВЕКА)
    const INITIAL_MEMBERS = [
      { id: 'm01', fullName: 'Кузнецов', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm02', fullName: 'Гежа', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm03', fullName: 'Казаков', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm04', fullName: 'Ряховский', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm05', fullName: 'Гагарин', squad: 1, status: 'ACTIVE', baseScore: 0 },
      { id: 'm06', fullName: 'Марков', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm07', fullName: 'Андрушко', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm08', fullName: 'Петухов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm09', fullName: 'Сейдиев', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm10', fullName: 'Ремыга', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm11', fullName: 'Гриневский', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm12', fullName: 'Файзуллин', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm13', fullName: 'Кузьминов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm14', fullName: 'Чиликанов', squad: 2, status: 'ACTIVE', baseScore: 0 },
      { id: 'm15', fullName: 'Романов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm16', fullName: 'Мамадалиев', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm17', fullName: 'Корсаков', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm18', fullName: 'Сеитжалилов', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm19', fullName: 'Ильиных', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm20', fullName: 'Шамардин', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm21', fullName: 'Чумаченко', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm22', fullName: 'Кроль', squad: 3, status: 'ACTIVE', baseScore: 0 },
      { id: 'm23', fullName: 'Ялозницкий', squad: 3, status: 'ACTIVE', baseScore: 0 },
    ];

    const INITIAL_TEMPLATES = [
      { id: 't_duty', title: 'Дежурный по классу', count: 1, weight: 1.2 },
      { id: 't_clean', title: 'Уборка класса', count: 2, weight: 1.0 },
    ];

    const STATUS_INFO = {
      ACTIVE: { label: 'В строю', color: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
      SICK: { label: 'Больничный', color: 'bg-rose-100 text-rose-800 border-rose-200' },
      LEAVE: { label: 'Командировка / Отпуск', color: 'bg-slate-200 text-slate-700 border-slate-300' },
    };

    const SQUAD_BADGE = {
      1: 'bg-blue-100 text-blue-800',
      2: 'bg-purple-100 text-purple-800',
      3: 'bg-teal-100 text-teal-800',
    };

    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const addDaysISO = (isoStr, days) => {
      const d = new Date(isoStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return toISO(d);
    };

    const daysDiff = (a, b) => {
      const tA = new Date(a + 'T00:00:00').getTime();
      const tB = new Date(b + 'T00:00:00').getTime();
      return Math.round(Math.abs(tA - tB) / 86400000);
    };

    const formatRuDate = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: '2-digit', month: 'short' });
    };

    // НАСТОЯЩИЕ КЛЮЧИ ПРОЕКТА SUPABASE (JWT ANON KEY)
    const SUPA_URL = 'https://yasxjwbyhiryslkwfhof.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhc3hqd2J5aGlyeXNsa3dmaG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjE5NjUsImV4cCI6MjEwNzczNzk2NX0.WB4ANU1rdyXsF43aRNuXZ1bchUfhdZ4BNahTu6vtnPE';
    const ROOM_CODE = 'battery_main';

    function BatteryDutyApp() {
      const [tab, setTab] = useState('SCHEDULE');
      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('Подключение к облаку...');

      const [members, setMembers] = useState(() => {
        const s = localStorage.getItem('bat_v7_members');
        return s ? JSON.parse(s) : INITIAL_MEMBERS;
      });

      const [taskTemplates, setTaskTemplates] = useState(() => {
        const s = localStorage.getItem('bat_v7_templates');
        return s ? JSON.parse(s) : INITIAL_TEMPLATES;
      });

      const [schedules, setSchedules] = useState(() => {
        const s = localStorage.getItem('bat_v7_schedules');
        return s ? JSON.parse(s) : {};
      });

      const [debts, setDebts] = useState(() => {
        const s = localStorage.getItem('bat_v7_debts');
        return s ? JSON.parse(s) : [];
      });

      const [batteryWeight, setBatteryWeight] = useState(() => {
        const s = localStorage.getItem('bat_v7_bweight');
        return s !== null ? Number(s) : 0.5;
      });
      const [protectRestDay, setProtectRestDay] = useState(true);
      const [isCloudLoaded, setIsCloudLoaded] = useState(false);

      const [startDate, setStartDate] = useState(() => toISO(new Date()));
      const [daysCount, setDaysCount] = useState(7);

      // Фильтры таблицы статистики
      const [statSquadFilter, setStatSquadFilter] = useState(0);
      const [statStatusFilter, setStatStatusFilter] = useState('ALL');
      const [statTaskFilter, setStatTaskFilter] = useState('ALL');
      const [statDateScope, setStatDateScope] = useState('ALL');
      const [statSearch, setStatSearch] = useState('');
      const [statSortBy, setStatSortBy] = useState('SCORE_DESC');

      // Модалки
      const [modalSlot, setModalSlot] = useState(null);
      const [assignMode, setAssignMode] = useState('REGULAR');
      const [batteryModalDate, setBatteryModalDate] = useState(null);
      const [addSlotDate, setAddSlotDate] = useState(null);
      const [customSlotTitle, setCustomSlotTitle] = useState('');
      const [customSlotWeight, setCustomSlotWeight] = useState(1.0);

      const [manualDebtor, setManualDebtor] = useState('m01');
      const [manualCreditor, setManualCreditor] = useState('m06');

      const [newTplTitle, setNewTplTitle] = useState('');
      const [newTplCount, setNewTplCount] = useState(1);
      const [newTplWeight, setNewTplWeight] = useState(1.0);

      // Сохранение в LocalStorage
      useEffect(() => localStorage.setItem('bat_v7_members', JSON.stringify(members)), [members]);
      useEffect(() => localStorage.setItem('bat_v7_templates', JSON.stringify(taskTemplates)), [taskTemplates]);
      useEffect(() => localStorage.setItem('bat_v7_schedules', JSON.stringify(schedules)), [schedules]);
      useEffect(() => localStorage.setItem('bat_v7_debts', JSON.stringify(debts)), [debts]);
      useEffect(() => localStorage.setItem('bat_v7_bweight', String(batteryWeight)), [batteryWeight]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2600);
      };

      // ФУНКЦИЯ ВЫГРУЗКИ В SUPABASE
      const pushStateToCloud = async (customSchedules = schedules) => {
        try {
          setCloudStatus('⏳ Сохранение в облако...');
          const res = await fetch(`${SUPA_URL}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPA_KEY,
              Authorization: `Bearer ${SUPA_KEY}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify({
              room_code: ROOM_CODE,
              state_json: {
                members,
                taskTemplates,
                schedules: customSchedules,
                debts,
                batteryWeight,
              },
              updated_at: new Date().toISOString(),
            }),
          });
          if (!res.ok) {
            const errText = await res.text();
            setCloudStatus(`❌ Ошибка БД (${res.status}): проверьте таблицу duty_sync`);
            console.error(errText);
            return false;
          }
          setCloudStatus('✅ Синхронизировано с облаком Supabase');
          return true;
        } catch (e) {
          setCloudStatus('❌ Нет связи с Supabase');
          return false;
        }
      };

      // ФУНКЦИЯ ЗАГРУЗКИ ИЗ SUPABASE ПРИ СТАРТЕ
      const pullStateFromCloud = async () => {
        try {
          setCloudStatus('⏳ Загрузка графика из облака...');
          const res = await fetch(
            `${SUPA_URL}/rest/v1/duty_sync?room_code=eq.${ROOM_CODE}&select=state_json,updated_at`,
            {
              headers: {
                apikey: SUPA_KEY,
                Authorization: `Bearer ${SUPA_KEY}`,
              },
            }
          );
          if (!res.ok) {
            setCloudStatus(`❌ Ошибка чтения БД (${res.status})`);
            setIsCloudLoaded(true);
            return;
          }
          const data = await res.json();
          if (data && data.length > 0 && data[0].state_json) {
            const st = data[0].state_json;
            if (st.members) setMembers(st.members);
            if (st.taskTemplates) setTaskTemplates(st.taskTemplates);
            if (st.schedules && Object.keys(st.schedules).length > 0) {
              setSchedules(st.schedules);
            }
            if (st.debts) setDebts(st.debts);
            if (st.batteryWeight !== undefined) setBatteryWeight(st.batteryWeight);
            setCloudStatus('✅ Актуальный график загружен из облака');
          } else {
            // Если таблица в облаке ещё пустая — генерируем стартовый график!
            setCloudStatus('⚠️ Облако пустое — создаем первичный график...');
            generateSchedule(false, true);
          }
          setIsCloudLoaded(true);
        } catch (e) {
          setCloudStatus('❌ Ошибка сети при подключении к облаку');
          setIsCloudLoaded(true);
        }
      };

      useEffect(() => {
        pullStateFromCloud();
      }, []);

      // АВТОМАТИЧЕСКОЕ СОХРАНЕНИЕ В ОБЛАКО ПРИ ЛЮБОМ ИЗМЕНЕНИИ РЕДАКТОРОМ
      useEffect(() => {
        if (!isUserAdmin || !isCloudLoaded) return;
        if (Object.keys(schedules).length === 0) return;
        const timer = setTimeout(() => {
          pushStateToCloud(schedules);
        }, 600);
        return () => clearTimeout(timer);
      }, [members, taskTemplates, schedules, debts, batteryWeight, isCloudLoaded]);

      const getMember = (id) => members.find((m) => m.id === id);
      const getName = (id) => {
        const m = getMember(id);
        return m ? `${m.fullName} (${m.squad} отд.)` : 'Не назначен';
      };

      const recordPeerDebt = (debtorId, creditorId, reasonStr) => {
        if (!isUserAdmin) return;
        if (!debtorId || !creditorId || debtorId === creditorId) return;

        setDebts((prev) => {
          const copy = [...prev];
          const reverseIdx = copy.findIndex(
            (d) => d.debtorId === creditorId && d.creditorId === debtorId && d.count > 0
          );

          if (reverseIdx !== -1) {
            copy[reverseIdx] = {
              ...copy[reverseIdx],
              count: copy[reverseIdx].count - 1,
              lastReason: `Взаимозачет (${reasonStr})`,
            };
            return copy.filter((d) => d.count > 0);
          }

          const existingIdx = copy.findIndex(
            (d) => d.debtorId === debtorId && d.creditorId === creditorId
          );

          if (existingIdx !== -1) {
            copy[existingIdx] = { ...copy[existingIdx], count: copy[existingIdx].count + 1, lastReason: reasonStr };
          } else {
            copy.push({
              id: `debt_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
              debtorId,
              creditorId,
              count: 1,
              lastReason: reasonStr,
            });
          }
          return copy;
        });
      };

      const isOnBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        const day = schedMap[dateStr];
        return Boolean(day?.batteryDutyIds?.includes(memberId));
      };

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      const periodDatesSet = useMemo(() => {
        const set = new Set();
        const base = new Date(startDate + 'T00:00:00');
        for (let i = 0; i < daysCount; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          set.add(toISO(d));
        }
        return set;
      }, [startDate, daysCount]);

      const allWorkloadTitles = useMemo(() => {
        const titles = new Set(taskTemplates.map((t) => t.title));
        Object.values(schedules).forEach((day) => {
          (day?.slots || []).forEach((s) => {
            if (s.title) titles.add(s.title);
          });
        });
        return Array.from(titles);
      }, [taskTemplates, schedules]);

      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = {
            ...m,
            regularShifts: 0,
            penaltyShifts: 0,
            batteryCount: 0,
            totalAll: 0,
            score: m.baseScore || 0,
            owesCount: 0,
            owedToMeCount: 0,
            byTitle: {},
          };
        });

        Object.keys(schedules).sort().forEach((date) => {
          if (statDateScope === 'PERIOD' && !periodDatesSet.has(date)) return;
          const day = schedules[date];
          if (!day) return;

          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) {
              map[mId].batteryCount += 1;
              map[mId].totalAll += 1;
              map[mId].score += Number(batteryWeight) || 0;
            }
          });

          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalAll += 1;
            const w = Number(s.weight) || 1.0;
            st.byTitle[s.title] = (st.byTitle[s.title] || 0) + 1;

            if (s.isPenalty) {
              st.penaltyShifts += 1;
            } else {
              st.regularShifts += 1;
              st.score += w;
            }
          });
        });

        debts.forEach((d) => {
          if (map[d.debtorId]) map[d.debtorId].owesCount += d.count;
          if (map[d.creditorId]) map[d.creditorId].owedToMeCount += d.count;
        });

        return map;
      }, [members, schedules, batteryWeight, debts, statDateScope, periodDatesSet]);

      const filteredStatsList = useMemo(() => {
        return Object.values(statsMap)
          .filter((st) => {
            if (statSquadFilter !== 0 && st.squad !== statSquadFilter) return false;
            if (statStatusFilter !== 'ALL' && st.status !== statStatusFilter) return false;
            if (statSearch.trim() && !st.fullName.toLowerCase().includes(statSearch.trim().toLowerCase())) {
              return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (statSortBy === 'NAME_ASC') return a.fullName.localeCompare(b.fullName, 'ru');
            if (statSortBy === 'SCORE_ASC') return a.score - b.score;
            if (statSortBy === 'TOTAL_DESC') return b.totalAll - a.totalAll;
            if (statSortBy === 'TASK_DESC') {
              const getVal = (item) => {
                if (statTaskFilter === 'ALL') return item.totalAll;
                if (statTaskFilter === 'BATTERY') return item.batteryCount;
                if (statTaskFilter === 'PENALTY') return item.penaltyShifts;
                return item.byTitle[statTaskFilter] || 0;
              };
              return getVal(b) - getVal(a);
            }
            return b.score - a.score;
          });
      }, [statsMap, statSquadFilter, statStatusFilter, statSearch, statSortBy, statTaskFilter]);

      // ГЕНЕРАЦИЯ ГРАФИКА (Исправлено заполнение пустых дней!)
      const generateSchedule = (keepManual = true, silent = false) => {
        if (!silent) haptic('medium');
        const updated = { ...schedules };
        const tempScore = {};
        const tempRoleCount = {};
        const lastDate = {};

        let workingDebts = debts.map((d) => ({ ...d }));
        let autoRepaidCount = 0;

        members.forEach((m) => {
          tempScore[m.id] = m.baseScore || 0;
          tempRoleCount[m.id] = {};
        });

        const base = new Date(startDate + 'T00:00:00');
        const period = [];
        for (let i = 0; i < daysCount; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (tempScore[mId] !== undefined) {
                tempScore[mId] += Number(batteryWeight) || 0;
                lastDate[mId] = dKey;
              }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && tempScore[s.memberId] !== undefined) {
                if (!s.isPenalty) {
                  tempScore[s.memberId] += Number(s.weight) || 1;
                  tempRoleCount[s.memberId][s.title] = (tempRoleCount[s.memberId][s.title] || 0) + 1;
                }
                lastDate[s.memberId] = dKey;
              }
            });
          }
        });

        period.forEach((dateStr) => {
          const existing = updated[dateStr];
          const batteryDutyIds = existing?.batteryDutyIds || [];

          batteryDutyIds.forEach((mId) => {
            if (tempScore[mId] !== undefined) {
              tempScore[mId] += Number(batteryWeight) || 0;
              lastDate[mId] = dateStr;
            }
          });

          const templateSlots = [];
          taskTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr,
                title: tpl.title,
                weight: tpl.weight,
                memberId: null,
                isPenalty: false,
                isManual: false,
                repaidForName: null,
              });
            }
          });

          // ВАЖНО: Если день был пустой (slots.length === 0), создаем слоты по шаблону!
          let slots = templateSlots;
          if (existing && keepManual && existing.slots && existing.slots.length > 0) {
            slots = existing.slots.map((s) => {
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, repaidForName: null };
              }
              return s.isManual ? { ...s } : { ...s, memberId: null, isPenalty: false, repaidForName: null };
            });
          }

          const usedToday = new Set([
            ...batteryDutyIds,
            ...slots.map((s) => s.memberId).filter(Boolean),
          ]);

          slots.forEach((slot) => {
            if (slot.memberId) {
              if (!slot.isPenalty && tempScore[slot.memberId] !== undefined) {
                tempScore[slot.memberId] += Number(slot.weight) || 1;
                tempRoleCount[slot.memberId][slot.title] = (tempRoleCount[slot.memberId][slot.title] || 0) + 1;
              }
              lastDate[slot.memberId] = dateStr;
              return;
            }

            const eligible = members.filter((m) => {
              if (m.status !== 'ACTIVE') return false;
              if (usedToday.has(m.id)) return false;
              if (isRecoveringFromBatteryDuty(m.id, dateStr, updated)) return false;
              return true;
            });

            const scored = eligible.map((m) => {
              const roleCnt = tempRoleCount[m.id]?.[slot.title] || 0;
              const totalSc = tempScore[m.id] || 0;
              const cooldown = lastDate[m.id] && daysDiff(dateStr, lastDate[m.id]) <= 2;
              const priority = roleCnt * 2.2 + totalSc + (cooldown ? 1000 : 0);
              return { m, priority };
            });

            scored.sort((a, b) => a.priority - b.priority);

            if (scored.length > 0) {
              const minP = scored[0].priority;
              const bestPool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.25);
              let chosen = bestPool[Math.floor(Math.random() * bestPool.length)].m;
              let repaidForName = null;

              const activeDebt = workingDebts.find(
                (d) =>
                  d.creditorId === chosen.id &&
                  d.count > 0 &&
                  eligible.some((el) => el.id === d.debtorId)
              );

              if (activeDebt) {
                const debtorMember = getMember(activeDebt.debtorId);
                if (debtorMember) {
                  repaidForName = chosen.fullName;
                  chosen = debtorMember;
                  activeDebt.count -= 1;
                  autoRepaidCount += 1;
                }
              }

              slot.memberId = chosen.id;
              slot.repaidForName = repaidForName;
              usedToday.add(chosen.id);
              tempScore[chosen.id] += Number(slot.weight) || 1;
              tempRoleCount[chosen.id][slot.title] = (tempRoleCount[chosen.id][slot.title] || 0) + 1;
              lastDate[chosen.id] = dateStr;
            }
          });

          updated[dateStr] = { date: dateStr, batteryDutyIds, slots };
        });

        if (autoRepaidCount > 0) {
          setDebts(workingDebts.filter((d) => d.count > 0));
        }

        setSchedules(updated);
        if (isUserAdmin) {
          pushStateToCloud(updated);
        }
        if (!silent) showToast('График заполнен и отправлен в облако!');
      };

      const clearAllDayWorkloads = (dateStr) => {
        if (!isUserAdmin) return;
        haptic('medium');
        setSchedules((prev) => ({
          ...prev,
          [dateStr]: { date: dateStr, batteryDutyIds: [], slots: [] },
        }));
        showToast(`Нагрузки на ${formatRuDate(dateStr)} очищены`);
      };

      const toggleBatteryDutyMember = (dateStr, memberId) => {
        if (!isUserAdmin) return;
        haptic('light');
        const day = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const currentList = day.batteryDutyIds || [];
        const exists = currentList.includes(memberId);
        const nextList = exists ? currentList.filter((id) => id !== memberId) : [...currentList, memberId];

        const updatedSchedules = {
          ...schedules,
          [dateStr]: { ...day, batteryDutyIds: nextList },
        };

        if (!exists) {
          const datesToCheck = protectRestDay ? [dateStr, addDaysISO(dateStr, 1)] : [dateStr];
          datesToCheck.forEach((dKey) => {
            const targetDay = updatedSchedules[dKey];
            if (!targetDay?.slots) return;

            const busy = new Set([
              ...(targetDay.batteryDutyIds || []),
              ...targetDay.slots.map((s) => s.memberId).filter(Boolean),
            ]);

            targetDay.slots = targetDay.slots.map((slot) => {
              if (slot.memberId !== memberId) return slot;
              const replacement = members
                .filter(
                  (m) =>
                    m.status === 'ACTIVE' &&
                    !busy.has(m.id) &&
                    !isRecoveringFromBatteryDuty(m.id, dKey, updatedSchedules)
                )
                .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))[0];

              if (replacement) {
                busy.add(replacement.id);
                return { ...slot, memberId: replacement.id, isManual: true };
              }
              return { ...slot, memberId: null };
            });
          });
        }

        setSchedules(updatedSchedules);
      };

      const replaceWithRandomLeastLoaded = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;

        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...day.slots.map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members.filter(
          (m) =>
            m.status === 'ACTIVE' &&
            !usedToday.has(m.id) &&
            m.id !== slotObj.memberId &&
            !isRecoveringFromBatteryDuty(m.id, dateStr)
        );

        if (eligible.length === 0) {
          showToast('Нет свободных бойцов!');
          return;
        }

        const sorted = eligible
          .map((m) => ({ m, score: statsMap[m.id]?.score || 0 }))
          .sort((a, b) => a.score - b.score);

        const minScore = sorted[0].score;
        let pool = sorted.filter((x) => x.score <= minScore + 1.2);
        if (pool.length < 3) pool = sorted.slice(0, Math.min(4, sorted.length));

        const chosen = pool[Math.floor(Math.random() * pool.length)].m;

        setSchedules((prev) => ({
          ...prev,
          [dateStr]: {
            ...prev[dateStr],
            slots: prev[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: chosen.id, isManual: true, repaidForName: null } : s
            ),
          },
        }));
        showToast(`🎲 Выбран: ${chosen.fullName}`);
        if (modalSlot) setModalSlot(null);
      };

      const handleAssignMember = (newMemberId) => {
        if (!isUserAdmin || !modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const oldMemberId = slot.memberId;
        const isPenalty = assignMode === 'PENALTY';
        const isDebtCover = assignMode === 'DEBT_COVER';
        let repaidLabel = null;

        if (isDebtCover && oldMemberId && oldMemberId !== newMemberId) {
          recordPeerDebt(oldMemberId, newMemberId, `${formatRuDate(date)} (${slot.title})`);
          repaidLabel = `Подмена за ${getMember(oldMemberId)?.fullName}`;
        }

        setSchedules((prev) => ({
          ...prev,
          [date]: {
            ...prev[date],
            slots: prev[date].slots.map((s) =>
              s.id === slot.id
                ? { ...s, memberId: newMemberId, isPenalty, isManual: true, repaidForName: repaidLabel }
                : s
            ),
          },
        }));

        setModalSlot(null);
        showToast('Назначение сохранено');
      };

      const handleAddCustomSlotToDay = (e) => {
        e.preventDefault();
        if (!isUserAdmin || !addSlotDate || !customSlotTitle.trim()) return;
        const day = schedules[addSlotDate] || { date: addSlotDate, batteryDutyIds: [], slots: [] };
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);

        const eligible = members
          .filter(
            (m) =>
              m.status === 'ACTIVE' &&
              !usedToday.has(m.id) &&
              !isRecoveringFromBatteryDuty(m.id, addSlotDate)

          .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0));

        const chosen = eligible[0] || null;
        const newSlot = {
          id: `${addSlotDate}_custom_${Date.now()}`,
          date: addSlotDate,
          title: customSlotTitle.trim(),
          weight: Number(customSlotWeight) || 1.0,
          memberId: chosen ? chosen.id : null,
          isPenalty: false,
          isManual: true,
        };

        setSchedules((prev) => ({
          ...prev,
          [addSlotDate]: { ...day, slots: [...(day.slots || []), newSlot] },

        setCustomSlotTitle('');
        setAddSlotDate(null);
        showToast('Задача добавлена');

      const handleRenameSlot = (dateStr, slotObj, newTitle) => {

                      🔄 Пересчет
                    </button>
                  </div>

              {visibleDays.map((day) => {

                const prevDayBatteryIds = schedules[addDaysISO(day.date, -1)]?.batteryDutyIds || [];

                return (

                      <div>
                        <span className="text-sm font-extrabold capitalize text-slate-900">{formatRuDate(day.date)}</span>
                        <span className="ml-1.5 text-xs font-mono text-slate-400">{day.date}</span>
                      </div>

                      {isUserAdmin && (
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => setBatteryModalDate(day.date)}
                            className="text-[10px] font-bold px-2 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200"
                          >
                            🛡️ Батарея
                          </button>
                          <button
                            onClick={() => setAddSlotDate(day.date)}
                            className="text-[10px] font-bold px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200"

                            + Задача
                          </button>
                          {(day.slots?.length > 0 || batteryIds.length > 0) && (
                            <button
                              onClick={() => clearAllDayWorkloads(day.date)}
                              className="text-[10px] font-bold px-2 py-1 rounded-lg bg-rose-50 text-rose-600 border border-rose-200"
                              title="Удалить все нагрузки на сутки"
                            >
                              🗑 Очистить
                            </button>
                          )}
                        </div>
                      )}
                    </div>

                    {(batteryIds.length > 0 || (protectRestDay && prevDayBatteryIds.length > 0)) && (
                      <div className="p-2 rounded-xl bg-amber-50/90 border border-amber-200 text-xs space-y-1">
                        {batteryIds.length > 0 && (
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-amber-900">🛡️ Наряд по батарее:</span>
                            <span className="font-extrabold text-amber-950">
                              {batteryIds.map((id) => getMember(id)?.fullName).join(', ')}
                            </span>
                          </div>
                        )}
                        {protectRestDay && prevDayBatteryIds.length > 0 && (
                          <div className="flex items-center justify-between text-[11px] text-slate-500">
                            <span>💤 После наряда (сдача):</span>
                            <span className="font-semibold">
                              {prevDayBatteryIds.map((id) => getMember(id)?.fullName).join(', ')}
                            </span>
                          </div>
                        )}
                      </div>
                    )}

                    {(!day.slots || day.slots.length === 0) ? (
                      <div className="text-center py-3 text-xs text-slate-400">
                        На эти сутки нагрузок нет. {isUserAdmin && 'Нажмите «⚡ Заполнить (авто)» выше!'}
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {day.slots.map((slot) => {
                          const m = getMember(slot.memberId);
                          return (
                            <div
                              key={slot.id}
                              onClick={() => {

                              className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 transition ${
                                isUserAdmin ? 'active:scale-[0.99] cursor-pointer' : ''
                              } ${
                                slot.isPenalty
                                  ? 'bg-rose-50 border-rose-300'
                                  : slot.repaidForName
                                  ? 'bg-emerald-50/70 border-emerald-300'
                                  : 'bg-slate-50/90 border-slate-200'
                              }`}
                            >
                              <div className="min-w-0 flex-1">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <span className="text-[10px] font-extrabold uppercase tracking-wide text-indigo-700">
                                    {slot.title}
                                  </span>
                                  {slot.isPenalty && (
                                    <span className="text-[9px] font-bold px-1.5 py-0.2 bg-rose-200 text-rose-900 rounded">
                                      ШТРАФ
                                    </span>
                                  )}
                                  {slot.repaidForName && (
                                    <span className="text-[9px] font-bold px-1.5 py-0.2 bg-emerald-200 text-emerald-900 rounded">

                                    </span>
                                  )}

                                  <span className="text-sm font-bold text-slate-900 truncate">
                                    {m ? m.fullName : 'Не назначен'}
                                  </span>
                                  {m && (
                                    <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${SQUAD_BADGE[m.squad]}`}>
                                      {m.squad} отд.
                                    </span>
                                  )}
                                </div>
                              </div>

                              {isUserAdmin && (
                                <div className="flex items-center gap-1 shrink-0">
                                  <button
                                    onClick={(e) => replaceWithRandomLeastLoaded(day.date, slot, e)}
                                    className="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 active:bg-indigo-50 text-xs font-bold shadow-2xs"
                                    title="Случайный"
                                  >
                                    🎲
                                  </button>
                                  <button
                                    onClick={(e) => handleDeleteSlotFromDay(day.date, slot, e)}
                                    className="px-2 py-1.5 rounded-lg bg-white border border-slate-200 text-rose-500 text-xs font-bold"
                                    title="Удалить"
                                  >
                                    🗑
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* ВКЛАДКА 2: ТАБЛИЦА СТАТИСТИКИ С ФИЛЬТРАЦИЕЙ */}
          {tab === 'STATS' && (
            <div className="p-3 space-y-3">
              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-xs space-y-2.5">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-extrabold text-slate-900">📊 Сводная таблица нагрузок</h2>
                  <span className="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-lg">

                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <input

                    value={statSearch}

                    className="px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-semibold outline-none"
                  />
                  <select
                    value={statDateScope}

                  >
                    <option value="ALL">За всё время</option>
                    <option value="PERIOD">За период ({daysCount} дн.)</option>
                  </select>
                </div>

                <div className="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-xl">
                  {[
                    { id: 0, label: 'Все (23)' },

                        if (e.target.value !== 'ALL') setStatSortBy('TASK_DESC');
                      }}
                      className="w-full mt-0.5 px-2 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                    >
                      <option value="ALL">Все виды нагрузок</option>
                      <option value="BATTERY">🛡️ Наряд по батарее</option>
                      {allWorkloadTitles.map((title) => (

                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredStatsList.map((st) => (
                        <tr key={st.id} className="hover:bg-slate-50/80">
                          <td className="py-2 px-3 sticky left-0 bg-white z-10 border-r border-slate-100">
                            <div className="flex items-center gap-1.5">
                              <span className={`text-[9px] font-bold px-1 rounded ${SQUAD_BADGE[st.squad]}`}>{st.squad}</span>
                              <span className="font-bold text-slate-900">{st.fullName}</span>
                            </div>
                          </td>
                          <td className="py-2 px-2 text-center font-mono font-extrabold text-indigo-700 bg-indigo-50/30">
                            {st.score.toFixed(1)}
                          </td>
                          <td className="py-2 px-2 text-center font-bold text-slate-900">{st.totalAll}</td>
                          <td className="py-2 px-2 text-center font-bold text-amber-800 bg-amber-50/30">{st.batteryCount || 0}</td>
                          {allWorkloadTitles.map((title) => (
                            <td key={title} className="py-2 px-2 text-center text-slate-700 font-semibold">
                              {st.byTitle[title] || 0}
                            </td>
                          ))}
                          <td className="py-2 px-2 text-center">
                            {st.penaltyShifts > 0 ? (
                              <span className="px-1.5 py-0.5 rounded bg-rose-100 text-rose-800 font-bold text-[10px]">
                                +{st.penaltyShifts}
                              </span>
                            ) : (
                              <span className="text-slate-300">0</span>
                            )}
                          </td>
                          <td className="py-2 px-2 text-center whitespace-nowrap">
                            {isUserAdmin ? (
                              <select
                                value={st.status}
                                onChange={(e) => {
                                  const nextStatus = e.target.value;
                                  setMembers((prev) => prev.map((x) => (x.id === st.id ? { ...x, status: nextStatus } : x)));
                                  showToast('Статус обновлен');
                                }}
                                className={`text-[10px] font-bold px-1.5 py-1 rounded-lg border outline-none ${STATUS_INFO[st.status].color}`}
                              >
                                <option value="ACTIVE">В строю</option>
                                <option value="SICK">Больничный</option>
                                <option value="LEAVE">Отпуск</option>
                              </select>
                            ) : (
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${STATUS_INFO[st.status].color}`}>
                                {STATUS_INFO[st.status].label}
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ВКЛАДКА 3: ДОЛГИ */}
          {tab === 'DEBTS' && (
            <div className="p-3 space-y-3">
              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 space-y-3">
                <h2 className="text-sm font-extrabold text-slate-900">🤝 Книга долгов по подменам</h2>
                {debts.length === 0 ? (
                  <div className="py-6 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200 text-xs text-slate-400">
                    Активных долгов нет
                  </div>
                ) : (
                  <div className="space-y-2">
                    {debts.map((d) => (
                      <div key={d.id} className="p-3 rounded-xl bg-amber-50/70 border border-amber-200 flex items-center justify-between gap-2">
                        <div>
                          <div className="text-xs font-bold text-slate-900">
                            <span className="text-rose-700">{getName(d.debtorId)}</span> → должен → <span className="text-emerald-700">{getName(d.creditorId)}</span>
                          </div>
                          <div className="text-[11px] text-slate-500 mt-0.5">Смен: <b>{d.count}</b> • {d.lastReason || 'Подмена'}</div>
                        </div>
                        {isUserAdmin && (
                          <button
                            onClick={() => {
                              setDebts((prev) => prev.map((x) => (x.id === d.id ? { ...x, count: x.count - 1 } : x)).filter((x) => x.count > 0));
                              showToast('Долг списан');
                            }}
                            className="px-2.5 py-1.5 rounded-lg bg-white border border-amber-300 text-amber-900 text-xs font-bold"
                          >
                            Списать 1
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {isUserAdmin && (
                  <div className="pt-3 border-t border-slate-100 space-y-2">
                    <div className="text-xs font-bold text-slate-700">Записать долг вручную:</div>
                    <div className="grid grid-cols-2 gap-2">
                      <select
                        value={manualDebtor}
                        onChange={(e) => setManualDebtor(e.target.value)}
                        className="px-2 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                      >
                        {members.map((m) => (
                          <option key={m.id} value={m.id}>{m.fullName} (должен)</option>
                        ))}
                      </select>
                      <select
                        value={manualCreditor}
                        onChange={(e) => setManualCreditor(e.target.value)}
                        className="px-2 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                      >
                        {members.map((m) => (
                          <option key={m.id} value={m.id}>{m.fullName} (кому)</option>
                        ))}
                      </select>
                    </div>
                    <button
                      onClick={() => {
                        if (manualDebtor === manualCreditor) return showToast('Выберите разных людей');
                        recordPeerDebt(manualDebtor, manualCreditor, 'Ручная запись');
                        showToast('Долг добавлен');
                      }}
                      className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl"
                    >
                      + Зафиксировать долг
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ВКЛАДКА 4: ШАБЛОНЫ НАГРУЗОК (ТОЛЬКО ДЛЯ АДМИНОВ) */}
          {tab === 'TASKS' && isUserAdmin && (
            <div className="p-3 space-y-3">
              <div className="bg-amber-50/90 rounded-2xl p-3.5 border border-amber-200 space-y-2.5">
                <h2 className="text-xs font-extrabold uppercase text-amber-900">🛡️ Настройки наряда по батарее</h2>
                <div className="flex items-center justify-between text-xs">
                  <span className="font-semibold text-amber-950">Бонус тяжести за сутки:</span>
                  <select
                    value={batteryWeight}
                    onChange={(e) => setBatteryWeight(Number(e.target.value))}
                    className="px-2.5 py-1 rounded-lg border border-amber-300 bg-white font-bold"
                  >
                    <option value={0}>0 баллов</option>
                    <option value={0.5}>+0.5 балла</option>
                    <option value={1.0}>+1.0 балл</option>
                    <option value={1.5}>+1.5 балла</option>
                  </select>
                </div>
              </div>

              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 space-y-3">
                <h2 className="text-sm font-extrabold text-slate-900">Ежедневные виды нагрузок</h2>
                <div className="space-y-2">
                  {taskTemplates.map((tpl) => (
                    <div key={tpl.id} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-bold text-slate-900">{tpl.title}</div>
                        <div className="text-[11px] text-slate-500">Людей: <b>{tpl.count}</b> • Вес: <b>{tpl.weight}</b></div>
                      </div>
                      <button
                        onClick={() => setTaskTemplates((p) => p.filter((x) => x.id !== tpl.id))}
                        className="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold"
                      >
                        Убрать
                      </button>
                    </div>
                  ))}
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!newTplTitle.trim()) return;
                    setTaskTemplates((p) => [
                      ...p,
                      { id: `tpl_${Date.now()}`, title: newTplTitle.trim(), count: Number(newTplCount) || 1, weight: Number(newTplWeight) || 1.0 },
                    ]);
                    setNewTplTitle('');
                    showToast('Шаблон добавлен');
                  }}
                  className="pt-2 border-t border-slate-100 space-y-2"
                >
                  <input
                    type="text"
                    placeholder="Название нагрузки..."
                    value={newTplTitle}
                    onChange={(e) => setNewTplTitle(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="number"
                      min="1"
                      max="10"
                      value={newTplCount}
                      onChange={(e) => setNewTplCount(e.target.value)}
                      className="px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-bold"
                    />
                    <input
                      type="number"
                      step="0.1"
                      value={newTplWeight}
                      onChange={(e) => setNewTplWeight(e.target.value)}
                      className="px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-bold"
                    />
                  </div>
                  <button type="submit" className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">
                    + Добавить в шаблон
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ВКЛАДКА 5: ОБЛАКО */}
          {tab === 'CLOUD' && (
            <div className="p-3 space-y-3">
              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 space-y-2">
                <div className="text-xs font-bold text-slate-700">
                  Ваш Telegram ID: <span className="font-mono text-indigo-600">{currentTelegramId || 'Вне Telegram'}</span>
                </div>
                <div className="text-[11px] text-slate-500">
                  Статус: {isUserAdmin ? <b className="text-emerald-700">👑 Редактор</b> : <b className="text-slate-700">👁 Просмотр</b>}
                </div>
              </div>

              <div className="bg-white rounded-2xl p-3.5 border border-slate-200 space-y-2.5">
                <h2 className="text-sm font-extrabold text-slate-900">☁️ Синхронизация Supabase</h2>
                <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-800">
                  {cloudStatus}
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {isUserAdmin && (
                    <button
                      onClick={ async () => {
                        const ok = await pushStateToCloud(schedules);
                        showToast(ok ? '☁️ Успешно сохранено в БД!' : '❌ Ошибка сохранения в БД');
                      }}
                      className="py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl"
                    >
                      ⬆️ Сохранить в БД
                    </button>
                  )}
                  <button
                    onClick={pullStateFromCloud}
                    className="py-2.5 bg-indigo-600 text-white text-xs font-bold rounded-xl"
                  >
                    ⬇️ Скачать из БД
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКИ */}
          {isUserAdmin && batteryModalDate && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
              <div className="bg-white w-full max-w-md rounded-t-3xl p-4 space-y-3 max-h-[82vh] flex flex-col">
                <div className="flex items-center justify-between border-b pb-2">
                  <div className="text-sm font-extrabold text-slate-900">🛡️ Наряд по батарее на {formatRuDate(batteryModalDate)}</div>
                  <button onClick={() => setBatteryModalDate(null)} className="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                </div>
                <div className="overflow-y-auto divide-y divide-slate-100 border rounded-xl">
                  {members.map((m) => {
                    const checked = isOnBatteryDuty(m.id, batteryModalDate);
                    return (
                      <div key={m.id} onClick={() => toggleBatteryDutyMember(batteryModalDate, m.id)} className={`p-2.5 flex items-center justify-between cursor-pointer ${checked ? 'bg-amber-50' : ''}`}>
                        <span className="text-xs font-bold">{m.fullName} ({m.squad} отд.)</span>
                        <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${checked ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                          {checked ? '✓ В наряде' : 'Выбрать'}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {isUserAdmin && modalSlot && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
              <div className="bg-white w-full max-w-md rounded-t-3xl p-4 space-y-3 max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b pb-2">
                  <input
                    type="text"
                    defaultValue={modalSlot.slot.title}
                    onBlur={(e) => handleRenameSlot(modalSlot.date, modalSlot.slot, e.target.value)}
                    className="text-sm font-extrabold text-slate-900 border-b border-dashed outline-none w-full"
                  />
                  <button onClick={() => setModalSlot(null)} className="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                </div>
                <button onClick={() => replaceWithRandomLeastLoaded(modalSlot.date, modalSlot.slot)} className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">
                  🎲 Случайный (из менее загруженных)
                </button>
                <div className="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
                  <button onClick={() => setAssignMode('REGULAR')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'REGULAR' ? 'bg-white text-indigo-600' : 'text-slate-600'}`}>Очередь</button>
                  <button onClick={() => setAssignMode('DEBT_COVER')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'DEBT_COVER' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>В долг</button>
                  <button onClick={() => setAssignMode('PENALTY')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'PENALTY' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}>Штраф</button>
                </div>
                <div className="overflow-y-auto divide-y divide-slate-100 border rounded-xl">
                  {members
                    .filter((m) => m.status === 'ACTIVE')
                    .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))
                    .map((m) => (
                      <div key={m.id} className="p-2.5 flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold">{m.fullName} ({m.squad} отд.)</div>
                          <div className="text-[10px] text-slate-500">Индекс: {(statsMap[m.id]?.score || 0).toFixed(1)}</div>
                        </div>
                        <button onClick={() => handleAssignMember(m.id)} className="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-xl">
                          Назначить
                        </button>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          {isUserAdmin && addSlotDate && (
            <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
              <form onSubmit={handleAddCustomSlotToDay} className="bg-white w-full max-w-md rounded-t-3xl p-4 space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <div className="text-sm font-extrabold text-slate-900">+ Нагрузка на {formatRuDate(addSlotDate)}</div>
                  <button type="button" onClick={() => setAddSlotDate(null)} className="w-8 h-8 rounded-full bg-slate-100 font-bold">✕</button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Название (напр. ПХД)"
                  value={customSlotTitle}
                  onChange={(e) => setCustomSlotTitle(e.target.value)}
                  className="w-full px-3 py-2 border rounded-xl text-xs"
                />
                <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">
                  Добавить
                </button>
              </form>
            </div>
          )}

          <nav className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-200 grid ${isUserAdmin ? 'grid-cols-5' : 'grid-cols-4'} py-2 z-30`}>
            <button onClick={() => setTab('SCHEDULE')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'SCHEDULE' ? 'text-indigo-600' : 'text-slate-400'}`}>
              <span>📅</span><span>График</span>
            </button>
            <button onClick={() => setTab('STATS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'STATS' ? 'text-indigo-600' : 'text-slate-400'}`}>
              <span>📊</span><span>Таблица</span>
            </button>
            <button onClick={() => setTab('DEBTS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'DEBTS' ? 'text-indigo-600' : 'text-slate-400'}`}>
              <span>🤝</span><span>Долги ({totalActiveDebts})</span>
            </button>
            {isUserAdmin && (
              <button onClick={() => setTab('TASKS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'TASKS' ? 'text-indigo-600' : 'text-slate-400'}`}>
                <span>⚙️</span><span>Нагрузки</span>
              </button>
            )}
            <button onClick={() => setTab('CLOUD')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'CLOUD' ? 'text-indigo-600' : 'text-slate-400'}`}>
              <span>☁️</span><span>Облако</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
