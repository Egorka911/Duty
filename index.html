    const STATUS_INFO = {
      ACTIVE: { label: 'В строю', color: 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-800' },
      SICK: { label: 'Больничный', color: 'bg-rose-100 text-rose-800 border-rose-200 dark:bg-rose-950 dark:text-rose-300 dark:border-rose-800' },
      LEAVE: { label: 'Отпуск', color: 'bg-slate-200 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700' },
    };
    const SQUAD_BADGE = {
      1: 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300',
      2: 'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300',

    };

    const toISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const addDaysISO = (isoStr, days) => {
      const d = new Date(isoStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return toISO(d);
    };
    const daysDiff = (a, b) => {
      const tA = new Date(a + 'T00:00:00').getTime();
      const tB = new Date(b + 'T00:00:00').getTime();
      return Math.round(Math.abs(tA - tB) / 86400000);
    };
    const formatRuDate = (iso) => {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('ru-RU', { weekday: 'short', day: '2-digit', month: 'short' });
    };

    function HighlightText({ text, query }) {
      if (!query || !query.trim()) return <span>{text}</span>;
      const q = query.trim();
      const parts = text.split(new RegExp(`(${q})`, 'gi'));
      return (
        <span>
          {parts.map((part, i) =>
            part.toLowerCase() === q.toLowerCase()
              ? <mark key={i} className="bg-amber-300 text-slate-950 rounded px-0.5 font-extrabold">{part}</mark>
              : <span key={i}>{part}</span>
          )}
        </span>
      );
    }

    const SUPA_URL = 'https://yasxjwbyhiryslkwfhof.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhc3hqd2J5aGlyeXNsa3dmaG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjE5NjUsImV4cCI6MjEwNzczNzk2NX0.WB4ANU1rdyXsF43aRNuXZ1bchUfhdZ4BNahTu6vtnPE';
    const ROOM_CODE = 'battery_main';

    const supabaseClient = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;

    // ==== ВАЛИДАТОР ГРАФИКА ====
    const validateSchedule = (scheduleMap, memberList) => {
      const errors = [];
      const warnings = [];
      const memberIds = new Set(memberList.map((m) => m.id));
      let emptySlots = 0;

      Object.entries(scheduleMap).forEach(([date, day]) => {
        const assignedToday = new Set();
        (day.batteryDutyIds || []).forEach((id) => {
          if (!memberIds.has(id)) errors.push(`${date}: неизвестный боец ${id}`);
          if (assignedToday.has(id)) errors.push(`${date}: двойное назначение ${id}`);
          assignedToday.add(id);
        });
        (day.slots || []).forEach((slot) => {
          if (!slot.memberId) { warnings.push(`${date}: свободна «${slot.title}»`); emptySlots++; return; }
          if (!memberIds.has(slot.memberId)) errors.push(`${date}: неизвестный боец ${slot.memberId}`);
          if (assignedToday.has(slot.memberId)) errors.push(`${date}: двойное назначение ${slot.memberId}`);
          assignedToday.add(slot.memberId);
        });
      });
      return { errors, warnings, emptySlots };
    };

    function BatteryDutyApp() {
      const todayISO = useMemo(() => toISO(new Date()), []);

      const [tab, setTab] = useState('SCHEDULE');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('bat_dark') === '1');
      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('⏳ Синхронизация...');

      const [calendarMonthISO, setCalendarMonthISO] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [selectedDayISO, setSelectedDayISO] = useState(() => toISO(new Date()));
      const [dayFilterMode, setDayFilterMode] = useState('ALL_MONTH');
      const [showOnlyUnassigned, setShowOnlyUnassigned] = useState(false);

      const [members, setMembers] = useState(() => {
        const s = localStorage.getItem('bat_v9_members');
        return s ? JSON.parse(s) : INITIAL_MEMBERS;
      });
      const [taskTemplates, setTaskTemplates] = useState(() => {
        const s = localStorage.getItem('bat_v9_templates');
        return s ? JSON.parse(s) : INITIAL_TEMPLATES;
      });
      const [schedules, setSchedules] = useState(() => {
        const s = localStorage.getItem('bat_v9_schedules');
        return s ? JSON.parse(s) : {};
      });
      const [debts, setDebts] = useState(() => {
        const s = localStorage.getItem('bat_v9_debts');
        return s ? JSON.parse(s) : [];
      });
      const [batteryWeight, setBatteryWeight] = useState(() => {
        const s = localStorage.getItem('bat_v9_bweight');
        return s !== null ? Number(s) : 0.5;
      });
      const [protectRestDay, setProtectRestDay] = useState(true);
      const [logs, setLogs] = useState(() => {
        const s = localStorage.getItem('bat_v9_logs');
        return s ? JSON.parse(s) : [];
      });
      const [backups, setBackups] = useState(() => {
        const s = localStorage.getItem('bat_v9_backups');
        return s ? JSON.parse(s) : [];
      });

      const lastSyncTimestampRef = useRef(0);

      const [statSquadFilter, setStatSquadFilter] = useState(0);
      const [statStatusFilter, setStatStatusFilter] = useState('ALL');
      const [statTaskFilter, setStatTaskFilter] = useState('ALL');
      const [statDateScope, setStatDateScope] = useState('ALL');
      const [statCustomFrom, setStatCustomFrom] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [statCustomTo, setStatCustomTo] = useState(() => toISO(new Date()));
      const [statSearch, setStatSearch] = useState('');
      const [statSortBy, setStatSortBy] = useState('SCORE_DESC');

      const [confirmDialog, setConfirmDialog] = useState(null);
      const [recalcModalOpen, setRecalcModalOpen] = useState(false);
      const [modalSlot, setModalSlot] = useState(null);
      const [assignMode, setAssignMode] = useState('REGULAR');
      const [batteryModalDate, setBatteryModalDate] = useState(null);
      const [addSlotDate, setAddSlotDate] = useState(null);
      const [customSlotTitle, setCustomSlotTitle] = useState('');
      const [customSlotWeight, setCustomSlotWeight] = useState(1.0);
      const [testResults, setTestResults] = useState(null);

      const [newTplTitle, setNewTplTitle] = useState('');
      const [newTplCount, setNewTplCount] = useState(1);
      const [newTplWeight, setNewTplWeight] = useState(1.0);

      useEffect(() => { localStorage.setItem('bat_dark', darkMode ? '1' : '0'); }, [darkMode]);
      useEffect(() => localStorage.setItem('bat_v9_members', JSON.stringify(members)), [members]);
      useEffect(() => localStorage.setItem('bat_v9_templates', JSON.stringify(taskTemplates)), [taskTemplates]);
      useEffect(() => localStorage.setItem('bat_v9_schedules', JSON.stringify(schedules)), [schedules]);
      useEffect(() => localStorage.setItem('bat_v9_debts', JSON.stringify(debts)), [debts]);
      useEffect(() => localStorage.setItem('bat_v9_bweight', String(batteryWeight)), [batteryWeight]);
      useEffect(() => localStorage.setItem('bat_v9_logs', JSON.stringify(logs)), [logs]);
      useEffect(() => localStorage.setItem('bat_v9_backups', JSON.stringify(backups)), [backups]);

      useEffect(() => {
        const anyModal = Boolean(confirmDialog) || recalcModalOpen || Boolean(modalSlot) ||
          Boolean(batteryModalDate) || Boolean(addSlotDate);
        document.body.style.overflow = anyModal ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [confirmDialog, recalcModalOpen, modalSlot, batteryModalDate, addSlotDate]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };
      const getMember = (id, list = members) => list.find((m) => m.id === id);
      const getName = (id, list = members) => {
        const m = getMember(id, list);
        return m ? `${m.fullName} (${m.squad} отд.)` : 'Не назначен';
      };

      const currentMonthInfo = useMemo(() => {
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const daysInMonth = new Date(y, m, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const datesList = [];
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          datesList.push(iso);
          cells.push({ dayNum: d, iso });
        }
        const monthTitle = firstDay.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        return { year: y, month: m, firstDateISO: datesList[0], lastDateISO: datesList[datesList.length - 1], daysInMonth, datesList, cells, monthTitle };
      }, [calendarMonthISO]);

      const changeMonth = (delta) => {
        haptic('light');
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const next = new Date(y, m - 1 + delta, 1);
        setCalendarMonthISO(`${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`);
        setDayFilterMode('ALL_MONTH');
      };

      const goToToday = () => {
        haptic('light');
        const now = new Date();
        const thisMonthISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        const tISO = toISO(now);
        setCalendarMonthISO(thisMonthISO);
        setSelectedDayISO(tISO);
        setDayFilterMode('ALL_MONTH');
        setTimeout(() => {
          const el = document.getElementById(`day-card-${tISO}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      };

      // ==== СИНХРОНИЗАЦИЯ ====
      const applyRemoteState = (st, updatedAtStr) => {
        if (!st || typeof st !== 'object') return;
        const remoteTs = updatedAtStr ? new Date(updatedAtStr).getTime() : Date.now();
        if (remoteTs <= lastSyncTimestampRef.current) return;
        lastSyncTimestampRef.current = remoteTs;

        if (Array.isArray(st.members)) setMembers(st.members);
        if (Array.isArray(st.taskTemplates)) setTaskTemplates(st.taskTemplates);

        if (st.schedules) {
          setSchedules((prev) => {
            const merged = { ...prev, ...st.schedules };
            Object.keys(merged).forEach((d) => {
              const day = merged[d];
              if (day?.batteryDutyIds) day.batteryDutyIds = Array.from(new Set(day.batteryDutyIds));
            });
            return merged;
          });
        }
        if (Array.isArray(st.debts)) {
          setDebts((prev) => {
            const byId = new Map(prev.map((d) => [d.id, d]));
            st.debts.forEach((rd) => {
              const local = byId.get(rd.id);
              if (!local || (rd.count || 0) >= (local.count || 0)) byId.set(rd.id, rd);
            });
            return Array.from(byId.values()).filter((d) => (d.count || 0) > 0);
          });
        }
        if (st.batteryWeight !== undefined) setBatteryWeight(st.batteryWeight);
        if (Array.isArray(st.logs)) {
          setLogs((prev) => {
            const byId = new Map(prev.map((l) => [l.id, l]));
            st.logs.forEach((rl) => { if (!byId.has(rl.id)) byId.set(rl.id, rl); });
            return Array.from(byId.values()).slice(0, 100);
          });
        }
        if (Array.isArray(st.backups)) setBackups(st.backups);
        setCloudStatus('🟢 Live-синхронизация активна');
      };

      const pushToCloudNow = async (overrides = {}) => {
        if (!isUserAdmin) return false;
        const nowIso = new Date().toISOString();
        lastSyncTimestampRef.current = new Date(nowIso).getTime();
        const nextState = {
          members: overrides.members ?? members,
          taskTemplates: overrides.taskTemplates ?? taskTemplates,
          schedules: overrides.schedules ?? schedules,
          debts: overrides.debts ?? debts,
          batteryWeight: overrides.batteryWeight ?? batteryWeight,
          logs: overrides.logs ?? logs,
          backups: overrides.backups ?? backups,
        };
        try {
          setCloudStatus('⏳ Сохранение изменений...');
          const res = await fetch(`${SUPA_URL}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPA_KEY,
              Authorization: `Bearer ${SUPA_KEY}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify({ room_code: ROOM_CODE, state_json: nextState, updated_at: nowIso }),
          });
          if (!res.ok) { setCloudStatus(`❌ Ошибка сохранения (${res.status})`); return false; }
          setCloudStatus('🟢 Все изменения синхронизированы');
          return true;
        } catch (e) { setCloudStatus('❌ Ошибка сети'); return false; }
      };

      const pullFromCloudNow = async (silent = false) => {
        try {
          if (!silent) setCloudStatus('⏳ Загрузка из облака...');
          const res = await fetch(
            `${SUPA_URL}/rest/v1/duty_sync?room_code=eq.${ROOM_CODE}&select=state_json,updated_at`,
            { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Cache-Control': 'no-cache' } }
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data?.[0]?.state_json && typeof data[0].state_json === 'object') {
            applyRemoteState(data[0].state_json, data[0].updated_at);
          }
        } catch (e) { if (!silent) setCloudStatus('⚠️ Автономный режим'); }
      };

      // ==== ОБНОВЛЕНИЕ РАЗ В 60 СЕКУНД + VISIBILITY + REALTIME ====
      useEffect(() => {
        let cancelled = false;
        let channel = null;

        const loadCloudState = async (silent = false) => {
          if (cancelled) return;
          await pullFromCloudNow(silent);
        };

        loadCloudState(false);

        if (supabaseClient) {
          channel = supabaseClient
            .channel('public:duty_sync')
            .on('postgres_changes',
              { event: '*', schema: 'public', table: 'duty_sync', filter: `room_code=eq.${ROOM_CODE}` },
              (payload) => {
                if (!cancelled && payload?.new?.state_json) {
                  applyRemoteState(payload.new.state_json, payload.new.updated_at);
                }
              }
            ).subscribe();
        }

        const interval = setInterval(() => loadCloudState(true), 60000); // было 5000

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') loadCloudState(true);
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          cancelled = true;
          clearInterval(interval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (channel && supabaseClient) supabaseClient.removeChannel(channel);
        };
      }, []);

      const createLogAndBackup = (actionTitle, detailsText, createSnapshot = false, type = 'OTHER') => {
        const timeStr = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const author = tg?.initDataUnsafe?.user?.first_name || `ID:${currentTelegramId || 'Админ'}`;
        const newEntry = {
          id: `log_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          time: timeStr, author, action: actionTitle, details: detailsText, type,
        };
        const nextLogs = [newEntry, ...logs.slice(0, 99)];
        setLogs(nextLogs);
        let nextBackups = backups;
        if (createSnapshot) {
          const snap = {
            id: `bk_${Date.now()}`, time: timeStr,
            label: `${actionTitle}: ${detailsText.slice(0, 40)}`,
            schedules: JSON.parse(JSON.stringify(schedules)),
            debts: JSON.parse(JSON.stringify(debts)),
            members: JSON.parse(JSON.stringify(members)),
          };
          nextBackups = [snap, ...backups.slice(0, 9)];
          setBackups(nextBackups);
        }
        return { nextLogs, nextBackups };
      };

      const restoreBackupSnapshot = (snap) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: '⏪ Восстановить бэкап?',
          message: `График вернется к состоянию от ${snap.time} («${snap.label}»).`,
          confirmLabel: 'Восстановить',
          onConfirm: () => {
            setSchedules(snap.schedules);
            setDebts(snap.debts || []);
            if (snap.members) setMembers(snap.members);
            const { nextLogs } = createLogAndBackup('⏪ Откат из бэкапа', `Восстановлена версия от ${snap.time}`, false, 'RESTORE');
            pushToCloudNow({ schedules: snap.schedules, debts: snap.debts || [], members: snap.members || members, logs: nextLogs });
            setConfirmDialog(null);
            showToast('⏪ График восстановлен!');
          },
        });
      };

      const isOnBatteryDuty = (memberId, dateStr, schedMap = schedules) =>
        Boolean(schedMap[dateStr]?.batteryDutyIds?.includes(memberId));

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      const allWorkloadTitles = useMemo(() => {
        const titles = new Set(taskTemplates.map((t) => t.title));
        Object.values(schedules).forEach((day) => {
          (day?.slots || []).forEach((s) => { if (s.title) titles.add(s.title); });
        });
        return Array.from(titles);
      }, [taskTemplates, schedules]);

      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = {
            ...m, regularShifts: 0, penaltyShifts: 0, batteryCount: 0,
            totalAll: 0, score: m.baseScore || 0, owesCount: 0, owedToMeCount: 0, byTitle: {},
          };
        });

        Object.keys(schedules).sort().forEach((date) => {
          if (statDateScope === 'MONTH') {
            if (date < currentMonthInfo.firstDateISO || date > currentMonthInfo.lastDateISO) return;
          } else if (statDateScope === 'CUSTOM') {
            if (date < statCustomFrom || date > statCustomTo) return;
          }
          const day = schedules[date];
          if (!day) return;
          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) {
              map[mId].batteryCount += 1;
              map[mId].totalAll += 1;
              map[mId].score += Number(batteryWeight) || 0;
            }
          });
          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalAll += 1;
            const w = Number(s.weight) || 1.0;
            st.byTitle[s.title] = (st.byTitle[s.title] || 0) + 1;
            if (s.isPenalty) st.penaltyShifts += 1;
            else { st.regularShifts += 1; st.score += w; }
          });
        });

        debts.forEach((d) => {
          if (map[d.debtorId]) map[d.debtorId].owesCount += d.count;
          if (map[d.creditorId]) map[d.creditorId].owedToMeCount += d.count;
        });
        return map;
      }, [members, schedules, batteryWeight, debts, statDateScope, currentMonthInfo, statCustomFrom, statCustomTo]);

      const fairnessMetrics = useMemo(() => {
        const activeList = Object.values(statsMap).filter((m) => m.status === 'ACTIVE');
        if (activeList.length === 0) return { index: 100, stdDev: 0, min: 0, max: 0, avg: 0 };
        const scores = activeList.map((m) => m.score);
        const min = Math.min(...scores);
        const max = Math.max(...scores);
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
        const variance = scores.reduce((acc, s) => acc + Math.pow(s - avg, 2), 0) / scores.length;
        const stdDev = Math.sqrt(variance);
        const index = Math.max(0, Math.min(100, Math.round(100 - stdDev * 18)));
        return { index, stdDev, min, max, avg };
      }, [statsMap]);

      const filteredStatsList = useMemo(() => {
        return Object.values(statsMap)
          .filter((st) => {
            if (statSquadFilter !== 0 && st.squad !== statSquadFilter) return false;
            if (statStatusFilter !== 'ALL' && st.status !== statStatusFilter) return false;
            if (statSearch.trim() && !st.fullName.toLowerCase().includes(statSearch.trim().toLowerCase())) return false;
            if (statTaskFilter !== 'ALL') {
              if (statTaskFilter === 'BATTERY' && (st.batteryCount || 0) === 0) return false;
              if (statTaskFilter === 'PENALTY' && (st.penaltyShifts || 0) === 0) return false;
              if (statTaskFilter !== 'BATTERY' && statTaskFilter !== 'PENALTY' && (st.byTitle[statTaskFilter] || 0) === 0) return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (statSortBy === 'NAME_ASC') return a.fullName.localeCompare(b.fullName, 'ru');
            if (statSortBy === 'SCORE_ASC') return a.score - b.score;
            if (statSortBy === 'TOTAL_DESC') return b.totalAll - a.totalAll;
            if (statSortBy === 'TASK_DESC') {
              const getVal = (item) => {
                if (statTaskFilter === 'ALL') return item.totalAll;
                if (statTaskFilter === 'BATTERY') return item.batteryCount;
                if (statTaskFilter === 'PENALTY') return item.penaltyShifts;
                return item.byTitle[statTaskFilter] || 0;
              };
              return getVal(b) - getVal(a);
            }
            return b.score - a.score;
          });
      }, [statsMap, statSquadFilter, statStatusFilter, statSearch, statSortBy, statTaskFilter]);

      // ==== ГЕНЕРАТОР С УЛУЧШЕНИЯМИ ====
      const canAssignMember = ({ member, dateStr, usedToday, schedulesMap, protectRestDay }) => {
        if (member.status !== 'ACTIVE') return false;
        if (usedToday.has(member.id)) return false;
        if (protectRestDay) {
          const prev = addDaysISO(dateStr, -1);
          if (schedulesMap[prev]?.batteryDutyIds?.includes(member.id)) return false;
        }
        return true;
      };

      const runScheduleGenerator = (baseSchedules, keepExistingSlots, periodStart, periodDays, currentMembers, currentTemplates, currentDebts) => {
        const updated = JSON.parse(JSON.stringify(baseSchedules));
        const workload = {};
        let workingDebts = JSON.parse(JSON.stringify(currentDebts));
        let autoRepaidCount = 0;

        currentMembers.forEach((m) => {
          workload[m.id] = { score: Number(m.baseScore) || 0, totalTasks: 0, byTitle: {}, lastDate: null };
        });

        const addWorkload = (memberId, title, weight, dateStr) => {
          const it = workload[memberId];
          if (!it) return;
          const w = Number(weight) || 1;
          it.score += w;
          it.totalTasks += 1;
          it.byTitle[title] = (it.byTitle[title] || 0) + 1;
          it.lastDate = dateStr;
        };

        const base = new Date(periodStart + 'T00:00:00');
        const period = [];
        for (let i = 0; i < periodDays; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        // История до периода
        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (workload[mId]) {
                workload[mId].score += Number(batteryWeight) || 0;
                workload[mId].lastDate = dKey;
              }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && workload[s.memberId] && !s.isPenalty) {
                addWorkload(s.memberId, s.title, s.weight, dKey);
              } else if (s.memberId && workload[s.memberId]) {
                workload[s.memberId].lastDate = dKey;
              }
            });
          }
        });

        period.forEach((dateStr) => {
          const existing = updated[dateStr];
          const batteryDutyIds = Array.from(new Set(existing?.batteryDutyIds || []));
          batteryDutyIds.forEach((mId) => {
            if (workload[mId]) {
              workload[mId].score += Number(batteryWeight) || 0;
              workload[mId].lastDate = dateStr;
            }
          });

          const templateSlots = [];
          currentTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr, title: tpl.title, weight: tpl.weight,
                memberId: null, isPenalty: false, isManual: false, repaidForName: null, unassignedReason: null,
              });
            }
          });

          let slots = templateSlots;
          if (existing && keepExistingSlots && existing.slots && existing.slots.length > 0) {
            slots = existing.slots.map((s) => {
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, repaidForName: null, unassignedReason: null };
              }
              return s.memberId ? { ...s } : { ...s, memberId: null, isPenalty: false, repaidForName: null, unassignedReason: null };
            });
          }

          const usedToday = new Set(batteryDutyIds);
          slots.forEach((slot) => {
            if (slot.memberId) {
              usedToday.add(slot.memberId);
              if (!slot.isPenalty && workload[slot.memberId]) {
                addWorkload(slot.memberId, slot.title, slot.weight, dateStr);
              } else if (workload[slot.memberId]) {
                workload[slot.memberId].lastDate = dateStr;
              }
            }
          });

          // Роль вчера — для штрафа повтора
          const yesterday = addDaysISO(dateStr, -1);
          const yesterdaySlots = updated[yesterday]?.slots || [];

          slots.forEach((slot) => {
            if (slot.memberId) return;

            const eligible = currentMembers.filter((m) =>
              canAssignMember({ member: m, dateStr, usedToday, schedulesMap: updated, protectRestDay })
            );

            const scored = eligible.map((m) => {
              const w = workload[m.id] || { score: 0, totalTasks: 0, byTitle: {} };
              const roleCnt = w.byTitle[slot.title] || 0;
              const cooldown = w.lastDate && daysDiff(dateStr, w.lastDate) <= 2;
              const hadSameRoleYesterday = yesterdaySlots.some((s) => s.memberId === m.id && s.title === slot.title);
              const repeatPenalty = hadSameRoleYesterday ? 10 : 0;

              const priority =
                w.score +
                w.totalTasks * 0.5 +
                roleCnt * 2.2 +
                repeatPenalty +
                (cooldown ? 1000 : 0);

              return { m, priority, roleCnt };
            });

            // Детерминированная сортировка
            scored.sort((a, b) => {
              if (a.priority !== b.priority) return a.priority - b.priority;
              if (a.roleCnt !== b.roleCnt) return a.roleCnt - b.roleCnt;
              return a.m.fullName.localeCompare(b.m.fullName, 'ru');
            });

            if (scored.length === 0) {
              slot.unassignedReason = protectRestDay
                ? 'Нет свободных с учётом отдыха после наряда'
                : 'Нет свободных бойцов';
              return;
            }

            const minP = scored[0].priority;
            const bestPool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.15);
            let chosen = bestPool[0].m;
            let repaidForName = null;

            const activeDebt = workingDebts.find(
              (d) => d.creditorId === chosen.id && d.count > 0 && eligible.some((el) => el.id === d.debtorId)
            );
            if (activeDebt) {
              const debtorMember = getMember(activeDebt.debtorId, currentMembers);
              if (debtorMember) {
                repaidForName = chosen.fullName;
                chosen = debtorMember;
                activeDebt.count -= 1;
                autoRepaidCount += 1;
              }
            }

            slot.memberId = chosen.id;
            slot.repaidForName = repaidForName;
            slot.unassignedReason = null;
            usedToday.add(chosen.id);
            addWorkload(chosen.id, slot.title, slot.weight, dateStr);
          });

          updated[dateStr] = { date: dateStr, batteryDutyIds, slots };
        });

        return {
          updatedSchedules: updated,
          updatedDebts: workingDebts.filter((d) => d.count > 0),
          autoRepaidCount,
        };
      };

      const reportGenerationResult = (updatedSchedules) => {
        const { errors, emptySlots } = validateSchedule(updatedSchedules, members);
        if (errors.length > 0) {
          showToast(`⚠️ Ошибок в графике: ${errors.length}. См. «Журнал».`);
          console.warn('Schedule errors:', errors);
        } else if (emptySlots > 0) {
          showToast(`График создан. Осталось свободных задач: ${emptySlots}`);
        } else {
          showToast('✅ График полностью заполнен, ошибок нет');
        }
      };

      const fillEmptyDaysInMonth = () => {
        if (!isUserAdmin) return;
        haptic('medium');
        const { nextLogs, nextBackups } = createLogAndBackup(
          '⚡ Заполнение месяца', `Заполнены пустые дни за ${currentMonthInfo.monthTitle}`, true, 'RECALC'
        );
        const { updatedSchedules, updatedDebts } = runScheduleGenerator(
          schedules, true, currentMonthInfo.firstDateISO, currentMonthInfo.daysInMonth,
          members, taskTemplates, debts
        );
        setSchedules(updatedSchedules);
        setDebts(updatedDebts);
        pushToCloudNow({ schedules: updatedSchedules, debts: updatedDebts, logs: nextLogs, backups: nextBackups });
        reportGenerationResult(updatedSchedules);
      };

      const executeRecalculate = (onlyFromToday) => {
        if (!isUserAdmin) return;
        haptic('medium');
        let startISO = currentMonthInfo.firstDateISO;
        let countDays = currentMonthInfo.daysInMonth;
        if (onlyFromToday && todayISO >= currentMonthInfo.firstDateISO && todayISO <= currentMonthInfo.lastDateISO) {
          startISO = todayISO;
          countDays = daysDiff(currentMonthInfo.lastDateISO, todayISO) + 1;
        }
        const { nextLogs, nextBackups } = createLogAndBackup(
          '🔄 Пересчет графика', `Период с ${startISO} (${countDays} дн.). Прошедшие дни сохранены.`, true, 'RECALC'
        );
        const { updatedSchedules, updatedDebts } = runScheduleGenerator(
          schedules, false, startISO, countDays, members, taskTemplates, debts
        );
        setSchedules(updatedSchedules);
        setDebts(updatedDebts);
        pushToCloudNow({ schedules: updatedSchedules, debts: updatedDebts, logs: nextLogs, backups: nextBackups });
        setRecalcModalOpen(false);
        reportGenerationResult(updatedSchedules);
      };

      const askConfirmClearDay = (dateStr) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: `🗑 Очистить сутки ${formatRuDate(dateStr)}?`,
          message: `Все задачи по классу и суточные наряды на ${dateStr} будут сняты. Остальные дни не изменятся.`,
          confirmLabel: 'Да, очистить сутки',
          onConfirm: () => {
            haptic('medium');
            const { nextLogs, nextBackups } = createLogAndBackup(
              '🗑 Очистка суток', `Очищены все задачи на ${formatRuDate(dateStr)} (${dateStr})`, true, 'CLEAR'
            );
            const nextSchedules = { ...schedules, [dateStr]: { date: dateStr, batteryDutyIds: [], slots: [] } };
            setSchedules(nextSchedules);
            pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
            setConfirmDialog(null);
            showToast(`Сутки ${formatRuDate(dateStr)} очищены`);
          },
        });
      };

      const handleAssignMember = (newMemberId) => {
        if (!isUserAdmin || !modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const oldMemberId = slot.memberId;
        const oldName = getName(oldMemberId);
        const newName = getName(newMemberId);
        const isPenalty = assignMode === 'PENALTY';
        const isDebtCover = assignMode === 'DEBT_COVER';
        let repaidLabel = null;
        let nextDebts = [...debts];

        if (isDebtCover && oldMemberId && oldMemberId !== newMemberId) {
          const reverseIdx = nextDebts.findIndex((d) => d.debtorId === newMemberId && d.creditorId === oldMemberId && d.count > 0);
          if (reverseIdx !== -1) {
            nextDebts[reverseIdx] = { ...nextDebts[reverseIdx], count: nextDebts[reverseIdx].count - 1 };
            nextDebts = nextDebts.filter((d) => d.count > 0);
          } else {
            const existIdx = nextDebts.findIndex((d) => d.debtorId === oldMemberId && d.creditorId === newMemberId);
            if (existIdx !== -1) {
              nextDebts[existIdx] = { ...nextDebts[existIdx], count: nextDebts[existIdx].count + 1, lastReason: `${formatRuDate(date)} (${slot.title})` };
            } else {
              nextDebts.push({
                id: `debt_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
                debtorId: oldMemberId, creditorId: newMemberId, count: 1,
                lastReason: `${formatRuDate(date)} (${slot.title})`,
              });
            }
          }
          repaidLabel = `Подмена за ${getMember(oldMemberId)?.fullName}`;
        }

        const nextSchedules = {
          ...schedules,
          [date]: {
            ...schedules[date],
            slots: (schedules[date]?.slots || []).map((s) =>
              s.id === slot.id
                ? { ...s, memberId: newMemberId, isPenalty, isManual: true, repaidForName: repaidLabel, unassignedReason: null }
                : s
            ),
          },
        };

        const { nextLogs, nextBackups } = createLogAndBackup(
          isDebtCover ? '🤝 Подмена в долг' : isPenalty ? '⚠ Штрафной наряд' : '🔄 Замена в смене',
          `${formatRuDate(date)} [${slot.title}]: ${oldName} → ${newName}`, true,
          isDebtCover ? 'DEBT' : isPenalty ? 'PENALTY' : 'ASSIGNMENT'
        );

        setSchedules(nextSchedules);
        setDebts(nextDebts);
        pushToCloudNow({ schedules: nextSchedules, debts: nextDebts, logs: nextLogs, backups: nextBackups });
        setModalSlot(null);
        showToast(`✅ Замена: ${newName}`);
      };

      const clearSlotAssignment = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('light');
        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: (schedules[dateStr]?.slots || []).map((s) =>
              s.id === slotObj.id
                ? { ...s, memberId: null, isManual: false, isPenalty: false, repaidForName: null, unassignedReason: null }
                : s
            ),
          },
        };
        const { nextLogs } = createLogAndBackup(
          '🧹 Снят боец', `${formatRuDate(dateStr)} [${slotObj.title}]: ${getName(slotObj.memberId)} снят`, false, 'ASSIGNMENT'
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs });
        showToast('Боец снят с задачи');
      };

      const replaceWithRandomLeastLoaded = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);
        const eligible = members.filter(
          (m) => m.status === 'ACTIVE' && !usedToday.has(m.id) &&
            m.id !== slotObj.memberId && !isRecoveringFromBatteryDuty(m.id, dateStr)
        );
        if (eligible.length === 0) { showToast('Нет свободных бойцов на этот день!'); return; }

        const sorted = eligible.map((m) => ({ m, score: statsMap[m.id]?.score || 0 })).sort((a, b) => a.score - b.score);
        const minScore = sorted[0].score;
        let pool = sorted.filter((x) => x.score <= minScore + 1.2);
        if (pool.length < 3) pool = sorted.slice(0, Math.min(4, sorted.length));
        const chosen = pool[Math.floor(Math.random() * pool.length)].m;
        const oldName = getName(slotObj.memberId);
        const newName = getName(chosen.id);

        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: schedules[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: chosen.id, isManual: true, repaidForName: null, unassignedReason: null } : s
            ),
          },
        };
        const { nextLogs, nextBackups } = createLogAndBackup(
          '🎲 Случайная замена', `${formatRuDate(dateStr)} [${slotObj.title}]: ${oldName} → ${newName}`, true, 'ASSIGNMENT'
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
        showToast(`🎲 Выбран: ${chosen.fullName}`);
        if (modalSlot) setModalSlot(null);
      };

      const replaceWithBestCandidate = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).filter((s) => s.id !== slotObj.id).map((s) => s.memberId).filter(Boolean),
        ]);
        const best = members
          .filter((m) => m.status === 'ACTIVE' && !usedToday.has(m.id) && !isRecoveringFromBatteryDuty(m.id, dateStr))
          .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))[0];
        if (!best) { showToast('Кандидат не найден'); return; }

        const oldName = getName(slotObj.memberId);
        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: schedules[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: best.id, isManual: true, repaidForName: null, unassignedReason: null } : s
            ),
          },
        };
        const { nextLogs, nextBackups } = createLogAndBackup(
          '⭐ Лучший кандидат', `${formatRuDate(dateStr)} [${slotObj.title}]: ${oldName} → ${best.fullName}`, true, 'ASSIGNMENT'
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs, backups: nextBackups });
        showToast(`⭐ Назначен: ${best.fullName}`);
        if (modalSlot) setModalSlot(null);
      };

      const toggleBatteryDutyMember = (dateStr, memberId) => {
        if (!isUserAdmin) return;
        haptic('light');
        const day = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const currentList = Array.from(new Set(day.batteryDutyIds || []));
        const exists = currentList.includes(memberId);
        const nextList = exists ? currentList.filter((id) => id !== memberId) : Array.from(new Set([...currentList, memberId]));
        const updatedSchedules = { ...schedules, [dateStr]: { ...day, batteryDutyIds: nextList } };

        if (!exists) {
          const datesToCheck = protectRestDay ? [dateStr, addDaysISO(dateStr, 1)] : [dateStr];
          datesToCheck.forEach((dKey) => {
            const targetDay = updatedSchedules[dKey];
            if (!targetDay?.slots) return;
            const busy = new Set([
              ...(targetDay.batteryDutyIds || []),
              ...targetDay.slots.map((s) => s.memberId).filter(Boolean),
            ]);
            targetDay.slots = targetDay.slots.map((slot) => {
              if (slot.memberId !== memberId) return slot;
              const replacement = members
                .filter((m) => m.status === 'ACTIVE' && !busy.has(m.id) && !isRecoveringFromBatteryDuty(m.id, dKey, updatedSchedules))
                .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0))[0];
              if (replacement) { busy.add(replacement.id); return { ...slot, memberId: replacement.id, isManual: true }; }
              return { ...slot, memberId: null };
            });
          });
        }

        const { nextLogs, nextBackups } = createLogAndBackup(
          '🛡️ Наряд по батарее',
          `${formatRuDate(dateStr)}: ${getName(memberId)} (${exists ? 'снят' : 'назначен'})`, true, 'BATTERY'
        );
        setSchedules(updatedSchedules);
        pushToCloudNow({ schedules: updatedSchedules, logs: nextLogs, backups: nextBackups });
      };

      const handleAddCustomSlotToDay = (e) => {
        e.preventDefault();
        if (!isUserAdmin || !addSlotDate || !customSlotTitle.trim()) return;
        const day = schedules[addSlotDate] || { date: addSlotDate, batteryDutyIds: [], slots: [] };
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);
        const eligible = members
          .filter((m) => m.status === 'ACTIVE' && !usedToday.has(m.id) && !isRecoveringFromBatteryDuty(m.id, addSlotDate))
          .sort((a, b) => (statsMap[a.id]?.score || 0) - (statsMap[b.id]?.score || 0));
        const chosen = eligible[0] || null;
        const newSlot = {
          id: `${addSlotDate}_custom_${Date.now()}`,
          date: addSlotDate,
          title: customSlotTitle.trim(),
          weight: Number(customSlotWeight) || 1.0,
          memberId: chosen ? chosen.id : null,
          isPenalty: false, isManual: true, repaidForName: null, unassignedReason: null,
        };
        const nextSchedules = {
          ...schedules,
          [addSlotDate]: { ...day, slots: [...(day.slots || []), newSlot] },
        };
        const { nextLogs } = createLogAndBackup(
          '➕ Добавлена задача',
          `${formatRuDate(addSlotDate)}: «${newSlot.title}» → ${chosen ? getName(chosen.id) : '—'}`, false, 'ASSIGNMENT'
        );
        setSchedules(nextSchedules);
        pushToCloudNow({ schedules: nextSchedules, logs: nextLogs });
        setCustomSlotTitle('');

      const runBuiltInUnitTests = () => {
        const results = [];
        try {
          const r1 = runScheduleGenerator({}, false, '2026-10-01', 14, INITIAL_MEMBERS, INITIAL_TEMPLATES, []);
          const counts1 = {};
          INITIAL_MEMBERS.forEach((m) => (counts1[m.id] = 0));
          Object.values(r1.updatedSchedules).forEach((d) =>

          const vals1 = Object.values(counts1);
          const spread1 = Math.max(...vals1) - Math.min(...vals1);
          results.push({
            name: '1. Равномерность очереди (23 чел. / 14 дней)',
            passed: spread1 <= 2.4,
            detail: `Макс. разброс: ${spread1.toFixed(1)} б. (норма ≤ 2.4)`,
          });

          const manualSeed = {
            '2026-10-01': { date: '2026-10-01', batteryDutyIds: [], slots: [{ id: 's1', date: '2026-10-01', title: 'Дежурный по классу', weight: 1.2, memberId: 'm01', isManual: true, isPenalty: false }] },

          };
          const r2 = runScheduleGenerator(manualSeed, true, '2026-10-01', 10, INITIAL_MEMBERS, INITIAL_TEMPLATES, []);
          let extra = 0;
          for (let d = 3; d <= 10; d++) {
            const iso = `2026-10-${String(d).padStart(2, '0')}`;
            r2.updatedSchedules[iso].slots.forEach((s) => { if (s.memberId === 'm01') extra++; });

          results.push({
            name: '2. Учёт переработки после ручных замен',
            passed: extra === 0,
            detail: `Доп. смен у перегруженного: ${extra} (ожидалось 0)`,
          });

          const batSeed = { '2026-10-05': { date: '2026-10-05', batteryDutyIds: ['m05'], slots: [] } };
          const r3 = runScheduleGenerator(batSeed, true, '2026-10-05', 3, INITIAL_MEMBERS, INITIAL_TEMPLATES, []);
          const onD = r3.updatedSchedules['2026-10-05'].slots.some((s) => s.memberId === 'm05');
          const onD1 = r3.updatedSchedules['2026-10-06'].slots.some((s) => s.memberId === 'm05');
          results.push({
            name: '3. Защита наряда D и D+1',
            passed: !onD && !onD1,
            detail: `В день наряда: ${onD ? 'Да' : 'Нет'}, на сдаче: ${onD1 ? 'Да' : 'Нет'}`,
          });

          const validation = validateSchedule(r1.updatedSchedules, INITIAL_MEMBERS);
          results.push({
            name: '4. Валидатор: нет двойных назначений',
            passed: validation.errors.length === 0,
            detail: `Ошибок: ${validation.errors.length}, пустых слотов: ${validation.emptySlots}`,

                              {freeToday.map((m) => renderRow(m, 'free'))}
                            </div>
                          )}
                          {others.length > 0 && (
                            <div>
                              <div className="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-800 text-[10px] font-extrabold uppercase text-slate-500">Остальные (с предупреждениями)</div>
                              {others.map((m) => renderRow(m, 'other'))}
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            {/* ДОБАВЛЕНИЕ ЗАДАЧИ */}
            {isUserAdmin && addSlotDate && (
              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <form onSubmit={handleAddCustomSlotToDay} className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">+ Задача на {formatRuDate(addSlotDate)}</div>
                    <button type="button" onClick={() => setAddSlotDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <input type="text" required placeholder="Название (например ПХД)" value={customSlotTitle} onChange={(e) => setCustomSlotTitle(e.target.value)}
                    className="w-full px-3 py-2 border dark:border-slate-700 dark:bg-slate-800 rounded-xl text-xs" />
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">Добавить</button>
                </form>
              </div>
            )}

            {/* НАВИГАЦИЯ */}
            <nav className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 grid ${isUserAdmin ? 'grid-cols-5' : 'grid-cols-4'} py-2 z-30`}>
              <button onClick={() => setTab('SCHEDULE')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'SCHEDULE' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>📅</span><span>Календарь</span>
              </button>
              <button onClick={() => setTab('STATS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'STATS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>📊</span><span>Таблица</span>
              </button>
              <button onClick={() => setTab('DEBTS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'DEBTS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>🤝</span><span>Долги ({totalActiveDebts})</span>
              </button>
              {isUserAdmin && (
                <button onClick={() => setTab('TASKS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'TASKS' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                  <span>⚙️</span><span>Нагрузки</span>
                </button>
              )}
              <button onClick={() => setTab('CLOUD')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'CLOUD' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
                <span>☁️</span><span>Архив</span>
              </button>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
