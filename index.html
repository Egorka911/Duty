<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d14" />
  <title>Взвод • Neon Command</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Manrope', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            bg: { light: '#f6f7fb', dark: '#0b0d14' },
            card: { light: '#ffffff', dark: '#151821' },
            ink: { primary: '#0f172a', secondary: '#64748b', muted: '#94a3b8' },
            inkdark: { primary: '#e8eaf0', secondary: '#7c8396', muted: '#4a5163' },
            accent: '#8b5cf6',
            ok: '#10b981', warn: '#f59e0b', danger: '#f43f5e', info: '#3b82f6',
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { overscroll-behavior-y: none; }
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0d14; color: #e8eaf0; transition: background-color 0.25s, color 0.25s; }
    body.light { background: #f6f7fb; color: #0f172a; }

    .app-bg {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 50% -20%, rgba(139, 92, 246, 0.20) 0%, transparent 60%),
        radial-gradient(circle at 100% 50%, rgba(6, 182, 212, 0.10) 0%, transparent 50%),
        #0b0d14;
      transition: opacity 0.25s;
    }
    .light .app-bg { opacity: 0; }

    .surface {
      background: #151821;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 20px -8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .light .surface {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 4px 20px -8px rgba(15,23,42,0.06), inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .glass-dock {
      background: rgba(21, 24, 33, 0.85);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .light .glass-dock {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    }

    .glass-header {
      background: rgba(11, 13, 20, 0.8);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .light .glass-header {
      background: rgba(246, 247, 251, 0.85);
      border-bottom: 1px solid rgba(15, 23, 42, 0.05);
    }

    .press { transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1); }
    .press:active { transform: scale(0.96); }

    .cal-swipe { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .sheet-handle { touch-action: none; }
    .sheet-body { touch-action: pan-y; overscroll-behavior-y: contain; }
    .task-swipe { touch-action: pan-y; user-select: none; -webkit-user-select: none; }

    ::-webkit-scrollbar { width: 0; height: 0; }

    .fade-up { animation: fadeUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 14px; }
    .light .skeleton { background: linear-gradient(90deg, rgba(15,23,42,0.04) 0%, rgba(15,23,42,0.08) 50%, rgba(15,23,42,0.04) 100%); background-size: 200% 100%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .squad-stripe-1 { background: linear-gradient(90deg, #3b82f6, #6366f1); }
    .squad-stripe-2 { background: linear-gradient(90deg, #8b5cf6, #a855f7); }
    .squad-stripe-3 { background: linear-gradient(90deg, #14b8a6, #10b981); }

    .gauge-track { stroke: rgba(255,255,255,0.08); }
    .light .gauge-track { stroke: rgba(15,23,42,0.08); }

    .carousel-x { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
    .carousel-x::-webkit-scrollbar { display: none; }
    .carousel-x > * { scroll-snap-align: center; flex: 0 0 calc(100% - 6px); }

    input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); outline: none; }
    .light input[type="range"] { background: rgba(15,23,42,0.1); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #8b5cf6; cursor: pointer; box-shadow: 0 0 10px rgba(139,92,246,0.5); }

    .swipe-bg-danger { background: linear-gradient(90deg, rgba(244,63,94,0.15), rgba(244,63,94,0.4)); }
    .swipe-bg-success { background: linear-gradient(90deg, rgba(16,185,129,0.4), rgba(16,185,129,0.15)); }

    .empty-illustration { opacity: 0.4; }

    .mini-bar { display: inline-block; width: 4px; border-radius: 2px; background: linear-gradient(180deg, #8b5cf6, #3b82f6); margin-right: 2px; vertical-align: bottom; }
  </style>
</head>
<body class="select-none">
  <div class="app-bg"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const haptic = (type = 'light') => {
      try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) {}
      try { if (type === 'medium' || type === 'heavy') navigator.vibrate?.(12); } catch(e) {}
    };

    function Icon({ name, size = 18, className = '', strokeWidth = 2 }) {
      const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round', className: `shrink-0 ${className}` };
      switch (name) {
        case 'today': return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15" r="2" fill="currentColor"/></svg>;
        case 'calendar': return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>;
        case 'chart': return <svg {...p}><path d="M18 20V10M12 20V4M6 20v-6"/></svg>;
        case 'sliders': return <svg {...p}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;
        case 'cloud': return <svg {...p}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
        case 'shield': return <svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        case 'sparkles': return <svg {...p}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>;
        case 'refresh': return <svg {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>;
        case 'search': return <svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        case 'share': return <svg {...p}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>;
        case 'plus': return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'trash': return <svg {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        case 'star': return <svg {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        case 'chevronLeft': return <svg {...p}><path d="m15 18-6-6 6-6"/></svg>;
        case 'chevronRight': return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
        case 'chevronDown': return <svg {...p}><path d="m6 9 6 6 6-6"/></svg>;
        case 'x': return <svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>;
        case 'check': return <svg {...p}><polyline points="20 6 9 17 4 12"/></svg>;
        case 'lock': return <svg {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        case 'ban': return <svg {...p}><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>;
        case 'undo': return <svg {...p}><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>;
        case 'crown': return <svg {...p}><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>;
        case 'note': return <svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;
        case 'copy': return <svg {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        case 'more': return <svg {...p}><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>;
        case 'settings': return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        case 'sun': return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-14.93 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2m-14.93 7.07 1.41-1.41m11.32-11.32 1.41-1.41"/></svg>;
        case 'moon': return <svg {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
        case 'edit': return <svg {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        case 'inbox': return <svg {...p}><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>;
        case 'list': return <svg {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
        case 'table': return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>;
        default: return null;
      }
    }

    function BottomSheet({ isOpen, onClose, title, subtitle, children }) {
      const [dragY, setDragY] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startYRef = useRef(0);
      const bodyRef = useRef(null);

      useEffect(() => { if (isOpen) setDragY(0); }, [isOpen]);
      if (!isOpen) return null;

      const ts = (e) => { if (bodyRef.current && bodyRef.current.scrollTop > 0) return; startYRef.current = e.touches[0].clientY; setIsDragging(true); };
      const tm = (e) => {
        if (!isDragging) return;
        const d = e.touches[0].clientY - startYRef.current;
        if (d > 0) { setDragY(d); if (e.cancelable) e.preventDefault(); }
      };
      const te = () => {
        setIsDragging(false);
        if (dragY > 100) { haptic('light'); onClose(); } else setDragY(0);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center" onClick={onClose}>
          <div onClick={e => e.stopPropagation()} style={{ transform: `translateY(${dragY}px)`, transition: isDragging ? 'none' : 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)', background: document.body.classList.contains('light') ? '#fff' : '#151821' }}
            className="w-full max-w-md rounded-t-[28px] border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.8)] max-h-[90vh] flex flex-col overflow-hidden relative slide-in">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-accent to-transparent opacity-50" />
            <div onTouchStart={ts} onTouchMove={tm} onTouchEnd={te} className="pt-3 pb-2 px-5 sheet-handle cursor-grab active:cursor-grabbing shrink-0">
              <div className="w-12 h-1.5 rounded-full bg-slate-400/20 mx-auto mb-3" />
              <div className="flex items-center justify-between gap-2">
                <div className="min-w-0">
                  <h3 className="text-base font-extrabold truncate">{title}</h3>
                  {subtitle && <p className="text-xs font-medium text-inkdark-secondary light:text-ink-secondary mt-0.5">{subtitle}</p>}
                </div>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-500/10 flex items-center justify-center press"><Icon name="x" size={16}/></button>
              </div>
            </div>
            <div ref={bodyRef} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te} className="px-5 pb-8 pt-2 overflow-y-auto flex-1 sheet-body space-y-3">
              {children}
            </div>
          </div>
        </div>
      );
    }

    const ADMIN_TELEGRAM_IDS = [7032931171, 8908389240, 8654413624, 1017627172];
    const currentTelegramId = Number(tg?.initDataUnsafe?.user?.id || localStorage.getItem('bat_saved_admin_id') || 0);
    const isUserAdmin = ADMIN_TELEGRAM_IDS.includes(currentTelegramId);

    const unlockAdminAccess = () => {
      const input = prompt('Введите ваш Telegram ID для активации прав Редактора:');
      if (!input) return;
      const numId = Number(input.trim());
      if (ADMIN_TELEGRAM_IDS.includes(numId)) { localStorage.setItem('bat_saved_admin_id', String(numId)); window.location.reload(); }
      else alert('Доступ запрещен.');
    };

    const INITIAL_MEMBERS = [
      { id: 'm01', fullName: 'Кузнецов', squad: 1, status: 'ACTIVE', absences: [] },
      { id: 'm02', fullName: 'Гежа', squad: 1, status: 'ACTIVE', absences: [] },
      { id: 'm03', fullName: 'Казаков', squad: 1, status: 'ACTIVE', absences: [] },
      { id: 'm04', fullName: 'Ряховский', squad: 1, status: 'ACTIVE', absences: [] },
      { id: 'm05', fullName: 'Гагарин', squad: 1, status: 'ACTIVE', absences: [] },
      { id: 'm06', fullName: 'Марков', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm07', fullName: 'Андрушко', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm08', fullName: 'Петухов', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm09', fullName: 'Сейдиев', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm10', fullName: 'Ремыга', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm11', fullName: 'Гриневский', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm12', fullName: 'Файзуллин', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm13', fullName: 'Кузьминов', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm14', fullName: 'Чиликанов', squad: 2, status: 'ACTIVE', absences: [] },
      { id: 'm15', fullName: 'Романов', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm16', fullName: 'Мамадалиев', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm17', fullName: 'Корсаков', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm18', fullName: 'Сеитжалилов', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm19', fullName: 'Ильиных', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm20', fullName: 'Шамардин', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm21', fullName: 'Чумаченко', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm22', fullName: 'Кроль', squad: 3, status: 'ACTIVE', absences: [] },
      { id: 'm23', fullName: 'Ялозницкий', squad: 3, status: 'ACTIVE', absences: [] },
    ];

    const INITIAL_TEMPLATES = [
      { id: 't_duty', title: 'Дежурный по классу', count: 1 },
      { id: 't_clean', title: 'Уборка класса', count: 2 },
    ];

    const STATUS_INFO = {
      ACTIVE: { label: 'В строю', color: 'bg-ok/10 text-ok border-ok/20' },
      SICK: { label: 'Санчасть', color: 'bg-danger/10 text-danger border-danger/20' },
      LEAVE: { label: 'Отпуск', color: 'bg-warn/10 text-warn border-warn/20' },
    };
    const SQUAD_STYLE = {
      1: { badge: 'bg-blue-500/10 text-blue-500 border border-blue-500/20', avatar: 'from-blue-500 to-indigo-600', stripe: 'squad-stripe-1' },
      2: { badge: 'bg-violet-500/10 text-violet-500 border border-violet-500/20', avatar: 'from-violet-500 to-purple-600', stripe: 'squad-stripe-2' },
      3: { badge: 'bg-teal-500/10 text-teal-500 border border-teal-500/20', avatar: 'from-teal-500 to-emerald-600', stripe: 'squad-stripe-3' },
    };

    const toISO = (d) => { const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
    const addDaysISO = (s, days) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + days); return toISO(d); };

      Object.entries(map).forEach(([date, day]) => {
        const today = new Set();

      };

      const runGen = (baseSchedules, keepExisting, periodStart, periodDays, curMembers, curTemplates) => {
        const updated = JSON.parse(JSON.stringify(baseSchedules));
        const wl = {}; curMembers.forEach(m => { wl[m.id] = { total: 0, byTitle: {}, lastDate: null }; });
        const base = new Date(periodStart + 'T00:00:00'); const period = [];
        for (let i = 0; i < periodDays; i++) { const d = new Date(base); d.setDate(base.getDate()+i); period.push(toISO(d)); }

        Object.keys(updated).sort().forEach(k => {
          if (k < period[0]) {
            const d = updated[k];
            (d.batteryDutyIds || []).forEach(mid => { if (wl[mid]) { wl[mid].total++; wl[mid].lastDate = k; } });
            (d.slots || []).forEach(s => {
              if (s.memberId && wl[s.memberId]) {
                if (!s.isPenalty) { wl[s.memberId].total++; wl[s.memberId].byTitle[s.title] = (wl[s.memberId].byTitle[s.title] || 0) + 1; wl[s.memberId].lastDate = k; }
                else wl[s.memberId].lastDate = k;
              }
            });
          }
        });

        period.forEach(dateStr => {
          const existing = updated[dateStr];
          const batIds = Array.from(new Set(existing?.batteryDutyIds || []));
          batIds.forEach(mid => { if (wl[mid]) { wl[mid].total++; wl[mid].lastDate = dateStr; } });

          let slots = curTemplates.flatMap(tpl => Array.from({ length: tpl.count }, (_, c) => ({ id: `${dateStr}_${tpl.id}_${c}_${Math.random()}`, date: dateStr, title: tpl.title, memberId: null, isPenalty: false, isManual: false, locked: false, unassignedReason: null })));

          if (existing && keepExisting && existing.slots?.length > 0) {
            slots = existing.slots.map(s => {
              if (s.locked) return s;
              if (s.memberId && batIds.includes(s.memberId)) return { ...s, memberId: null, isPenalty: false };
              return s.memberId ? { ...s } : { ...s, memberId: null, isPenalty: false };
            });
          }

          const used = new Set(batIds);
          const squads = {};
          batIds.forEach(id => { const m = curMembers.find(x => x.id === id); if (m) squads[m.squad] = (squads[m.squad] || 0) + 1; });
          slots.forEach(slot => {
            if (slot.memberId) {
              used.add(slot.memberId);
              const m = curMembers.find(x => x.id === slot.memberId);
              if (m) squads[m.squad] = (squads[m.squad] || 0) + 1;
              if (!slot.isPenalty && wl[slot.memberId]) { wl[slot.memberId].total++; wl[slot.memberId].byTitle[slot.title] = (wl[slot.memberId].byTitle[slot.title] || 0) + 1; wl[slot.memberId].lastDate = dateStr; }
            }
          });

          slots.forEach(slot => {
            if (slot.memberId) return;
            const eligible = curMembers.filter(m => canAssign({ member: m, dateStr, usedToday: used, schedulesMap: updated }));
            const scored = eligible.map(m => {
              const w = wl[m.id] || { total: 0, byTitle: {} };
              const roleCnt = w.byTitle[slot.title] || 0;
              const cd = cooldownDays > 0 && w.lastDate && daysDiff(dateStr, w.lastDate) < cooldownDays;
              const sPen = (squads[m.squad] || 0) * 3;
              return { m, priority: w.total + roleCnt*2 + sPen + (cd ? 1000 : 0), roleCnt };
            }).sort((a,b) => a.priority === b.priority ? (a.roleCnt === b.roleCnt ? a.m.fullName.localeCompare(b.m.fullName,'ru') : a.roleCnt - b.roleCnt) : a.priority - b.priority);

            if (!scored.length) { slot.unassignedReason = 'Нет свободных'; return; }
            const chosen = scored[0].m;
            slot.memberId = chosen.id; used.add(chosen.id); squads[chosen.squad] = (squads[chosen.squad] || 0) + 1;
            if (wl[chosen.id]) { wl[chosen.id].total++; wl[chosen.id].byTitle[slot.title] = (wl[chosen.id].byTitle[slot.title] || 0) + 1; wl[chosen.id].lastDate = dateStr; }
          });
          updated[dateStr] = { ...(updated[dateStr] || {}), date: dateStr, batteryDutyIds: batIds, slots };
        });
        return { updatedSchedules: updated };
      };

      const regenFromDate = (dateStr, withChange) => {
        const lastD = Object.keys(withChange).sort().pop();
        const endD = lastD > dateStr ? lastD : currentMonthInfo.lastDateISO;
        const periodDays = daysDiff(endD, dateStr) + 1;
        const cleaned = JSON.parse(JSON.stringify(withChange));
        let cur = dateStr; let g = 0;
        while (cur <= endD && g < 400) {
          const day = cleaned[cur];
          if (day && day.slots) day.slots = day.slots.map(s => s.locked ? s : { ...s, memberId: null, isPenalty: false });
          cur = addDaysISO(cur, 1); g++;
        }
        const { updatedSchedules } = runGen(cleaned, true, dateStr, periodDays, members, taskTemplates);
        const { errors, emptySlots } = validateSchedule(updatedSchedules, members);
        if (errors.length) showToast(`Ошибок: ${errors.length}`);
        else if (emptySlots) showToast(`Свободных: ${emptySlots}`);
        return updatedSchedules;
      };

      const applyCascade = (dateStr, nextSchedules, title, details, type = 'ASSIGNMENT') => {
        const before = JSON.parse(JSON.stringify(schedulesRef.current));
        const { nextLogs, nextBk } = createLog(title, details, true, type);
        const recalc = regenFromDate(dateStr, nextSchedules);
        setLastUndo({ schedules: before, label: title });
        setSchedules(recalc);
        pushCloud({ schedules: recalc, logs: nextLogs, backups: nextBk });
      };

      const undoLast = () => {
        if (!lastUndo || !isUserAdmin) return;
        haptic('medium');
        setSchedules(lastUndo.schedules); pushCloud({ schedules: lastUndo.schedules });
        showToast('Отменено'); setLastUndo(null);
      };

      const doAssign = (mid) => {
        if (!isUserAdmin || !modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const next = { ...schedules, [date]: { ...schedules[date], slots: (schedules[date]?.slots || []).map(s => s.id === slot.id ? { ...s, memberId: mid, isPenalty: assignMode === 'PENALTY', isManual: true, locked: true, unassignedReason: null } : s) } };
        applyCascade(date, next, assignMode === 'PENALTY' ? 'Штрафной' : 'Замена', `${formatRuDate(date)} [${slot.title}]`, assignMode === 'PENALTY' ? 'PENALTY' : 'ASSIGNMENT');
        setModalSlot(null); setSlotSearchQuery(''); showToast('Назначено', true);
      };

      const replaceBest = (dateStr, slot) => {
        if (!isUserAdmin) return;
        haptic('medium');
        const d = schedules[dateStr]; if (!d) return;
        const used = new Set([...(d.batteryDutyIds || []), ...(d.slots || []).filter(x => x.id !== slot.id).map(x => x.memberId)]);
        const best = members.filter(m => m.status === 'ACTIVE' && !used.has(m.id) && !inAbsence(m, dateStr) && !isRecoveringFromBatteryDuty(m.id, dateStr)).sort((a,b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0))[0];
        if (!best) return showToast('Свободных нет');
        const next = { ...schedules, [dateStr]: { ...schedules[dateStr], slots: schedules[dateStr].slots.map(s => s.id === slot.id ? { ...s, memberId: best.id, isManual: true, locked: true, unassignedReason: null } : s) } };
        applyCascade(dateStr, next, 'Лучший', `${formatRuDate(dateStr)} [${slot.title}]`, 'ASSIGNMENT');
        showToast(`Назначен: ${best.fullName}`, true);
      };

      const askDeleteSlot = (dateStr, slot) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: 'Удалить задачу?', message: `«${slot.title}» (${getName(slot.memberId)})`, confirmLabel: 'Удалить',
          onConfirm: () => {
            const next = { ...schedules, [dateStr]: { ...schedules[dateStr], slots: schedules[dateStr].slots.filter(s => s.id !== slot.id) } };
            applyCascade(dateStr, next, 'Удаление', slot.title, 'ASSIGNMENT');
            setConfirmDialog(null); if (modalSlot) setModalSlot(null);
          }
        });
      };

      const askClearDay = (dateStr) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: 'Очистить сутки?', message: 'Все задачи будут удалены.', confirmLabel: 'Очистить',
          onConfirm: () => {
            const next = { ...schedules, [dateStr]: { date: dateStr, batteryDutyIds: [], slots: [] } };
            applyCascade(dateStr, next, 'Очистка', formatRuDate(dateStr), 'CLEAR');
            setConfirmDialog(null);
          }
        });
      };

      const toggleBattery = (dateStr, mid) => {
        if (!isUserAdmin) return;
        haptic('light');
        const d = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const ex = d.batteryDutyIds?.includes(mid);
        const list = ex ? d.batteryDutyIds.filter(x => x !== mid) : [...(d.batteryDutyIds || []), mid];
        const next = { ...schedules, [dateStr]: { ...d, batteryDutyIds: list } };
        applyCascade(dateStr, next, 'Наряд', `${formatRuDate(dateStr)}`, 'BATTERY');
      };

      const addSlot = (e) => {
        e.preventDefault();
        if (!isUserAdmin || !addSlotDate || !customSlotTitle.trim()) return;
        const d = schedules[addSlotDate] || { date: addSlotDate, batteryDutyIds: [], slots: [] };
        const newSlot = { id: `custom_${Date.now()}`, date: addSlotDate, title: customSlotTitle.trim(), memberId: null, isManual: true, locked: false, isPenalty: false };
        const next = { ...schedules, [addSlotDate]: { ...d, slots: [...(d.slots || []), newSlot] } };
        applyCascade(addSlotDate, next, 'Задача', newSlot.title, 'ASSIGNMENT');
        setCustomSlotTitle(''); setAddSlotDate(null);
      };

      const saveNote = () => {
        if (!noteModalDate) return;
        const d = schedules[noteModalDate] || { date: noteModalDate, batteryDutyIds: [], slots: [] };
        const next = { ...schedules, [noteModalDate]: { ...d, note: noteText.trim() || null } };
        const { nextLogs } = createLog('Заметка', formatRuDate(noteModalDate), false, 'OTHER');
        setSchedules(next); pushCloud({ schedules: next, logs: nextLogs });
        setNoteModalDate(null); showToast('Сохранено');
      };

      const addAbsence = () => {
        if (!absenceModalMember || !absenceForm.from || !absenceForm.to) return;
        const next = members.map(m => m.id === absenceModalMember.id ? { ...m, absences: [...(m.absences || []), { ...absenceForm }] } : m);
        const { nextLogs } = createLog('Отсутствие', absenceModalMember.fullName, false, 'STATUS');
        setMembers(next); pushCloud({ members: next, logs: nextLogs });
        setAbsenceModalMember(null); setAbsenceForm({ from: '', to: '', reason: '' }); showToast('Сохранено');
      };

      const removeAbsence = (mid, i) => {
        const next = members.map(m => m.id === mid ? { ...m, absences: (m.absences || []).filter((_, j) => j !== i) } : m);
        setMembers(next); pushCloud({ members: next });
      };

      const fillMonth = () => {
        if (!isUserAdmin) return;
        haptic('medium');
        const before = JSON.parse(JSON.stringify(schedulesRef.current));
        const { nextLogs, nextBk } = createLog('Заполнение', 'Автоматически', true, 'RECALC');
        const { updatedSchedules } = runGen(schedules, true, currentMonthInfo.firstDateISO, currentMonthInfo.daysInMonth, members, taskTemplates);
        setLastUndo({ schedules: before, label: 'Заполнение' });
        setSchedules(updatedSchedules);
        pushCloud({ schedules: updatedSchedules, logs: nextLogs, backups: nextBk });
        showToast('Заполнено', true);
      };

      const recalcRangeFn = (from, to, resetAll) => {
        if (!isUserAdmin) return;
        haptic('medium');
        const before = JSON.parse(JSON.stringify(schedulesRef.current));
        const { nextLogs, nextBk } = createLog('Пересчет', `${from}–${to}`, true, 'RECALC');
        const { updatedSchedules } = runGen(schedules, !resetAll, from, daysDiff(to, from) + 1, members, taskTemplates);
        setLastUndo({ schedules: before, label: 'Пересчет' });
        setSchedules(updatedSchedules);
        pushCloud({ schedules: updatedSchedules, logs: nextLogs, backups: nextBk });
        setRecalcModalOpen(false); setRecalcConfirm(null);
        showToast('Пересчитано', true);
      };

      const copyMsg = async () => {
        haptic('light');
        const lines = ['📋 *СВОДКА*', ''];
        [todayISO, addDaysISO(todayISO, 1)].forEach(iso => {
          const d = schedules[iso] || {};
          lines.push(`📅 *${formatRuDate(iso).toUpperCase()}*`);
          if (d.note) lines.push(`📝 ${d.note}`);
          if (d.batteryDutyIds?.length) lines.push(`🛡 Наряд: *${d.batteryDutyIds.map(id => getMember(id)?.fullName).join(', ')}*`);
          (d.slots || []).forEach(s => lines.push(`• ${s.title}: *${getName(s.memberId)}*`));
          lines.push('');
        });
        try { await navigator.clipboard.writeText(lines.join('\n')); showToast('Скопировано'); } catch(e) { showToast('Ошибка буфера'); }
      };

      const runTests = () => {
        const r = [];
        try {
          const r1 = runGen({}, false, '2026-10-01', 14, INITIAL_MEMBERS, INITIAL_TEMPLATES);
          const c = {}; INITIAL_MEMBERS.forEach(m => c[m.id] = 0);
          Object.values(r1.updatedSchedules).forEach(d => d.slots.forEach(s => { if (s.memberId) c[s.memberId]++; }));
          const v = Object.values(c); const sp = Math.max(...v) - Math.min(...v);
          r.push({ name: 'Равномерность', passed: sp <= 2, detail: `Разброс ${sp}` });
          const sick = INITIAL_MEMBERS.map(m => ({ ...m, status: 'SICK' }));
          const rSick = runGen({}, false, '2026-10-01', 5, sick, INITIAL_TEMPLATES);
          r.push({ name: 'Статусы', passed: !Object.values(rSick.updatedSchedules).some(d => d.slots.some(s => s.memberId)), detail: 'Не назначены больные' });
          const batSeed = { '2026-10-05': { date: '2026-10-05', batteryDutyIds: ['m05'], slots: [] } };
          const rB = runGen(batSeed, true, '2026-10-05', 3, INITIAL_MEMBERS, INITIAL_TEMPLATES);
          r.push({ name: 'После наряда', passed: !rB.updatedSchedules['2026-10-06'].slots.some(s => s.memberId === 'm05'), detail: 'D+1 свободен' });
        } catch(e) { r.push({ name: 'Ошибка', passed: false, detail: String(e) }); }
        setTestResults(r);
      };

      const getWarn = (ds, mid) => {
        const w = []; const m = getMember(mid);
        if (!m || m.status !== 'ACTIVE') w.push('Не в строю');
        if (m && inAbsence(m, ds)) w.push('Отсутствует');
        if (schedules[ds]?.batteryDutyIds?.includes(mid)) w.push('В наряде');
        if (schedules[ds]?.slots?.some(s => s.memberId === mid && (!modalSlot || s.id !== modalSlot.slot.id))) w.push('Занят');
        if (isRecoveringFromBatteryDuty(mid, ds)) w.push('После наряда');
        return w;
      };

      if (initialLoading) {
        return (
          <div className="min-h-screen p-4 space-y-4">
            <div className="skeleton h-16" />
            <div className="skeleton h-32" />
            <div className="skeleton h-44" />
            <div className="skeleton h-44" />
            <div className="skeleton h-14" />
          </div>
        );
      }

      const todayDay = schedules[todayISO] || { date: todayISO, batteryDutyIds: [], slots: [] };

      return (
        <div className="min-h-screen pb-28">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] bg-inkdark-primary light:bg-ink-primary text-bg-dark light:text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 max-w-[92vw] fade-up">
              <span className="truncate">{toast}</span>
              {lastUndo && <button onClick={undoLast} className="bg-accent px-2 py-1 rounded-lg flex items-center gap-1 press"><Icon name="undo" size={12}/> Отменить</button>}
            </div>
          )}

          <header className="glass-header sticky top-0 z-30 px-4 pt-4 pb-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-accent flex items-center justify-center shadow-lg shadow-accent/30">
                  <Icon name="shield" size={18} className="text-white" />
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight">Взвод PRO</h1>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isCloudOnline ? 'bg-ok' : 'bg-danger'}`} />
                    <span className="text-[10px] font-semibold text-inkdark-secondary light:text-ink-secondary uppercase tracking-wider">{cloudStatus}</span>
                  </div>
                </div>
              </div>
              <div className="flex gap-1.5">
                <button onClick={() => { haptic('light'); setLightTheme(!lightTheme); }} className="w-9 h-9 rounded-xl bg-slate-500/10 flex items-center justify-center press">
                  <Icon name={lightTheme ? 'moon' : 'sun'} size={16}/>
                </button>
                <button onClick={copyMsg} className="w-9 h-9 rounded-xl bg-slate-500/10 flex items-center justify-center press"><Icon name="share" size={16}/></button>
                <button onClick={() => setSettingsOpen(true)} className="w-9 h-9 rounded-xl bg-slate-500/10 flex items-center justify-center press"><Icon name="settings" size={16}/></button>
              </div>
            </div>

            <div className="mt-3 flex items-center justify-between bg-slate-500/5 rounded-2xl px-3 py-2">
              <div className="flex items-center gap-2.5">
                <div className="relative w-9 h-9 flex items-center justify-center">
                  <svg className="w-9 h-9 -rotate-90" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="15" fill="none" className="gauge-track" strokeWidth="3" />
                    <circle cx="18" cy="18" r="15" fill="none" stroke={fairness.index >= 85 ? '#10b981' : fairness.index >= 70 ? '#f59e0b' : '#f43f5e'} strokeWidth="3" strokeDasharray={2 * Math.PI * 15} strokeDashoffset={2 * Math.PI * 15 * (1 - fairness.index/100)} strokeLinecap="round" style={{transition: 'stroke-dashoffset 0.6s ease'}}/>
                  </svg>
                  <span className="absolute text-[10px] font-mono font-bold">{fairness.index}</span>
                </div>
                <div>
                  <div className="text-[11px] font-bold">Индекс баланса</div>
                  <div className="text-[10px] font-mono text-inkdark-muted light:text-ink-muted">Разброс {fairness.min}–{fairness.max} см.</div>
                </div>
              </div>
              {monthHoleCount > 0 && (
                <button onClick={() => { setTab('SCHEDULE'); }} className="text-[10px] bg-danger/10 text-danger px-2.5 py-1.5 rounded-lg font-bold press">
                  Свободных: {monthHoleCount}
                </button>
              )}
            </div>
          </header>

          {/* СЕГОДНЯ — КАРУСЕЛЬ */}
          {tab === 'TODAY' && (
            <div className="p-4 fade-up">
              <div className="flex justify-center gap-1.5 mb-3">
                {todaySlides.map((_, i) => (
                  <div key={i} className={`h-1.5 rounded-full transition-all ${i === todaySlideIdx ? 'w-6 bg-accent' : 'w-1.5 bg-slate-500/20'}`} />
                ))}
              </div>
              <div ref={todayCarouselRef} onScroll={handleTodayCarouselScroll} className="carousel-x">
                {todaySlides.map((iso, idx) => {
                  const day = schedules[iso] || {};
                  const label = idx === 0 ? 'Сегодня' : idx === 1 ? 'Завтра' : 'Послезавтра';
                  return (
                    <div key={iso}>
                      <div className="surface rounded-3xl p-5 relative overflow-hidden">
                        <div className={`absolute top-0 left-0 right-0 h-1 ${SQUAD_STYLE[getMember(day.batteryDutyIds?.[0])?.squad || 1]?.stripe || 'squad-stripe-1'}`} style={{opacity: day.batteryDutyIds?.length ? 1 : 0}} />
                        <div className="flex items-start justify-between mb-4">
                          <div>
                            <div className="text-[10px] uppercase font-extrabold tracking-widest text-accent">{label}</div>
                            <div className="text-2xl font-extrabold mt-0.5 capitalize">{formatRuDate(iso)}</div>
                          </div>
                          {isUserAdmin && (
                            <div className="flex gap-1">
                              <button onClick={() => { haptic('light'); setAddSlotDate(iso); }} className="w-9 h-9 rounded-xl bg-accent/10 text-accent flex items-center justify-center press">
                                <Icon name="plus" size={18}/>
                              </button>
                              <button onClick={() => { haptic('light'); setBatteryModalDate(iso); }} className="w-9 h-9 rounded-xl bg-warn/10 text-warn flex items-center justify-center press">
                                <Icon name="shield" size={18}/>
                              </button>
                            </div>
                          )}
                        </div>

                        {day.note && (
                          <div className="mb-3 p-2.5 rounded-xl bg-warn/10 border border-warn/20 text-xs text-warn flex items-center gap-2">
                            <Icon name="note" size={14}/> <span>{day.note}</span>
                          </div>
                        )}

                        {day.batteryDutyIds?.length > 0 && (
                          <div className="mb-4 p-3 rounded-2xl bg-warn/10 border border-warn/20">
                            <div className="text-[10px] font-extrabold uppercase text-warn mb-1.5 flex items-center gap-1.5"><Icon name="shield" size={12}/> Наряд по батарее</div>
                            <div className="flex flex-wrap gap-2">
                              {day.batteryDutyIds.map(id => {
                                const m = getMember(id); if (!m) return null;
                                return (
                                  <div key={id} className="flex items-center gap-2 px-2 py-1 rounded-lg bg-white/5">
                                    <div className="w-6 h-6 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 text-white text-[9px] font-extrabold flex items-center justify-center">{m.fullName.slice(0,2)}</div>
                                    <span className="text-xs font-bold">{m.fullName}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        <div className="space-y-2">
                          <div className="text-[10px] uppercase font-extrabold tracking-widest text-inkdark-muted light:text-ink-muted">Задачи ({day.slots?.length || 0})</div>
                          {(!day.slots || day.slots.length === 0) ? (
                            <div className="text-center py-6 rounded-2xl border border-dashed border-slate-500/20">
                              <Icon name="inbox" size={32} className="mx-auto empty-illustration"/>
                              <div className="text-xs font-bold text-inkdark-secondary light:text-ink-secondary mt-2">Пока пусто</div>
                              {isUserAdmin && <button onClick={fillMonth} className="mt-2 text-[11px] text-accent font-bold">Заполнить автоматически</button>}
                            </div>
                          ) : (
                            day.slots.map(slot => {
                              const m = getMember(slot.memberId);
                              const sq = m ? SQUAD_STYLE[m.squad] : null;
                              return (
                                <div key={slot.id} onClick={() => { if (isUserAdmin) { haptic('light'); setModalSlot({ date: iso, slot }); } }}
                                  className={`p-3 rounded-2xl bg-slate-500/5 flex items-center gap-3 ${isUserAdmin ? 'cursor-pointer active:bg-slate-500/10' : ''}`}>
                                  <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${sq?.avatar || 'from-slate-500 to-slate-700'} text-white font-extrabold text-xs flex items-center justify-center shrink-0`}>
                                    {m ? m.fullName.slice(0,2).toUpperCase() : '?'}

                ))}
              </div>
              <button type="submit" className="w-full py-3 bg-accent text-white font-extrabold rounded-xl text-sm press">Добавить</button>
            </form>
          </BottomSheet>

          <BottomSheet isOpen={!!noteModalDate} onClose={() => setNoteModalDate(null)} title="Заметка" subtitle={noteModalDate ? formatRuDate(noteModalDate) : ''}>
            <textarea rows={3} value={noteText} onChange={e => setNoteText(e.target.value)} placeholder="ПХД после обеда..." className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-3 text-sm outline-none focus:border-accent"/>
            <button onClick={saveNote} className="w-full py-3 bg-accent text-white font-extrabold rounded-xl text-sm mt-2 press">Сохранить</button>
          </BottomSheet>

          <BottomSheet isOpen={!!absenceModalMember} onClose={() => setAbsenceModalMember(null)} title="Отсутствие" subtitle={absenceModalMember?.fullName}>
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-[10px] font-bold uppercase opacity-50">С</label><input type="date" value={absenceForm.from} onChange={e => setAbsenceForm({...absenceForm, from: e.target.value})} className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-2 text-xs"/></div>
              <div><label className="text-[10px] font-bold uppercase opacity-50">По</label><input type="date" value={absenceForm.to} onChange={e => setAbsenceForm({...absenceForm, to: e.target.value})} className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-2 text-xs"/></div>
            </div>
            <input type="text" value={absenceForm.reason} onChange={e => setAbsenceForm({...absenceForm, reason: e.target.value})} placeholder="Причина" className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-2 text-xs mt-2 outline-none"/>
            <button onClick={addAbsence} className="w-full py-3 bg-danger text-white font-extrabold rounded-xl text-sm mt-2 press">Сохранить</button>
          </BottomSheet>

          <BottomSheet isOpen={!!memberCardId} onClose={() => setMemberCardId(null)} title={getMember(memberCardId)?.fullName || ''} subtitle={getMember(memberCardId) ? `${getMember(memberCardId).squad} отделение · ${STATUS_INFO[getMember(memberCardId).status].label}` : ''}>
            {memberCardId && (() => {
              const mc = getMember(memberCardId); if (!mc) return null;
              const st = statsMap[mc.id];
              return (
                <>
                  <div className="grid grid-cols-3 gap-2">
                    <div className="p-2.5 rounded-2xl bg-slate-500/5 text-center">
                      <div className="text-[9px] uppercase font-extrabold opacity-50">Смен</div>
                      <div className="text-xl font-extrabold font-mono text-accent">{st.totalAll}</div>
                    </div>
                    <div className="p-2.5 rounded-2xl bg-warn/10 border border-warn/20 text-center">
                      <div className="text-[9px] uppercase font-extrabold text-warn">Наряд</div>
                      <div className="text-xl font-extrabold font-mono">{st.batteryCount}</div>
                    </div>
                    <div className="p-2.5 rounded-2xl bg-danger/10 border border-danger/20 text-center">
                      <div className="text-[9px] uppercase font-extrabold text-danger">Штраф</div>
                      <div className="text-xl font-extrabold font-mono">{st.penaltyShifts}</div>
                    </div>
                  </div>

                  <div>
                    <div className="text-[10px] uppercase font-extrabold opacity-50 mb-1">Активность по неделям</div>
                    <div className="flex items-end gap-1 h-8">
                      {weeklyBarsFor(mc.id).map((v, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center">
                          <div className="w-full rounded-t" style={{ height: `${Math.min(v * 6 + 2, 28)}px`, background: v ? 'linear-gradient(180deg, #8b5cf6, #3b82f6)' : 'rgba(148,163,184,0.15)' }} />
                          <span className="text-[8px] opacity-40 mt-0.5">W{i+1}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {isUserAdmin && (
                    <div>
                      <div className="text-[10px] uppercase font-extrabold opacity-50 mb-1">Статус</div>
                      <div className="grid grid-cols-3 gap-1">
                        {['ACTIVE','SICK','LEAVE'].map(s => (
                          <button key={s} onClick={() => { haptic('light'); const n = members.map(x => x.id === mc.id ? { ...x, status: s } : x); const { nextLogs } = createLog('Статус', `${mc.fullName}: ${STATUS_INFO[s].label}`, false, 'STATUS'); setMembers(n); pushCloud({ members: n, logs: nextLogs }); }}
                            className={`py-2 rounded-xl text-[10px] font-extrabold border press ${mc.status === s ? STATUS_INFO[s].color : 'bg-slate-500/5 border-transparent'}`}>
                            {STATUS_INFO[s].label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <div className="text-[10px] uppercase font-extrabold opacity-50">Отсутствия</div>
                      {isUserAdmin && <button onClick={() => { haptic('light'); setAbsenceModalMember(mc); setAbsenceForm({ from: todayISO, to: todayISO, reason: '' }); }} className="text-[10px] text-danger font-bold press">+ Добавить</button>}
                    </div>
                    {(!mc.absences || !mc.absences.length) ? (
                      <div className="text-[10px] text-center py-2 bg-slate-500/5 rounded-xl opacity-50">Нет отметок</div>
                    ) : mc.absences.map((a, i) => (
                      <div key={i} className="flex justify-between items-center text-[10px] p-2 rounded-xl bg-danger/10 border border-danger/20 mb-1">
                        <span className="text-danger">🚫 {a.from} — {a.to} {a.reason && `(${a.reason})`}</span>
                        {isUserAdmin && <button onClick={() => removeAbsence(mc.id, i)} className="text-danger font-bold">✕</button>}
                      </div>
                    ))}
                  </div>

                  <div>
                    <div className="text-[10px] uppercase font-extrabold opacity-50 mb-1">История задач ({memberHistory.length})</div>
                    {!memberHistory.length ? (
                      <div className="text-[10px] text-center py-3 bg-slate-500/5 rounded-xl opacity-50">Пока пусто</div>
                    ) : (
                      <div className="space-y-1.5 max-h-72 overflow-y-auto">
                        {memberHistory.slice().reverse().map((h, i) => (
                          <div key={i} className="p-2 rounded-xl bg-slate-500/5">
                            <div className="flex justify-between items-center mb-0.5">
                              <span className="text-[11px] font-extrabold capitalize">{formatRuDate(h.date)}</span>
                              <span className="text-[9px] font-mono opacity-40">{h.date}</span>
                            </div>
                            {h.battery && <div className="text-[10px] text-warn flex items-center gap-1"><Icon name="shield" size={10}/> Наряд</div>}
                            {h.slots.map((s, j) => (
                              <div key={j} className={`text-[10px] ${s.isPenalty ? 'text-danger' : 'opacity-70'}`}>{s.isPenalty ? '⚠' : '•'} {s.title}</div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <button onClick={() => { haptic('light'); jumpToMember(mc.id); setMemberCardId(null); }} className="w-full py-2.5 bg-accent/10 text-accent rounded-xl text-xs font-extrabold press">Показать в календаре</button>
                </>
              );
            })()}
          </BottomSheet>

          <BottomSheet isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} title="Настройки">
            <div className="grid grid-cols-2 gap-1 bg-slate-500/5 p-1 rounded-xl">
              <button onClick={() => setSettingsView('RULES')} className={`py-2 rounded-lg text-xs font-extrabold ${settingsView === 'RULES' ? 'bg-accent text-white' : ''}`}>Правила</button>
              <button onClick={() => setSettingsView('ARCHIVE')} className={`py-2 rounded-lg text-xs font-extrabold ${settingsView === 'ARCHIVE' ? 'bg-accent text-white' : ''}`}>Архив</button>
            </div>

            {settingsView === 'RULES' && isUserAdmin && (
              <>
                <div className="surface rounded-2xl p-3 space-y-3">
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold">Мин. дней между сменами</span>
                      <span className="text-xs font-mono font-extrabold text-accent">{cooldownDays === 0 ? 'выкл' : cooldownDays}</span>
                    </div>
                    <input type="range" min="0" max="7" value={cooldownDays} onChange={e => setCooldownDays(Number(e.target.value))} className="w-full"/>
                  </div>
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold">Макс. смен в неделю</span>
                      <span className="text-xs font-mono font-extrabold text-accent">{maxShiftsPerWeek === 0 ? '∞' : maxShiftsPerWeek}</span>
                    </div>
                    <input type="range" min="0" max="5" value={maxShiftsPerWeek} onChange={e => setMaxShiftsPerWeek(Number(e.target.value))} className="w-full"/>
                  </div>
                  <label className="flex items-center gap-2 text-xs font-bold cursor-pointer pt-1">
                    <input type="checkbox" checked={protectRestDay} onChange={e => setProtectRestDay(e.target.checked)} className="w-4 h-4 accent-accent rounded"/>
                    Не ставить после наряда (D+1)
                  </label>
                </div>

                <div className="surface rounded-2xl p-3 space-y-2">
                  <div className="text-xs font-extrabold">Задачи</div>
                  {taskTemplates.map(tpl => (
                    <div key={tpl.id} className="flex justify-between items-center bg-slate-500/5 p-2 rounded-xl">
                      <div className="text-xs font-bold">{tpl.title} <span className="opacity-50">×{tpl.count}</span></div>
                      <button onClick={() => { const n = taskTemplates.filter(t => t.id !== tpl.id); setTaskTemplates(n); pushCloud({ taskTemplates: n }); }} className="text-danger p-1"><Icon name="trash" size={14}/></button>
                    </div>
                  ))}
                  <form onSubmit={e => { e.preventDefault(); if (newTplTitle) { const n = [...taskTemplates, { id: `t_${Date.now()}`, title: newTplTitle, count: newTplCount || 1 }]; setTaskTemplates(n); pushCloud({ taskTemplates: n }); } setNewTplTitle(''); }} className="flex gap-1.5 mt-1">
                    <input value={newTplTitle} onChange={e => setNewTplTitle(e.target.value)} placeholder="Новая..." className="flex-1 bg-slate-500/5 border border-slate-500/10 rounded-xl px-2 py-1.5 text-xs outline-none"/>
                    <input type="number" min="1" max="10" value={newTplCount} onChange={e => setNewTplCount(e.target.value)} className="w-12 bg-slate-500/5 border border-slate-500/10 rounded-xl text-center text-xs outline-none"/>
                    <button type="submit" className="bg-accent text-white px-3 rounded-xl press"><Icon name="plus" size={14}/></button>
                  </form>
                </div>
              </>
            )}

            {settingsView === 'ARCHIVE' && (
              <>
                <div className="surface rounded-2xl p-3 space-y-2">
                  <div className="flex justify-between items-center">
                    <div className="text-xs font-extrabold">Синхронизация</div>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${isCloudOnline ? 'bg-ok/10 text-ok' : 'bg-danger/10 text-danger'}`}>{cloudStatus}</span>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5">
                    {isUserAdmin && <button onClick={() => pushCloud()} className="py-2 bg-accent text-white text-xs font-extrabold rounded-xl press">⬆️ Отправить</button>}
                    <button onClick={() => pullCloud(false)} className="py-2 bg-slate-500/5 text-xs font-extrabold rounded-xl press">⬇️ Обновить</button>
                  </div>
                </div>

                {isUserAdmin && (
                  <div className="surface rounded-2xl p-3">
                    <div className="flex justify-between items-center mb-2">
                      <div className="text-xs font-extrabold">Бэкапы</div>
                      <div className="text-[10px] opacity-50">Хранится {backups.length} / 20</div>
                    </div>
                    <div className="space-y-1 max-h-48 overflow-y-auto">
                      {backups.map(bk => (
                        <div key={bk.id} className="flex justify-between items-center bg-slate-500/5 p-2 rounded-lg">
                          <div className="min-w-0 flex-1">
                            <div className="text-[10px] truncate font-bold">{bk.label}</div>
                            <div className="text-[8px] font-mono opacity-40">{bk.time} • {bk.type}</div>
                          </div>
                          <button onClick={() => { haptic('light'); setConfirmDialog({ title: 'Восстановить?', message: bk.label, confirmLabel: 'Восстановить', onConfirm: () => { setSchedules(bk.schedules); setMembers(bk.members || members); const { nextLogs } = createLog('Откат', bk.time, false, 'RESTORE'); pushCloud({ schedules: bk.schedules, members: bk.members, logs: nextLogs }); setConfirmDialog(null); showToast('Восстановлено'); } }); }} className="text-warn p-1"><Icon name="undo" size={14}/></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="surface rounded-2xl p-3 space-y-1">
                  <div className="text-xs font-extrabold mb-1">Журнал ({logs.length})</div>
                  <div className="max-h-40 overflow-y-auto space-y-1">
                    {logs.slice(0, 20).map(l => (
                      <div key={l.id} className="text-[10px] flex justify-between gap-2">
                        <span className="font-bold truncate">{l.action}</span>
                        <span className="font-mono opacity-40 shrink-0">{l.time}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {isUserAdmin && (
                  <button onClick={runTests} className="w-full py-2.5 bg-ok/10 text-ok text-xs font-extrabold rounded-xl press">🧪 Запустить тесты</button>
                )}
                {testResults && (
                  <div className="space-y-1">
                    {testResults.map((tr, i) => (
                      <div key={i} className={`p-2 rounded-xl text-[10px] border ${tr.passed ? 'bg-ok/5 border-ok/20 text-ok' : 'bg-danger/5 border-danger/20 text-danger'}`}>
                        <div className="font-bold">{tr.passed ? '✅' : '❌'} {tr.name}</div>
                        <div className="opacity-80">{tr.detail}</div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </BottomSheet>

          <BottomSheet isOpen={recalcModalOpen} onClose={() => setRecalcModalOpen(false)} title="Пересчет диапазона">
            <div className="grid grid-cols-2 gap-2">
              <div><label className="text-[10px] font-bold uppercase opacity-50">От</label><input type="date" value={recalcRange.from} onChange={e => setRecalcRange({...recalcRange, from: e.target.value})} className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-2 text-xs"/></div>
              <div><label className="text-[10px] font-bold uppercase opacity-50">До</label><input type="date" value={recalcRange.to} onChange={e => setRecalcRange({...recalcRange, to: e.target.value})} className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-2 text-xs"/></div>
            </div>
            <p className="text-[11px] font-bold mt-2 mb-1 opacity-60">Режим:</p>
            <div className="space-y-1.5">
              <button onClick={() => setRecalcConfirm({ resetAll: false })} className="w-full p-3 rounded-xl bg-accent/10 text-accent border border-accent/20 text-xs font-extrabold text-left press">
                ✅ Дозаполнить пустые                <span className="block text-[10px] opacity-70 mt-0.5 font-normal">Существующие не тронутся</span>
              </button>
              <button onClick={() => setRecalcConfirm({ resetAll: true })} className="w-full p-3 rounded-xl bg-danger/10 text-danger border border-danger/20 text-xs font-extrabold text-left press">
                ⚠️ Сбросить и заново
                <span className="block text-[10px] opacity-70 mt-0.5 font-normal">Все люди в диапазоне будут удалены</span>
              </button>
            </div>
          </BottomSheet>

          <BottomSheet isOpen={!!recalcConfirm} onClose={() => setRecalcConfirm(null)} title="Точно пересчитать?">
            <p className="text-sm opacity-80">Диапазон: {recalcRange.from} — {recalcRange.to}. Режим: {recalcConfirm?.resetAll ? 'сброс' : 'дозаполнение'}.</p>
            <div className="grid grid-cols-2 gap-2 mt-4">
              <button onClick={() => setRecalcConfirm(null)} className="py-3 bg-slate-500/10 rounded-xl text-xs font-extrabold press">Отмена</button>
              <button onClick={() => recalcRangeFn(recalcRange.from, recalcRange.to, recalcConfirm.resetAll)} className="py-3 bg-danger text-white rounded-xl text-xs font-extrabold press">Подтвердить</button>
            </div>
          </BottomSheet>

          <BottomSheet isOpen={!!confirmDialog} onClose={() => setConfirmDialog(null)} title={confirmDialog?.title || ''}>
            {confirmDialog && (
              <>
                <p className="text-sm opacity-80">{confirmDialog.message}</p>
                <div className="flex gap-2 mt-4">
                  <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3 bg-slate-500/10 rounded-xl text-xs font-extrabold press">Отмена</button>
                  <button onClick={confirmDialog.onConfirm} className="flex-1 py-3 bg-danger text-white rounded-xl text-xs font-extrabold press">{confirmDialog.confirmLabel}</button>
                </div>
              </>
            )}
          </BottomSheet>

          <BottomSheet isOpen={searchOpen} onClose={() => setSearchOpen(false)} title="Поиск">
            <input autoFocus type="text" placeholder="Имя..." value={statSearch} onChange={e => setStatSearch(e.target.value)} className="w-full bg-slate-500/5 border border-slate-500/10 rounded-xl p-3 text-sm outline-none focus:border-accent mb-2"/>
            <div className="space-y-1 max-h-64 overflow-y-auto">
              {members.filter(m => m.fullName.toLowerCase().includes(statSearch.toLowerCase())).map(m => (
                <button key={m.id} onClick={() => { haptic('light'); jumpToMember(m.id); }} className="w-full flex justify-between items-center p-2.5 bg-slate-500/5 rounded-xl text-xs font-bold press">
                  <span>{m.fullName}</span>
                  <Icon name="chevronRight" size={14} className="opacity-40"/>
                </button>
              ))}
            </div>
          </BottomSheet>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
