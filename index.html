    function BottomSheet({ isOpen, onClose, title, subtitle, children }) {
      const [dragY, setDragY] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startYRef = useRef(0);

      useEffect(() => {
        if (isOpen) setDragY(0);
      }, [isOpen]);

      if (!isOpen) return null;

      const onTouchStart = (e) => {
        startYRef.current = e.touches[0].clientY;
        setIsDragging(true);
      };
      const onTouchMove = (e) => {
        if (!isDragging) return;
        const delta = e.touches[0].clientY - startYRef.current;
        if (delta > 0) setDragY(delta);
      };
      const onTouchEnd = () => {
        setIsDragging(false);
        if (dragY > 95) {
          haptic('light');
          onClose();
        } else {
          setDragY(0);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end justify-center transition-opacity"
          onClick={onClose}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              transform: `translateY(${dragY}px)`,
              transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)',
            }}
            className="w-full max-w-md bg-white dark:bg-obsidian-900 rounded-t-[28px] border-t border-slate-200/80 dark:border-white/10 shadow-2xl max-h-[86vh] flex flex-col sheet-enter overflow-hidden"
          >
            <div
              onTouchStart={onTouchStart}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
              className="pt-3 pb-2 px-5 cursor-grab active:cursor-grabbing select-none"
            >
              <div className="w-10 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700 mx-auto mb-3" />
              <div className="flex items-center justify-between gap-2">

                </div>
                <button
                  onClick={onClose}
                  className="w-8 h-8 rounded-full bg-slate-100 dark:bg-obsidian-800 text-slate-500 dark:text-slate-400 flex items-center justify-center press-scale"
                >
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>
            <div className="px-5 pb-6 pt-2 overflow-y-auto space-y-3.5 flex-1">
              {children}
            </div>
          </div>
        </div>

      if (!query || !query.trim()) return <span>{text}</span>;
      const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const parts = text.split(new RegExp(`(${q})`, 'gi'));
      return (
        <span>

            part.toLowerCase() === query.trim().toLowerCase()
              ? <mark key={i} className="bg-amber-400/30 text-amber-600 dark:text-amber-300 rounded px-1 font-extrabold">{part}</mark>

    const validateSchedule = (scheduleMap, memberList) => {
      const errors = [];
      let emptySlots = 0;
      const memberIds = new Set(memberList.map((m) => m.id));
      const memberById = new Map(memberList.map((m) => [m.id, m]));
      Object.entries(scheduleMap).forEach(([date, day]) => {
        const assignedToday = new Set();
        (day.batteryDutyIds || []).forEach((id) => {
          if (!memberIds.has(id)) errors.push(`${date}: неизвестный ${id}`);
          if (assignedToday.has(id)) errors.push(`${date}: двойное ${id}`);
          assignedToday.add(id);
        });
        (day.slots || []).forEach((slot) => {
          if (!slot.memberId) { emptySlots++; return; }
          if (!memberIds.has(slot.memberId)) errors.push(`${date}: неизвестный ${slot.memberId}`);
          if (assignedToday.has(slot.memberId)) errors.push(`${date}: двойное ${slot.memberId}`);
          assignedToday.add(slot.memberId);
          const m = memberById.get(slot.memberId);
          if (m && inAbsence(m, date)) errors.push(`${date}: назначен отсутствующий ${m.fullName}`);
        });
      });
      return { errors, emptySlots };
    };

      const showToast = (msg, withUndo = false) => {

      const getMember = (id, list = members) => list.find((m) => m.id === id);

      const currentMonthInfo = useMemo(() => {
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const daysInMonth = new Date(y, m, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const datesList = [];
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          datesList.push(iso);
          cells.push({ dayNum: d, iso });

        return { year: y, month: m, firstDateISO: datesList[0], lastDateISO: datesList[datesList.length - 1], daysInMonth, datesList, cells, monthTitle };
      }, [calendarMonthISO]);

      const monthHoleCount = useMemo(() => {
        let count = 0;
        currentMonthInfo.datesList.forEach((iso) => {
          const day = schedules[iso];
          if (day?.slots?.some((s) => !s.memberId)) count++;
        });
        return count;
      }, [schedules, currentMonthInfo]);

      const changeMonth = (delta) => {
        haptic('light');
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const next = new Date(y, m - 1 + delta, 1);
        setCalendarMonthISO(`${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`);
        setDayFilterMode('ALL_MONTH');
      };

      const handleCalendarTouchStart = (e) => {
        calTouchStartX.current = e.touches[0].clientX;
        calTouchStartY.current = e.touches[0].clientY;
      };
      const handleCalendarTouchEnd = (e) => {
        if (calTouchStartX.current === null) return;
        const dx = e.changedTouches[0].clientX - calTouchStartX.current;
        const dy = e.changedTouches[0].clientY - calTouchStartY.current;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) changeMonth(1);
          else changeMonth(-1);
        }
        calTouchStartX.current = null;
      };

      const goToToday = () => {
        haptic('light');
        const now = new Date();
        const thisMonthISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        const tISO = toISO(now);
        setCalendarMonthISO(thisMonthISO);
        setSelectedDayISO(tISO);
        setDayFilterMode('ALL_MONTH');
        setTimeout(() => {
          const el = document.getElementById(`day-card-${tISO}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 120);
      };

      const jumpToMember = (memberId) => {
        setSearchOpen(false);
        const member = getMember(memberId);
        if (!member) return;
        const today = toISO(new Date());
        const futureDates = Object.keys(schedules).sort().filter(
          (d) => d >= today && (schedules[d]?.slots?.some((s) => s.memberId === memberId) || schedules[d]?.batteryDutyIds?.includes(memberId))
        );
        const anyDates = Object.keys(schedules).sort().filter(
          (d) => schedules[d]?.slots?.some((s) => s.memberId === memberId) || schedules[d]?.batteryDutyIds?.includes(memberId)
        );
        const target = futureDates[0] || anyDates[anyDates.length - 1];
        if (target) {
          const [y, m] = target.split('-');
          setTab('SCHEDULE');
          setDayFilterMode('ALL_MONTH');
          setCalendarMonthISO(`${y}-${m}-01`);
          setSelectedDayISO(target);
          setTimeout(() => {
            const el = document.getElementById(`day-card-${target}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 150);
        } else {
          setTab('STATS');
          setStatSearch(member.fullName);
        }
      };

      // ==== СИНХРОНИЗАЦИЯ ====
      const applyRemoteState = (st, updatedAtStr) => {
        if (!st || typeof st !== 'object') return;
        const remoteTs = updatedAtStr ? new Date(updatedAtStr).getTime() : Date.now();
        if (remoteTs <= lastSyncTimestampRef.current) return;
        lastSyncTimestampRef.current = remoteTs;

        if (Array.isArray(st.members)) setMembers(st.members);
        if (Array.isArray(st.taskTemplates)) setTaskTemplates(st.taskTemplates);
        if (st.schedules && typeof st.schedules === 'object') {
          const cleaned = { ...st.schedules };
          Object.keys(cleaned).forEach((d) => {
            const day = cleaned[d];
            if (day?.batteryDutyIds) day.batteryDutyIds = Array.from(new Set(day.batteryDutyIds));
          });
          setSchedules(cleaned);
        }
        if (Array.isArray(st.logs)) {
          setLogs((prev) => {
            const byId = new Map(prev.map((l) => [l.id, l]));
            st.logs.forEach((rl) => { if (!byId.has(rl.id)) byId.set(rl.id, rl); });
            return Array.from(byId.values()).slice(0, 100);
          });
        }
        if (Array.isArray(st.backups)) setBackups(st.backups);
        setCloudStatus('Live • Синхронизировано');
        setIsCloudOnline(true);
        setPendingSync(false);
      };

      const pushToCloudNow = async (overrides = {}) => {
        if (!isUserAdmin) return false;
        const nowIso = new Date().toISOString();
        lastSyncTimestampRef.current = new Date(nowIso).getTime();
        // [FIX #2] Читаем из refs, чтобы не потерять актуальное состояние
        const nextState = {
          members: overrides.members ?? membersRef.current,
          taskTemplates: overrides.taskTemplates ?? taskTemplates,
          schedules: overrides.schedules ?? schedulesRef.current,
          logs: overrides.logs ?? logsRef.current,
          backups: overrides.backups ?? backupsRef.current,
        };
        try {
          setCloudStatus('Сохранение в облако...');
          const res = await fetch(`${SUPA_URL}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPA_KEY,
              Authorization: `Bearer ${SUPA_KEY}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify({ room_code: ROOM_CODE, state_json: nextState, updated_at: nowIso }),
          });
          if (!res.ok) {
            setCloudStatus(`Ошибка БД (${res.status})`);
            setIsCloudOnline(false);
            setPendingSync(true);
            return false;
          }
          setCloudStatus('Live • Синхронизировано');
          setIsCloudOnline(true);
          setPendingSync(false);
          return true;
        } catch (e) {
          setCloudStatus('Офлайн режим');
          setIsCloudOnline(false);
          setPendingSync(true);
          return false;
        }
      };

      const pullFromCloudNow = async (silent = false) => {
        try {
          if (!silent) setCloudStatus('Обновление...');
          const res = await fetch(
            `${SUPA_URL}/rest/v1/duty_sync?room_code=eq.${ROOM_CODE}&select=state_json,updated_at`,
            { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Cache-Control': 'no-cache' } }
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data?.[0]?.state_json && typeof data[0].state_json === 'object') {
            applyRemoteState(data[0].state_json, data[0].updated_at);
          }
        } catch (e) {
          if (!silent) {
            setCloudStatus('Автономный режим');
            setIsCloudOnline(false);
          }
        }
      };

      // [FIX #1] Убрана зависимость от pendingSync — интервал и подписка создаются один раз.
      useEffect(() => {
        let cancelled = false;
        let channel = null;
        const loadCloudState = async (silent = false) => {
          if (cancelled) return;
          await pullFromCloudNow(silent);
          if (pendingSyncRef.current) pushToCloudNow();
        };
        loadCloudState(false);
        if (supabaseClient) {
          channel = supabaseClient
            .channel('public:duty_sync')
            .on('postgres_changes',
              { event: '*', schema: 'public', table: 'duty_sync', filter: `room_code=eq.${ROOM_CODE}` },
              (payload) => {
                if (!cancelled && payload?.new?.state_json) {
                  applyRemoteState(payload.new.state_json, payload.new.updated_at);
                }
              }
            ).subscribe();
        }
        const interval = setInterval(() => loadCloudState(true), 45000);
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') loadCloudState(true);
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          cancelled = true;
          clearInterval(interval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (channel && supabaseClient) supabaseClient.removeChannel(channel);
        };
      }, []); // <-- пустой массив, эффект один раз

      const createLogAndBackup = (actionTitle, detailsText, createSnapshot = false, type = 'OTHER') => {
        const timeStr = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const author = tg?.initDataUnsafe?.user?.first_name || `ID:${currentTelegramId || 'Админ'}`;
        const newEntry = {
          id: `log_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          time: timeStr, author, action: actionTitle, details: detailsText, type,
        };
        // [FIX #2] Используем logsRef вместо замыкания
        const nextLogs = [newEntry, ...logsRef.current.slice(0, 99)];
        setLogs(nextLogs);

        let nextBackups = backupsRef.current;
        if (createSnapshot) {
          const snap = {
            id: `bk_${Date.now()}`, time: timeStr, type,
            label: `${actionTitle}: ${detailsText.slice(0, 40)}`,
            // [FIX #2] Берем из ref — это ТОЧНО состояние ДО изменения
            schedules: JSON.parse(JSON.stringify(schedulesRef.current)),
            members: JSON.parse(JSON.stringify(membersRef.current)),
          };
          nextBackups = [snap, ...backupsRef.current.slice(0, 19)];
          setBackups(nextBackups);
        }
        return { nextLogs, nextBackups };
      };

      const restoreBackupSnapshot = (snap) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: 'Восстановить точку отката?',
          message: `График вернётся к состоянию от ${snap.time} («${snap.label}»).`,
          confirmLabel: 'Восстановить',
          onConfirm: () => {
            setSchedules(snap.schedules);
            if (snap.members) setMembers(snap.members);
            const { nextLogs } = createLogAndBackup('Откат из бэкапа', `Версия от ${snap.time}`, false, 'RESTORE');
            pushToCloudNow({ schedules: snap.schedules, members: snap.members || membersRef.current, logs: nextLogs });
            setConfirmDialog(null);
            showToast('График восстановлен');
          },
        });
      };

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      const allWorkloadTitles = useMemo(() => {
        const titles = new Set(taskTemplates.map((t) => t.title));
        Object.values(schedules).forEach((day) => {
          (day?.slots || []).forEach((s) => { if (s.title) titles.add(s.title); });
        });
        return Array.from(titles);
      }, [taskTemplates, schedules]);

      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = { ...m, batteryCount: 0, totalAll: 0, byTitle: {}, regularShifts: 0, penaltyShifts: 0 };
        });
        Object.keys(schedules).sort().forEach((date) => {
          if (statDateScope === 'MONTH') {
            if (date < currentMonthInfo.firstDateISO || date > currentMonthInfo.lastDateISO) return;
          } else if (statDateScope === 'CUSTOM') {
            if (date < statCustomFrom || date > statCustomTo) return;
          }
          const day = schedules[date];
          if (!day) return;
          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) { map[mId].batteryCount += 1; map[mId].totalAll += 1; }
          });
          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalAll += 1;
            st.byTitle[s.title] = (st.byTitle[s.title] || 0) + 1;
            if (s.isPenalty) st.penaltyShifts += 1;
            else st.regularShifts += 1;
          });
        });
        return map;
      }, [members, schedules, statDateScope, currentMonthInfo, statCustomFrom, statCustomTo]);

      const fairnessMetrics = useMemo(() => {
        const activeList = Object.values(statsMap).filter((m) => m.status === 'ACTIVE');
        if (activeList.length === 0) return { index: 100, stdDev: 0, min: 0, max: 0 };
        const counts = activeList.map((m) => m.totalAll);
        const min = Math.min(...counts);
        const max = Math.max(...counts);
        const avg = counts.reduce((a, b) => a + b, 0) / counts.length;
        const variance = counts.reduce((acc, s) => acc + Math.pow(s - avg, 2), 0) / counts.length;
        const stdDev = Math.sqrt(variance);
        const index = Math.max(0, Math.min(100, Math.round(100 - stdDev * 15)));
        return { index, stdDev, min, max };
      }, [statsMap]);

      const filteredStatsList = useMemo(() => {
        return Object.values(statsMap)
          .filter((st) => {
            if (statSquadFilter !== 0 && st.squad !== statSquadFilter) return false;
            if (statSearch.trim() && !st.fullName.toLowerCase().includes(statSearch.trim().toLowerCase())) return false;
            if (statTaskFilter !== 'ALL') {
              if (statTaskFilter === 'BATTERY' && (st.batteryCount || 0) === 0) return false;
              if (statTaskFilter === 'PENALTY' && (st.penaltyShifts || 0) === 0) return false;
              if (statTaskFilter !== 'BATTERY' && statTaskFilter !== 'PENALTY' && (st.byTitle[statTaskFilter] || 0) === 0) return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (statSortBy === 'NAME_ASC') return a.fullName.localeCompare(b.fullName, 'ru');
            if (statSortBy === 'TOTAL_ASC') return a.totalAll - b.totalAll;
            if (statSortBy === 'TASK_DESC') {
              const getVal = (item) => {
                if (statTaskFilter === 'ALL') return item.totalAll;
                if (statTaskFilter === 'BATTERY') return item.batteryCount;
                if (statTaskFilter === 'PENALTY') return item.penaltyShifts;
                return item.byTitle[statTaskFilter] || 0;
              };
              return getVal(b) - getVal(a);
            }
            return b.totalAll - a.totalAll;
          });
      }, [statsMap, statSquadFilter, statSearch, statSortBy, statTaskFilter]);

      const canAssignMember = ({ member, dateStr, usedToday, schedulesMap }) => {
        if (member.status !== 'ACTIVE') return false;
        if (inAbsence(member, dateStr)) return false;
        if (usedToday.has(member.id)) return false;
        if (protectRestDay) {
          const prev = addDaysISO(dateStr, -1);
          if (schedulesMap[prev]?.batteryDutyIds?.includes(member.id)) return false;
        }
        return true;
      };

      const runScheduleGenerator = (baseSchedules, keepExistingSlots, periodStart, periodDays, currentMembers, currentTemplates) => {
        const updated = JSON.parse(JSON.stringify(baseSchedules));
        const workload = {};
        currentMembers.forEach((m) => { workload[m.id] = { total: 0, byTitle: {}, lastDate: null }; });

        const addWorkload = (memberId, title, dateStr) => {
          const it = workload[memberId];
          if (!it) return;
          it.total += 1;
          it.byTitle[title] = (it.byTitle[title] || 0) + 1;
          it.lastDate = dateStr;
        };

        const base = new Date(periodStart + 'T00:00:00');
        const period = [];
        for (let i = 0; i < periodDays; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (workload[mId]) { workload[mId].total += 1; workload[mId].lastDate = dKey; }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && workload[s.memberId]) {
                if (!s.isPenalty) addWorkload(s.memberId, s.title, dKey);
                else workload[s.memberId].lastDate = dKey;
              }
            });
          }
        });

        const weekCount = {};
        currentMembers.forEach((m) => (weekCount[m.id] = {}));
        const weekKeyOf = (dateStr) => {
          const d = new Date(dateStr + 'T00:00:00');
          const monday = new Date(d);
          monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return toISO(monday);
        };

        period.forEach((dateStr) => {
          const wk = weekKeyOf(dateStr);
          const existing = updated[dateStr];
          const batteryDutyIds = Array.from(new Set(existing?.batteryDutyIds || []));
          batteryDutyIds.forEach((mId) => {
            if (workload[mId]) { workload[mId].total += 1; workload[mId].lastDate = dateStr; }
            if (weekCount[mId]) weekCount[mId][wk] = (weekCount[mId][wk] || 0) + 1;
          });

          const templateSlots = [];
          currentTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr, title: tpl.title,
                memberId: null, isPenalty: false, isManual: false, locked: false, unassignedReason: null,
              });
            }
          });

          let slots = templateSlots;
          if (existing && keepExistingSlots && existing.slots && existing.slots.length > 0) {
            slots = existing.slots.map((s) => {
              // [FIX #4] Жестко сохраняем locked слоты (ручные назначения)
              if (s.locked) return { ...s };
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, unassignedReason: null };
              }
              return s.memberId ? { ...s } : { ...s, memberId: null, isPenalty: false, unassignedReason: null };
            });
          }

          const usedToday = new Set(batteryDutyIds);
          const usedSquadsToday = {};
          batteryDutyIds.forEach((id) => {
            const m = currentMembers.find((x) => x.id === id);
            if (m) usedSquadsToday[m.squad] = (usedSquadsToday[m.squad] || 0) + 1;
          });
          slots.forEach((slot) => {
            if (slot.memberId) {
              usedToday.add(slot.memberId);
              const mem = currentMembers.find((x) => x.id === slot.memberId);
              if (mem) usedSquadsToday[mem.squad] = (usedSquadsToday[mem.squad] || 0) + 1;
              if (!slot.isPenalty && workload[slot.memberId]) addWorkload(slot.memberId, slot.title, dateStr);
              else if (workload[slot.memberId]) workload[slot.memberId].lastDate = dateStr;
            }
          });

          const yesterday = addDaysISO(dateStr, -1);
          const yesterdaySlots = updated[yesterday]?.slots || [];

          slots.forEach((slot) => {
            if (slot.memberId) return;
            const eligible = currentMembers.filter((m) =>
              canAssignMember({ member: m, dateStr, usedToday, schedulesMap: updated })
            );

            const scored = eligible.map((m) => {
              const w = workload[m.id] || { total: 0, byTitle: {} };
              const roleCnt = w.byTitle[slot.title] || 0;
              const cd = cooldownDays > 0 && w.lastDate && daysDiff(dateStr, w.lastDate) < cooldownDays;
              const hadSameRoleYesterday = yesterdaySlots.some((s) => s.memberId === m.id && s.title === slot.title);
              const repeatPenalty = hadSameRoleYesterday ? 5 : 0;
              const squadPenalty = (usedSquadsToday[m.squad] || 0) * 3;

              let weekPenalty = 0;
              if (maxShiftsPerWeek > 0) {
                const cur = weekCount[m.id]?.[weekKeyOf(dateStr)] || 0;
                if (cur >= maxShiftsPerWeek) weekPenalty = 10000;
              }

              const priority = w.total + roleCnt * 2 + repeatPenalty + squadPenalty + (cd ? 1000 : 0) + weekPenalty;
              return { m, priority, roleCnt };
            });

            scored.sort((a, b) => {
              if (a.priority !== b.priority) return a.priority - b.priority;
              if (a.roleCnt !== b.roleCnt) return a.roleCnt - b.roleCnt;
              return a.m.fullName.localeCompare(b.m.fullName, 'ru');
            });

            if (scored.length === 0) {
              slot.unassignedReason = 'Нет свободных бойцов';
              return;
            }

            const minP = scored[0].priority;
            const pool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.5);
            const chosen = pool[0].m;
            slot.memberId = chosen.id;
            slot.unassignedReason = null;
            usedToday.add(chosen.id);
            usedSquadsToday[chosen.squad] = (usedSquadsToday[chosen.squad] || 0) + 1;
            if (weekCount[chosen.id]) {
              const wk = weekKeyOf(dateStr);
              weekCount[chosen.id][wk] = (weekCount[chosen.id][wk] || 0) + 1;
            }
            addWorkload(chosen.id, slot.title, dateStr);
          });

          updated[dateStr] = { ...(updated[dateStr] || {}), date: dateStr, batteryDutyIds, slots };
        });

        return { updatedSchedules: updated };
      };

      const regenerateFromDate = (dateStr, schedulesWithManualChange) => {

                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                  {isUserAdmin && (
                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button onClick={() => { setQuickViewDate(null); setAddSlotDate(quickViewDate); }} className="py-2.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 text-xs font-bold rounded-xl flex justify-center items-center gap-1.5 press-scale">
                        <Icon name="plus" size={14}/> Задача
                      </button>
                      <button onClick={() => { setQuickViewDate(null); setSelectedDayISO(quickViewDate); setDayFilterMode('SINGLE_DAY'); setTab('SCHEDULE'); }} className="py-2.5 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 text-xs font-bold rounded-xl flex justify-center items-center gap-1.5 press-scale">
                        <Icon name="search" size={14}/> В списке
                      </button>
                    </div>
                  )}
                </>
              )}
            </BottomSheet>

            <BottomSheet isOpen={!!modalSlot} onClose={() => setModalSlot(null)} title={modalSlot?.slot.title || ''} subtitle={modalSlot ? formatRuDate(modalSlot.date) : ''}>
              {modalSlot && (
                <>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => replaceWithBestCandidate(modalSlot.date, modalSlot.slot)} className="py-2.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 rounded-xl text-xs font-bold flex justify-center items-center gap-1.5 press-scale">
                      <Icon name="star" size={14} /> Лучший
                    </button>
                    <button onClick={() => replaceWithRandomLeastLoaded(modalSlot.date, modalSlot.slot)} className="py-2.5 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 rounded-xl text-xs font-bold flex justify-center items-center gap-1.5 press-scale">
                      <Icon name="dice" size={14} /> Случайный
                    </button>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-obsidian-800 p-1 rounded-xl">
                    <button onClick={() => setAssignMode('REGULAR')} className={`py-2 rounded-lg text-xs font-bold transition ${assignMode === 'REGULAR' ? 'bg-white dark:bg-obsidian-900 text-indigo-600 shadow-xs' : 'text-slate-500'}`}>Очередь</button>
                    <button onClick={() => setAssignMode('PENALTY')} className={`py-2 rounded-lg text-xs font-bold transition ${assignMode === 'PENALTY' ? 'bg-rose-600 text-white shadow-xs' : 'text-slate-500'}`}>Штраф</button>
                  </div>

                  <div className="space-y-1.5 mt-2">
                    {(() => {
                      const day = schedules[modalSlot.date] || { batteryDutyIds: [], slots: [] };
                      const busy = new Set([
                        ...(day.batteryDutyIds || []),
                        ...(day.slots || []).filter((s) => s.id !== modalSlot.slot.id).map((s) => s.memberId).filter(Boolean),
                      ]);
                      const active = members.filter((m) => m.status === 'ACTIVE');
                      const recommended = active.filter((m) => !busy.has(m.id) && !inAbsence(m, modalSlot.date) && !isRecoveringFromBatteryDuty(m.id, modalSlot.date))
                        .sort((a, b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0)).slice(0, 5);
                      const freeToday = active.filter((m) => !busy.has(m.id) && !recommended.some((r) => r.id === m.id));
                      const others = members.filter((m) => m.status !== 'ACTIVE' || busy.has(m.id) || inAbsence(m, modalSlot.date));

                      const renderRow = (m, group) => {
                        const warns = getAssignmentWarnings(modalSlot.date, m.id);
                        return (
                          <div key={`${group}_${m.id}`} className="p-3 rounded-2xl bg-slate-50 dark:bg-obsidian-800 border border-slate-200 dark:border-white/10 flex items-center justify-between">
                            <div className="min-w-0">
                              <div className="text-xs font-bold flex items-center gap-2">
                                {m.fullName}
                                <span className={`text-[9px] px-1.5 rounded ${SQUAD_STYLE[m.squad].badge}`}>{m.squad}</span>
                              </div>
                              <div className="text-[10px] text-slate-500 mt-0.5">Всего смен: {statsMap[m.id]?.totalAll || 0}</div>
                              {warns.length > 0 && (
                                <div className="text-[10px] text-rose-500 mt-1 font-semibold flex items-center gap-1">
                                  <Icon name="ban" size={10}/> {warns.join(' • ')}
                                </div>
                              )}
                            </div>
                            <button onClick={() => handleAssignMember(m.id)} className="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0 ml-2 press-scale">
                              <Icon name="check" size={16} />
                            </button>
                          </div>
                        );
                      };

                      return (
                        <>
                          {recommended.length > 0 && (
                            <div>
                              <div className="text-[10px] font-extrabold uppercase text-emerald-500 px-2 py-1">Рекомендованные</div>
                              <div className="space-y-1.5">{recommended.map((m) => renderRow(m, 'rec'))}</div>
                            </div>
                          )}
                          {freeToday.length > 0 && (
                            <div>
                              <div className="text-[10px] font-extrabold uppercase text-slate-400 px-2 py-1 mt-2">Свободные</div>
                              <div className="space-y-1.5">{freeToday.map((m) => renderRow(m, 'free'))}</div>
                            </div>
                          )}
                          {others.length > 0 && (
                            <div>
                              <div className="text-[10px] font-extrabold uppercase text-slate-400 px-2 py-1 mt-2">Остальные</div>
                              <div className="space-y-1.5">{others.map((m) => renderRow(m, 'other'))}</div>
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </div>
                </>
              )}
            </BottomSheet>

            <BottomSheet isOpen={!!batteryModalDate} onClose={() => setBatteryModalDate(null)} title="Наряд по батарее" subtitle={batteryModalDate ? formatRuDate(batteryModalDate) : ''}>
              {batteryModalDate && (
                <div className="space-y-1.5">
                  {members.map((m) => {
                    const checked = (schedules[batteryModalDate]?.batteryDutyIds || []).includes(m.id);
                    const absent = inAbsence(m, batteryModalDate);
                    return (
                      <div key={m.id} onClick={() => toggleBatteryDutyMember(batteryModalDate, m.id)} className={`p-3 rounded-2xl flex items-center justify-between cursor-pointer border transition ${checked ? 'bg-amber-500/10 border-amber-500/30' : 'bg-slate-50 dark:bg-obsidian-800 border-slate-200 dark:border-white/10'}`}>
                        <span className={`text-xs font-bold flex items-center gap-2 ${absent ? 'text-slate-400' : ''}`}>
                          {m.fullName}
                          <span className={`text-[9px] px-1.5 rounded ${SQUAD_STYLE[m.squad].badge}`}>{m.squad}</span>
                          {absent && <Icon name="ban" size={12} className="text-rose-400" />}
                        </span>
                        <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${checked ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-300 dark:border-slate-600'}`}>
                          {checked && <Icon name="check" size={12} />}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </BottomSheet>

            <BottomSheet isOpen={!!addSlotDate} onClose={() => setAddSlotDate(null)} title="Новая задача" subtitle={addSlotDate ? formatRuDate(addSlotDate) : ''}>
              <form onSubmit={handleAddCustomSlotToDay} className="space-y-3">
                <input type="text" required placeholder="Название задачи (напр. ПХД)" value={customSlotTitle} onChange={(e) => setCustomSlotTitle(e.target.value)} className="w-full px-3 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm outline-none" />
                <button type="submit" className="w-full py-3 bg-emerald-600 text-white text-sm font-bold rounded-xl press-scale">Добавить задачу</button>
              </form>
            </BottomSheet>

            <BottomSheet isOpen={!!noteModalDate} onClose={() => setNoteModalDate(null)} title="Заметка" subtitle={noteModalDate ? formatRuDate(noteModalDate) : ''}>
              <textarea rows="3" value={noteText} onChange={(e) => setNoteText(e.target.value)} placeholder="Например: ПХД после обеда" className="w-full px-3 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm outline-none" />
              <button onClick={saveDayNote} className="w-full py-3 bg-indigo-600 text-white text-sm font-bold rounded-xl press-scale">Сохранить</button>
            </BottomSheet>

            <BottomSheet isOpen={!!copyModalDate} onClose={() => setCopyModalDate(null)} title="Копировать структуру" subtitle={copyModalDate ? `Из ${formatRuDate(copyModalDate)}` : ''}>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">С</label>
                  <input type="date" value={copyRange.from} onChange={(e) => setCopyRange({ ...copyRange, from: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">По</label>
                  <input type="date" value={copyRange.to} onChange={(e) => setCopyRange({ ...copyRange, to: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
              </div>
              <button onClick={applyCopyDayStructure} className="w-full py-3 bg-indigo-600 text-white text-sm font-bold rounded-xl press-scale mt-2">Применить</button>
            </BottomSheet>

            <BottomSheet isOpen={!!absenceModalMember} onClose={() => setAbsenceModalMember(null)} title="Отсутствие" subtitle={absenceModalMember?.fullName}>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">С</label>
                  <input type="date" value={absenceForm.from} onChange={(e) => setAbsenceForm({ ...absenceForm, from: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">По</label>
                  <input type="date" value={absenceForm.to} onChange={(e) => setAbsenceForm({ ...absenceForm, to: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
              </div>
              <input type="text" placeholder="Причина (необязательно)" value={absenceForm.reason} onChange={(e) => setAbsenceForm({ ...absenceForm, reason: e.target.value })} className="w-full px-3 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm mt-2" />
              <button onClick={addAbsence} className="w-full py-3 bg-rose-600 text-white text-sm font-bold rounded-xl press-scale mt-2">Сохранить</button>
            </BottomSheet>

            <BottomSheet isOpen={recalcModalOpen} onClose={() => setRecalcModalOpen(false)} title="Пересчет диапазона">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">От</label>
                  <input type="date" value={recalcRange.from} onChange={(e) => setRecalcRange({ ...recalcRange, from: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-[10px] font-bold uppercase text-slate-500 ml-1">До</label>
                  <input type="date" value={recalcRange.to} onChange={(e) => setRecalcRange({ ...recalcRange, to: e.target.value })} className="w-full px-2 py-2.5 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm" />
                </div>
              </div>
              <p className="text-[11px] text-slate-500 font-medium mt-2">Выберите режим:</p>
              <div className="space-y-2 mt-1">
                <button onClick={() => setRecalcConfirm({ resetAll: false })} className="w-full py-3 px-4 rounded-xl bg-indigo-600 text-white text-xs font-extrabold text-left press-scale">
                  ✅ Дозаполнить пустые
                  <span className="block text-[10px] font-normal opacity-80 mt-0.5">Существующие назначения не тронутся</span>
                </button>
                <button onClick={() => setRecalcConfirm({ resetAll: true })} className="w-full py-3 px-4 rounded-xl bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20 text-xs font-extrabold text-left press-scale">
                  ⚠️ Сбросить и заново
                  <span className="block text-[10px] font-normal opacity-80 mt-0.5">Все люди в диапазоне будут удалены</span>
                </button>
              </div>
            </BottomSheet>

            <BottomSheet isOpen={!!recalcConfirm} onClose={() => setRecalcConfirm(null)} title="Точно пересчитать?">
              <p className="text-xs text-slate-600 dark:text-slate-300">Диапазон: {recalcRange.from} — {recalcRange.to}. Режим: {recalcConfirm?.resetAll ? 'полный сброс' : 'дозаполнение пустых'}.</p>
              <div className="grid grid-cols-2 gap-2 mt-4">
                <button onClick={() => setRecalcConfirm(null)} className="py-3 rounded-xl bg-slate-100 dark:bg-obsidian-800 text-xs font-bold press-scale">Отмена</button>
                <button onClick={() => executeRecalculateRange(recalcRange.from, recalcRange.to, recalcConfirm.resetAll)} className="py-3 rounded-xl bg-rose-600 text-white text-xs font-extrabold press-scale">Подтвердить</button>
              </div>
            </BottomSheet>

            <BottomSheet isOpen={searchOpen} onClose={() => setSearchOpen(false)} title="Поиск бойца">
              <div className="relative">
                <input autoFocus type="text" placeholder="Введите фамилию..." value={statSearch} onChange={(e) => setStatSearch(e.target.value)} className="w-full pl-9 pr-3 py-3 border border-slate-200 dark:border-white/10 dark:bg-obsidian-800 rounded-xl text-sm outline-none" />
                <Icon name="search" size={16} className="absolute left-3 top-3.5 text-slate-400" />
              </div>
              <div className="space-y-1.5 mt-2 max-h-64 overflow-y-auto">
                {members.filter((m) => !statSearch.trim() || m.fullName.toLowerCase().includes(statSearch.toLowerCase())).map((m) => (
                  <button key={m.id} onClick={() => jumpToMember(m.id)} className="w-full text-left p-3 rounded-xl bg-slate-50 dark:bg-obsidian-800 border border-slate-200 dark:border-white/10 flex items-center justify-between press-scale">
                    <div>
                      <div className="text-xs font-bold">{m.fullName}</div>
                      <div className="text-[10px] text-slate-500 mt-0.5">{m.squad} отд. • {STATUS_INFO[m.status].label}</div>
                    </div>
                    <Icon name="chevronRight" size={14} className="text-slate-400" />
                  </button>
                ))}
              </div>
            </BottomSheet>

            <BottomSheet isOpen={!!confirmDialog} onClose={() => setConfirmDialog(null)} title={confirmDialog?.title || ''}>
              {confirmDialog && (
                <>
                  <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">{confirmDialog.message}</p>
                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button onClick={() => setConfirmDialog(null)} className="py-3 rounded-xl bg-slate-100 dark:bg-obsidian-800 text-xs font-bold press-scale">Отмена</button>
                    <button onClick={confirmDialog.onConfirm} className="py-3 rounded-xl bg-rose-600 text-white text-xs font-extrabold press-scale">{confirmDialog.confirmLabel}</button>
                  </div>
                </>
              )}
            </BottomSheet>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
