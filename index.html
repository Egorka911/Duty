    const validateSchedule = (scheduleMap, memberList, cooldownDays) => {
      const errors = [];
      let emptySlots = 0;
      const memberIds = new Set(memberList.map((m) => m.id));
      const memberById = new Map(memberList.map((m) => [m.id, m]));
      Object.entries(scheduleMap).forEach(([date, day]) => {
        const assignedToday = new Set();
        (day.batteryDutyIds || []).forEach((id) => {
          if (!memberIds.has(id)) errors.push(`${date}: неизвестный ${id}`);
          if (assignedToday.has(id)) errors.push(`${date}: двойное ${id}`);
          assignedToday.add(id);
        });
        (day.slots || []).forEach((slot) => {
          if (!slot.memberId) { emptySlots++; return; }
          if (!memberIds.has(slot.memberId)) errors.push(`${date}: неизвестный ${slot.memberId}`);
          if (assignedToday.has(slot.memberId)) errors.push(`${date}: двойное ${slot.memberId}`);
          assignedToday.add(slot.memberId);
          const m = memberById.get(slot.memberId);
          if (m && inAbsence(m, date)) errors.push(`${date}: назначен отсутствующий ${m.fullName}`);
        });
      });
      return { errors, emptySlots };
    };

    function BatteryDutyApp() {

      const [tab, setTab] = useState('TODAY');

      const [calendarMonthISO, setCalendarMonthISO] = useState(() => {

      const [quickViewDate, setQuickViewDate] = useState(null);

      const [members, setMembers] = useState(() => {

      const [schedules, setSchedules] = useState(() => {

        return s ? JSON.parse(s) : {};

      const [protectRestDay, setProtectRestDay] = useState(true);
      const [cooldownDays, setCooldownDays] = useState(() => Number(localStorage.getItem('bat_v12_cooldown') || 2));
      const [maxShiftsPerWeek, setMaxShiftsPerWeek] = useState(() => Number(localStorage.getItem('bat_v12_maxweek') || 0));
      const [logs, setLogs] = useState(() => {

      const [backups, setBackups] = useState(() => {

      const lastSyncTimestampRef = useRef(0);
      const [lastUndo, setLastUndo] = useState(null);

      const [statSquadFilter, setStatSquadFilter] = useState(0);
      const [statTaskFilter, setStatTaskFilter] = useState('ALL');
      const [statDateScope, setStatDateScope] = useState('ALL');
      const [statCustomFrom, setStatCustomFrom] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      });
      const [statCustomTo, setStatCustomTo] = useState(() => toISO(new Date()));
      const [statSearch, setStatSearch] = useState('');
      const [statSortBy, setStatSortBy] = useState('TOTAL_DESC');

      const [confirmDialog, setConfirmDialog] = useState(null);
      const [recalcModalOpen, setRecalcModalOpen] = useState(false);
      const [recalcRange, setRecalcRange] = useState({ from: '', to: '' });
      const [recalcConfirm, setRecalcConfirm] = useState(null);
      const [modalSlot, setModalSlot] = useState(null);
      const [assignMode, setAssignMode] = useState('REGULAR');
      const [batteryModalDate, setBatteryModalDate] = useState(null);
      const [addSlotDate, setAddSlotDate] = useState(null);
      const [customSlotTitle, setCustomSlotTitle] = useState('');
      const [testResults, setTestResults] = useState(null);
      const [searchOpen, setSearchOpen] = useState(false);
      const [noteModalDate, setNoteModalDate] = useState(null);
      const [noteText, setNoteText] = useState('');
      const [copyModalDate, setCopyModalDate] = useState(null);
      const [copyRange, setCopyRange] = useState({ from: '', to: '' });
      const [absenceModalMember, setAbsenceModalMember] = useState(null);
      const [absenceForm, setAbsenceForm] = useState({ from: '', to: '', reason: '' });
      const [backupFilter, setBackupFilter] = useState('ALL');

      const [newTplTitle, setNewTplTitle] = useState('');
      const [newTplCount, setNewTplCount] = useState(1);

      useEffect(() => { localStorage.setItem('bat_dark', darkMode ? '1' : '0'); }, [darkMode]);
      useEffect(() => localStorage.setItem('bat_v12_members', JSON.stringify(members)), [members]);

      useEffect(() => localStorage.setItem('bat_v12_schedules', JSON.stringify(schedules)), [schedules]);

      useEffect(() => localStorage.setItem('bat_v12_maxweek', String(maxShiftsPerWeek)), [maxShiftsPerWeek]);

      useEffect(() => {
        const anyModal = Boolean(confirmDialog) || recalcModalOpen || Boolean(modalSlot) ||
          Boolean(batteryModalDate) || Boolean(addSlotDate) || searchOpen ||
          Boolean(noteModalDate) || Boolean(copyModalDate) || Boolean(absenceModalMember) ||

        document.body.style.overflow = anyModal ? 'hidden' : '';

      }, [confirmDialog, recalcModalOpen, modalSlot, batteryModalDate, addSlotDate, searchOpen, noteModalDate, copyModalDate, absenceModalMember, recalcConfirm, quickViewDate]);

      const showToast = (msg, withUndo = false) => {
        setToast(msg);
        setTimeout(() => setToast(null), withUndo ? 6000 : 3200);

      const getMember = (id, list = members) => list.find((m) => m.id === id);
      const getName = (id, list = members) => {
        const m = getMember(id, list);
        return m ? `${m.fullName} (${m.squad} отд.)` : 'Не назначен';
      };

      const currentMonthInfo = useMemo(() => {
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const firstDay = new Date(y, m - 1, 1);
        const daysInMonth = new Date(y, m, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const datesList = [];
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          datesList.push(iso);
          cells.push({ dayNum: d, iso });
        }
        const monthTitle = firstDay.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
        return { year: y, month: m, firstDateISO: datesList[0], lastDateISO: datesList[datesList.length - 1], daysInMonth, datesList, cells, monthTitle };
      }, [calendarMonthISO]);

      const monthHoleCount = useMemo(() => {
        let count = 0;
        currentMonthInfo.datesList.forEach((iso) => {
          const day = schedules[iso];
          if (day?.slots?.some((s) => !s.memberId)) count++;
        });
        return count;
      }, [schedules, currentMonthInfo]);

      const changeMonth = (delta) => {
        haptic('light');
        const [y, m] = calendarMonthISO.split('-').map(Number);
        const next = new Date(y, m - 1 + delta, 1);
        setCalendarMonthISO(`${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`);

      };

      const goToToday = () => {
        haptic('light');
        const now = new Date();
        const thisMonthISO = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        const tISO = toISO(now);
        setCalendarMonthISO(thisMonthISO);
        setSelectedDayISO(tISO);
        setDayFilterMode('ALL_MONTH');
        setTimeout(() => {
          const el = document.getElementById(`day-card-${tISO}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      };

      const jumpToMember = (memberId) => {
        setSearchOpen(false);
        const member = getMember(memberId);
        if (!member) return;
        const today = toISO(new Date());
        const futureDates = Object.keys(schedules).sort().filter((d) => d >= today && schedules[d]?.slots?.some((s) => s.memberId === memberId));
        const anyDates = Object.keys(schedules).sort().filter((d) => schedules[d]?.slots?.some((s) => s.memberId === memberId));
        const target = futureDates[0] || anyDates[anyDates.length - 1];
        if (target) {
          const [y, m] = target.split('-');
          setCalendarMonthISO(`${y}-${m}-01`);
          setSelectedDayISO(target);
          setTimeout(() => {
            const el = document.getElementById(`day-card-${target}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        } else {
          setTab('STATS');
          setStatSearch(member.fullName);
        }
      };

      // ==== СИНХРОНИЗАЦИЯ ====
      const applyRemoteState = (st, updatedAtStr) => {
        if (!st || typeof st !== 'object') return;
        const remoteTs = updatedAtStr ? new Date(updatedAtStr).getTime() : Date.now();
        if (remoteTs <= lastSyncTimestampRef.current) return;
        lastSyncTimestampRef.current = remoteTs;

        if (Array.isArray(st.members)) setMembers(st.members);
        if (Array.isArray(st.taskTemplates)) setTaskTemplates(st.taskTemplates);
        if (st.schedules) {
          setSchedules((prev) => {
            const merged = { ...prev, ...st.schedules };
            Object.keys(merged).forEach((d) => {
              const day = merged[d];
              if (day?.batteryDutyIds) day.batteryDutyIds = Array.from(new Set(day.batteryDutyIds));
            });
            return merged;
          });
        }
        if (Array.isArray(st.logs)) {
          setLogs((prev) => {
            const byId = new Map(prev.map((l) => [l.id, l]));
            st.logs.forEach((rl) => { if (!byId.has(rl.id)) byId.set(rl.id, rl); });
            return Array.from(byId.values()).slice(0, 100);
          });
        }
        if (Array.isArray(st.backups)) setBackups(st.backups);
        setCloudStatus('🟢 Live-синхронизация активна');
        setPendingSync(false);
      };

      const pushToCloudNow = async (overrides = {}) => {
        if (!isUserAdmin) return false;
        const nowIso = new Date().toISOString();
        lastSyncTimestampRef.current = new Date(nowIso).getTime();
        const nextState = {
          members: overrides.members ?? members,
          taskTemplates: overrides.taskTemplates ?? taskTemplates,
          schedules: overrides.schedules ?? schedules,
          logs: overrides.logs ?? logs,
          backups: overrides.backups ?? backups,
        };
        try {
          setCloudStatus('⏳ Сохранение...');
          const res = await fetch(`${SUPA_URL}/rest/v1/duty_sync?on_conflict=room_code`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              apikey: SUPA_KEY,
              Authorization: `Bearer ${SUPA_KEY}`,
              Prefer: 'resolution=merge-duplicates',
            },
            body: JSON.stringify({ room_code: ROOM_CODE, state_json: nextState, updated_at: nowIso }),
          });
          if (!res.ok) { setCloudStatus(`❌ Ошибка (${res.status})`); setPendingSync(true); return false; }
          setCloudStatus('🟢 Синхронизировано');
          setPendingSync(false);
          return true;
        } catch (e) { setCloudStatus('❌ Ошибка сети'); setPendingSync(true); return false; }
      };

      const pullFromCloudNow = async (silent = false) => {
        try {
          if (!silent) setCloudStatus('⏳ Загрузка...');
          const res = await fetch(
            `${SUPA_URL}/rest/v1/duty_sync?room_code=eq.${ROOM_CODE}&select=state_json,updated_at`,
            { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Cache-Control': 'no-cache' } }
          );
          if (!res.ok) return;
          const data = await res.json();
          if (data?.[0]?.state_json && typeof data[0].state_json === 'object') {
            applyRemoteState(data[0].state_json, data[0].updated_at);
          }
        } catch (e) { if (!silent) setCloudStatus('⚠️ Автономный режим'); }
      };

      useEffect(() => {
        let cancelled = false;
        let channel = null;
        const loadCloudState = async (silent = false) => {
          if (cancelled) return;
          await pullFromCloudNow(silent);
          if (pendingSync) pushToCloudNow();
        };
        loadCloudState(false);
        if (supabaseClient) {
          channel = supabaseClient
            .channel('public:duty_sync')
            .on('postgres_changes',
              { event: '*', schema: 'public', table: 'duty_sync', filter: `room_code=eq.${ROOM_CODE}` },
              (payload) => {
                if (!cancelled && payload?.new?.state_json) {
                  applyRemoteState(payload.new.state_json, payload.new.updated_at);
                }
              }
            ).subscribe();
        }
        const interval = setInterval(() => loadCloudState(true), 60000);
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') loadCloudState(true);
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          cancelled = true;
          clearInterval(interval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (channel && supabaseClient) supabaseClient.removeChannel(channel);
        };
      }, [pendingSync]);

      const createLogAndBackup = (actionTitle, detailsText, createSnapshot = false, type = 'OTHER') => {
        const timeStr = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const author = tg?.initDataUnsafe?.user?.first_name || `ID:${currentTelegramId || 'Админ'}`;
        const newEntry = {
          id: `log_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          time: timeStr, author, action: actionTitle, details: detailsText, type,
        };
        const nextLogs = [newEntry, ...logs.slice(0, 99)];
        setLogs(nextLogs);
        let nextBackups = backups;
        if (createSnapshot) {
          const snap = {
            id: `bk_${Date.now()}`, time: timeStr, type,
            label: `${actionTitle}: ${detailsText.slice(0, 40)}`,
            schedules: JSON.parse(JSON.stringify(schedules)),
            members: JSON.parse(JSON.stringify(members)),
          };
          nextBackups = [snap, ...backups.slice(0, 19)];
          setBackups(nextBackups);
        }
        return { nextLogs, nextBackups };
      };

      const restoreBackupSnapshot = (snap) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: '⏪ Восстановить бэкап?',
          message: `График вернётся к состоянию от ${snap.time} («${snap.label}»).`,
          confirmLabel: 'Восстановить',
          onConfirm: () => {
            setSchedules(snap.schedules);
            if (snap.members) setMembers(snap.members);
            const { nextLogs } = createLogAndBackup('⏪ Откат из бэкапа', `Версия от ${snap.time}`, false, 'RESTORE');
            pushToCloudNow({ schedules: snap.schedules, members: snap.members || members, logs: nextLogs });
            setConfirmDialog(null);
            showToast('⏪ График восстановлен');
          },
        });
      };

      const isRecoveringFromBatteryDuty = (memberId, dateStr, schedMap = schedules) => {
        if (!protectRestDay) return false;
        const prevDate = addDaysISO(dateStr, -1);
        return Boolean(schedMap[prevDate]?.batteryDutyIds?.includes(memberId));
      };

      const allWorkloadTitles = useMemo(() => {
        const titles = new Set(taskTemplates.map((t) => t.title));
        Object.values(schedules).forEach((day) => {
          (day?.slots || []).forEach((s) => { if (s.title) titles.add(s.title); });
        });
        return Array.from(titles);
      }, [taskTemplates, schedules]);

      const statsMap = useMemo(() => {
        const map = {};
        members.forEach((m) => {
          map[m.id] = { ...m, batteryCount: 0, totalAll: 0, byTitle: {}, regularShifts: 0, penaltyShifts: 0 };
        });
        Object.keys(schedules).sort().forEach((date) => {
          if (statDateScope === 'MONTH') {
            if (date < currentMonthInfo.firstDateISO || date > currentMonthInfo.lastDateISO) return;
          } else if (statDateScope === 'CUSTOM') {
            if (date < statCustomFrom || date > statCustomTo) return;
          }
          const day = schedules[date];
          if (!day) return;
          (day.batteryDutyIds || []).forEach((mId) => {
            if (map[mId]) { map[mId].batteryCount += 1; map[mId].totalAll += 1; }
          });
          (day.slots || []).forEach((s) => {
            if (!s.memberId || !map[s.memberId]) return;
            const st = map[s.memberId];
            st.totalAll += 1;
            st.byTitle[s.title] = (st.byTitle[s.title] || 0) + 1;
            if (s.isPenalty) st.penaltyShifts += 1;
            else st.regularShifts += 1;
          });
        });
        return map;
      }, [members, schedules, statDateScope, currentMonthInfo, statCustomFrom, statCustomTo]);

      const fairnessMetrics = useMemo(() => {
        const activeList = Object.values(statsMap).filter((m) => m.status === 'ACTIVE');
        if (activeList.length === 0) return { index: 100, stdDev: 0, min: 0, max: 0 };
        const counts = activeList.map((m) => m.totalAll);
        const min = Math.min(...counts);
        const max = Math.max(...counts);
        const avg = counts.reduce((a, b) => a + b, 0) / counts.length;
        const variance = counts.reduce((acc, s) => acc + Math.pow(s - avg, 2), 0) / counts.length;
        const stdDev = Math.sqrt(variance);
        const index = Math.max(0, Math.min(100, Math.round(100 - stdDev * 15)));
        return { index, stdDev, min, max };
      }, [statsMap]);

      const filteredStatsList = useMemo(() => {
        return Object.values(statsMap)
          .filter((st) => {
            if (statSquadFilter !== 0 && st.squad !== statSquadFilter) return false;
            if (statSearch.trim() && !st.fullName.toLowerCase().includes(statSearch.trim().toLowerCase())) return false;
            if (statTaskFilter !== 'ALL') {
              if (statTaskFilter === 'BATTERY' && (st.batteryCount || 0) === 0) return false;
              if (statTaskFilter === 'PENALTY' && (st.penaltyShifts || 0) === 0) return false;
              if (statTaskFilter !== 'BATTERY' && statTaskFilter !== 'PENALTY' && (st.byTitle[statTaskFilter] || 0) === 0) return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (statSortBy === 'NAME_ASC') return a.fullName.localeCompare(b.fullName, 'ru');
            if (statSortBy === 'TOTAL_ASC') return a.totalAll - b.totalAll;
            if (statSortBy === 'TASK_DESC') {
              const getVal = (item) => {
                if (statTaskFilter === 'ALL') return item.totalAll;
                if (statTaskFilter === 'BATTERY') return item.batteryCount;
                if (statTaskFilter === 'PENALTY') return item.penaltyShifts;
                return item.byTitle[statTaskFilter] || 0;
              };
              return getVal(b) - getVal(a);
            }
            return b.totalAll - a.totalAll;
          });
      }, [statsMap, statSquadFilter, statSearch, statSortBy, statTaskFilter]);

      // ==== ГЕНЕРАТОР ====
      const canAssignMember = ({ member, dateStr, usedToday, schedulesMap }) => {
        if (member.status !== 'ACTIVE') return false;
        if (inAbsence(member, dateStr)) return false;
        if (usedToday.has(member.id)) return false;
        if (protectRestDay) {
          const prev = addDaysISO(dateStr, -1);
          if (schedulesMap[prev]?.batteryDutyIds?.includes(member.id)) return false;
        }
        return true;
      };

      const runScheduleGenerator = (baseSchedules, keepExistingSlots, periodStart, periodDays, currentMembers, currentTemplates) => {
        const updated = JSON.parse(JSON.stringify(baseSchedules));
        const workload = {};
        currentMembers.forEach((m) => { workload[m.id] = { total: 0, byTitle: {}, lastDate: null }; });

        const addWorkload = (memberId, title, dateStr) => {
          const it = workload[memberId];
          if (!it) return;
          it.total += 1;
          it.byTitle[title] = (it.byTitle[title] || 0) + 1;
          it.lastDate = dateStr;
        };

        const base = new Date(periodStart + 'T00:00:00');
        const period = [];
        for (let i = 0; i < periodDays; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          period.push(toISO(d));
        }

        Object.keys(updated).sort().forEach((dKey) => {
          if (dKey < period[0]) {
            const day = updated[dKey];
            (day.batteryDutyIds || []).forEach((mId) => {
              if (workload[mId]) { workload[mId].total += 1; workload[mId].lastDate = dKey; }
            });
            (day.slots || []).forEach((s) => {
              if (s.memberId && workload[s.memberId]) {
                if (!s.isPenalty) addWorkload(s.memberId, s.title, dKey);
                else workload[s.memberId].lastDate = dKey;
              }
            });
          }
        });

        const weekCount = {};
        currentMembers.forEach((m) => (weekCount[m.id] = {}));
        const weekKeyOf = (dateStr) => {
          const d = new Date(dateStr + 'T00:00:00');
          const monday = new Date(d);
          monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return toISO(monday);
        };

        period.forEach((dateStr) => {
          const wk = weekKeyOf(dateStr);
          const existing = updated[dateStr];
          const batteryDutyIds = Array.from(new Set(existing?.batteryDutyIds || []));
          batteryDutyIds.forEach((mId) => {
            if (workload[mId]) { workload[mId].total += 1; workload[mId].lastDate = dateStr; }
            if (weekCount[mId]) weekCount[mId][wk] = (weekCount[mId][wk] || 0) + 1;
          });

          const templateSlots = [];
          currentTemplates.forEach((tpl) => {
            for (let c = 0; c < tpl.count; c++) {
              templateSlots.push({
                id: `${dateStr}_${tpl.id}_${c}_${Math.random().toString(36).slice(2, 5)}`,
                date: dateStr, title: tpl.title,
                memberId: null, isPenalty: false, isManual: false, locked: false, unassignedReason: null,
              });
            }
          });

          let slots = templateSlots;
          if (existing && keepExistingSlots && existing.slots && existing.slots.length > 0) {
            slots = existing.slots.map((s) => {
              if (s.memberId && batteryDutyIds.includes(s.memberId)) {
                return { ...s, memberId: null, isManual: false, isPenalty: false, unassignedReason: null };
              }
              return s.memberId ? { ...s } : { ...s, memberId: null, isPenalty: false, unassignedReason: null };
            });
          }

          const usedToday = new Set(batteryDutyIds);
          const usedSquadsToday = {};
          batteryDutyIds.forEach((id) => {
            const m = currentMembers.find((x) => x.id === id);
            if (m) usedSquadsToday[m.squad] = (usedSquadsToday[m.squad] || 0) + 1;
          });
          slots.forEach((slot) => {
            if (slot.memberId) {
              usedToday.add(slot.memberId);
              const mem = currentMembers.find((x) => x.id === slot.memberId);
              if (mem) usedSquadsToday[mem.squad] = (usedSquadsToday[mem.squad] || 0) + 1;
              if (!slot.isPenalty && workload[slot.memberId]) addWorkload(slot.memberId, slot.title, dateStr);
              else if (workload[slot.memberId]) workload[slot.memberId].lastDate = dateStr;
            }
          });

          const yesterday = addDaysISO(dateStr, -1);
          const yesterdaySlots = updated[yesterday]?.slots || [];

          slots.forEach((slot) => {
            if (slot.memberId) return;
            const eligible = currentMembers.filter((m) =>
              canAssignMember({ member: m, dateStr, usedToday, schedulesMap: updated })
            );

            const scored = eligible.map((m) => {
              const w = workload[m.id] || { total: 0, byTitle: {} };
              const roleCnt = w.byTitle[slot.title] || 0;
              const cd = cooldownDays > 0 && w.lastDate && daysDiff(dateStr, w.lastDate) < cooldownDays;
              const hadSameRoleYesterday = yesterdaySlots.some((s) => s.memberId === m.id && s.title === slot.title);
              const repeatPenalty = hadSameRoleYesterday ? 5 : 0;
              const squadPenalty = (usedSquadsToday[m.squad] || 0) * 3;

              let weekPenalty = 0;
              if (maxShiftsPerWeek > 0) {
                const cur = weekCount[m.id]?.[weekKeyOf(dateStr)] || 0;
                if (cur >= maxShiftsPerWeek) weekPenalty = 10000;
              }

              const priority = w.total + roleCnt * 2 + repeatPenalty + squadPenalty + (cd ? 1000 : 0) + weekPenalty;
              return { m, priority, roleCnt };
            });

            scored.sort((a, b) => {
              if (a.priority !== b.priority) return a.priority - b.priority;
              if (a.roleCnt !== b.roleCnt) return a.roleCnt - b.roleCnt;
              return a.m.fullName.localeCompare(b.m.fullName, 'ru');
            });

            if (scored.length === 0) {
              slot.unassignedReason = 'Нет свободных бойцов';
              return;
            }

            const minP = scored[0].priority;
            const pool = scored.filter((x) => Math.abs(x.priority - minP) <= 0.5);
            const chosen = pool[0].m;
            slot.memberId = chosen.id;
            slot.unassignedReason = null;
            usedToday.add(chosen.id);
            usedSquadsToday[chosen.squad] = (usedSquadsToday[chosen.squad] || 0) + 1;
            if (weekCount[chosen.id]) {
              const wk = weekKeyOf(dateStr);
              weekCount[chosen.id][wk] = (weekCount[chosen.id][wk] || 0) + 1;
            }
            addWorkload(chosen.id, slot.title, dateStr);
          });

          updated[dateStr] = { ...(updated[dateStr] || {}), date: dateStr, batteryDutyIds, slots };
        });

        return { updatedSchedules: updated };
      };

      const regenerateFromDate = (dateStr, schedulesWithManualChange) => {
        const lastScheduledDate = Object.keys(schedulesWithManualChange).sort().pop();
        const fallbackEnd = currentMonthInfo.lastDateISO;
        const endDate = lastScheduledDate && lastScheduledDate > dateStr ? lastScheduledDate : fallbackEnd;
        const periodDays = daysDiff(endDate, dateStr) + 1;

        // 1. Делаем глубокую копию, чтобы не мутировать состояние
        const cleanedSchedules = JSON.parse(JSON.stringify(schedulesWithManualChange));

        // 2. Пробегаем по всем дням начиная с измененной даты
        // и СНИМАЕМ всех, кого поставил АВТОМАТ (оставляем только locked = true)
        let cursor = dateStr;
        let guard = 0;
        while (cursor <= endDate && guard < 400) {
          const day = cleanedSchedules[cursor];
          if (day && day.slots) {
            day.slots = day.slots.map(slot => {
              if (slot.locked) return slot; // Ручные (закрепленные) не трогаем
              return { ...slot, memberId: null, isManual: false, isPenalty: false }; // Авто - снимаем
            });
          }
          cursor = addDaysISO(cursor, 1);
          guard++;
        }

        // 3. Запускаем генератор. Он заполнит пустые слоты с учетом НОВОГО ручного назначения
        const { updatedSchedules } = runScheduleGenerator(
          cleanedSchedules, 
          true, 
          dateStr, 
          periodDays, 
          members, 
          taskTemplates
        );

        const { errors, emptySlots } = validateSchedule(updatedSchedules, members, cooldownDays);
        if (errors.length > 0) showToast(`⚠️ Ошибок: ${errors.length}`);
        else if (emptySlots > 0) showToast(`График пересчитан. Свободных: ${emptySlots}`);
        else showToast('✅ Пересчитано');
        
        return updatedSchedules;
      };

      const reportGenerationResult = (updatedSchedules) => {
        const { errors, emptySlots } = validateSchedule(updatedSchedules, members, cooldownDays);
        if (errors.length > 0) showToast(`⚠️ Ошибок: ${errors.length}`);
        else if (emptySlots > 0) showToast(`Свободных задач: ${emptySlots}`);
        else showToast('✅ Всё заполнено');
      };

      const fillEmptyDaysInMonth = () => {
        if (!isUserAdmin) return;
        haptic('medium');
        const before = schedules;
        const { nextLogs, nextBackups } = createLogAndBackup(
          '⚡ Заполнение месяца', `Заполнены пустые дни за ${currentMonthInfo.monthTitle}`, true, 'RECALC'
        );
        const { updatedSchedules } = runScheduleGenerator(
          schedules, true, currentMonthInfo.firstDateISO, currentMonthInfo.daysInMonth, members, taskTemplates
        );
        setLastUndo({ schedules: before, label: 'Заполнение месяца' });
        setSchedules(updatedSchedules);
        pushToCloudNow({ schedules: updatedSchedules, logs: nextLogs, backups: nextBackups });
        reportGenerationResult(updatedSchedules);
      };

      const executeRecalculateRange = (fromISO, toISO_, resetAll) => {
        if (!isUserAdmin) return;
        haptic('medium');
        const days = daysDiff(toISO_, fromISO) + 1;
        const before = schedules;
        const { nextLogs, nextBackups } = createLogAndBackup(
          '🔄 Пересчет диапазона', `${fromISO}…${toISO_} (${days} дн.), режим: ${resetAll ? 'сброс' : 'дозаполнение'}`, true, 'RECALC'
        );
        const { updatedSchedules } = runScheduleGenerator(
          schedules, !resetAll, fromISO, days, members, taskTemplates
        );
        setLastUndo({ schedules: before, label: 'Пересчет' });
        setSchedules(updatedSchedules);
        pushToCloudNow({ schedules: updatedSchedules, logs: nextLogs, backups: nextBackups });
        setRecalcModalOpen(false);
        setRecalcConfirm(null);
        reportGenerationResult(updatedSchedules);
      };

      const undoLastAction = () => {
        if (!lastUndo || !isUserAdmin) return;
        haptic('medium');
        setSchedules(lastUndo.schedules);
        pushToCloudNow({ schedules: lastUndo.schedules });
        showToast('↩ Отменено');
        setLastUndo(null);
      };

      const askConfirmDeleteSlot = (dateStr, slotObj) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: '🗑 Удалить задачу?',
          message: `Удалить «${slotObj.title}» (${getName(slotObj.memberId)}) из ${formatRuDate(dateStr)}?`,
          confirmLabel: 'Удалить',
          onConfirm: () => {
            haptic('medium');
            const before = schedules;
            const nextSchedules = {
              ...schedules,
              [dateStr]: {
                ...schedules[dateStr],
                slots: (schedules[dateStr]?.slots || []).filter((s) => s.id !== slotObj.id),
              },
            };
            const { nextLogs, nextBackups } = createLogAndBackup(
              '🗑 Удалена задача', `${formatRuDate(dateStr)}: «${slotObj.title}» (${getName(slotObj.memberId)})`, true, 'ASSIGNMENT'
            );
            const recalculated = regenerateFromDate(dateStr, nextSchedules);
            setLastUndo({ schedules: before, label: 'Удаление задачи' });
            setSchedules(recalculated);
            pushToCloudNow({ schedules: recalculated, logs: nextLogs, backups: nextBackups });
            setConfirmDialog(null);
            if (modalSlot) setModalSlot(null);
            showToast('Удалено', true);
          },
        });
      };

      const askConfirmClearDay = (dateStr) => {
        if (!isUserAdmin) return;
        setConfirmDialog({
          title: `🗑 Очистить сутки ${formatRuDate(dateStr)}?`,
          message: `Все задачи и наряды на ${dateStr} будут сняты.`,
          confirmLabel: 'Да, очистить',
          onConfirm: () => {
            haptic('medium');
            const before = schedules;
            const nextSchedules = { ...schedules, [dateStr]: { date: dateStr, batteryDutyIds: [], slots: [] } };
            const { nextLogs, nextBackups } = createLogAndBackup('🗑 Очистка суток', `${formatRuDate(dateStr)}`, true, 'CLEAR');
            const recalculated = regenerateFromDate(dateStr, nextSchedules);
            setLastUndo({ schedules: before, label: 'Очистка суток' });
            setSchedules(recalculated);
            pushToCloudNow({ schedules: recalculated, logs: nextLogs, backups: nextBackups });
            setConfirmDialog(null);
            showToast('Сутки очищены', true);
          },
        });
      };

      const applyManualChangeAndCascade = (dateStr, nextSchedules, logTitle, logDetails, type = 'ASSIGNMENT') => {
        const before = schedules;
        const { nextLogs, nextBackups } = createLogAndBackup(logTitle, logDetails, true, type);
        const recalculated = regenerateFromDate(dateStr, nextSchedules);
        setLastUndo({ schedules: before, label: logTitle });
        setSchedules(recalculated);
        pushToCloudNow({ schedules: recalculated, logs: nextLogs, backups: nextBackups });
      };

      const handleAssignMember = (newMemberId) => {
        if (!isUserAdmin || !modalSlot) return;
        haptic('light');
        const { date, slot } = modalSlot;
        const oldName = getName(slot.memberId);
        const newName = getName(newMemberId);
        const isPenalty = assignMode === 'PENALTY';
        const nextSchedules = {
          ...schedules,
          [date]: {
            ...schedules[date],
            slots: (schedules[date]?.slots || []).map((s) =>
              s.id === slot.id
                ? { ...s, memberId: newMemberId, isPenalty, isManual: true, locked: true, unassignedReason: null }
                : s
            ),
          },
        };
        applyManualChangeAndCascade(
          date, nextSchedules,
          isPenalty ? '⚠ Штрафной наряд' : '🔄 Замена',
          `${formatRuDate(date)} [${slot.title}]: ${oldName} → ${newName}`,
          isPenalty ? 'PENALTY' : 'ASSIGNMENT'
        );
        setModalSlot(null);
        showToast(`✅ ${newName}`, true);
      };

      const clearSlotAssignment = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('light');
        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: (schedules[dateStr]?.slots || []).map((s) =>
              s.id === slotObj.id
                ? { ...s, memberId: null, isManual: false, isPenalty: false, locked: false, unassignedReason: null }
                : s
            ),
          },
        };
        applyManualChangeAndCascade(
          dateStr, nextSchedules,
          '🧹 Снят боец', `${formatRuDate(dateStr)} [${slotObj.title}]`, 'ASSIGNMENT'
        );
        showToast('Снято', true);
      };

      const replaceWithBestCandidate = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).filter((s) => s.id !== slotObj.id).map((s) => s.memberId).filter(Boolean),
        ]);
        const best = members
          .filter((m) => m.status === 'ACTIVE' && !inAbsence(m, dateStr) && !usedToday.has(m.id) && !isRecoveringFromBatteryDuty(m.id, dateStr))
          .sort((a, b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0))[0];
        if (!best) { showToast('Кандидат не найден'); return; }
        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: schedules[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: best.id, isManual: true, locked: true, unassignedReason: null } : s
            ),
          },
        };
        applyManualChangeAndCascade(
          dateStr, nextSchedules,
          '⭐ Лучший кандидат',
          `${formatRuDate(dateStr)} [${slotObj.title}]: ${getName(slotObj.memberId)} → ${best.fullName}`,
          'ASSIGNMENT'
        );
        if (modalSlot) setModalSlot(null);
        showToast(`⭐ ${best.fullName}`, true);
      };

      const replaceWithRandomLeastLoaded = (dateStr, slotObj, e) => {
        if (e) e.stopPropagation();
        if (!isUserAdmin) return;
        haptic('medium');
        const day = schedules[dateStr];
        if (!day) return;
        const usedToday = new Set([
          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);
        const eligible = members.filter(
          (m) => m.status === 'ACTIVE' && !inAbsence(m, dateStr) && !usedToday.has(m.id) &&
            m.id !== slotObj.memberId && !isRecoveringFromBatteryDuty(m.id, dateStr)
        );
        if (eligible.length === 0) { showToast('Нет свободных'); return; }
        const sorted = eligible.map((m) => ({ m, count: statsMap[m.id]?.totalAll || 0 })).sort((a, b) => a.count - b.count);
        const minCount = sorted[0].count;
        let pool = sorted.filter((x) => x.count <= minCount + 1);
        if (pool.length < 3) pool = sorted.slice(0, Math.min(4, sorted.length));
        const chosen = pool[Math.floor(Math.random() * pool.length)].m;

        const nextSchedules = {
          ...schedules,
          [dateStr]: {
            ...schedules[dateStr],
            slots: schedules[dateStr].slots.map((s) =>
              s.id === slotObj.id ? { ...s, memberId: chosen.id, isManual: true, locked: true, unassignedReason: null } : s
            ),
          },
        };
        applyManualChangeAndCascade(
          dateStr, nextSchedules,
          '🎲 Случайная замена',
          `${formatRuDate(dateStr)} [${slotObj.title}]: ${getName(slotObj.memberId)} → ${chosen.fullName}`,
          'ASSIGNMENT'
        );
        if (modalSlot) setModalSlot(null);
        showToast(`🎲 ${chosen.fullName}`, true);
      };

      const toggleBatteryDutyMember = (dateStr, memberId) => {
        if (!isUserAdmin) return;
        haptic('light');
        const day = schedules[dateStr] || { date: dateStr, batteryDutyIds: [], slots: [] };
        const currentList = Array.from(new Set(day.batteryDutyIds || []));
        const exists = currentList.includes(memberId);
        const nextList = exists ? currentList.filter((id) => id !== memberId) : Array.from(new Set([...currentList, memberId]));
        const updatedSchedules = { ...schedules, [dateStr]: { ...day, batteryDutyIds: nextList } };

        if (!exists) {
          const datesToCheck = protectRestDay ? [dateStr, addDaysISO(dateStr, 1)] : [dateStr];
          datesToCheck.forEach((dKey) => {
            const targetDay = updatedSchedules[dKey];
            if (!targetDay?.slots) return;
            const busy = new Set([
              ...(targetDay.batteryDutyIds || []),
              ...targetDay.slots.map((s) => s.memberId).filter(Boolean),
            ]);
            targetDay.slots = targetDay.slots.map((slot) => {
              if (slot.memberId !== memberId) return slot;
              const replacement = members
                .filter((m) => m.status === 'ACTIVE' && !inAbsence(m, dKey) && !busy.has(m.id) && !isRecoveringFromBatteryDuty(m.id, dKey, updatedSchedules))
                .sort((a, b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0))[0];
              if (replacement) { busy.add(replacement.id); return { ...slot, memberId: replacement.id, isManual: true }; }
              return { ...slot, memberId: null };
            });
          });
        }

        applyManualChangeAndCascade(
          dateStr, updatedSchedules,
          '🛡️ Наряд по батарее',
          `${formatRuDate(dateStr)}: ${getName(memberId)} (${exists ? 'снят' : 'назначен'})`,
          'BATTERY'

          ...(day.batteryDutyIds || []),
          ...(day.slots || []).map((s) => s.memberId).filter(Boolean),
        ]);
        const eligible = members
          .filter((m) => m.status === 'ACTIVE' && !inAbsence(m, addSlotDate) && !usedToday.has(m.id) && !isRecoveringFromBatteryDuty(m.id, addSlotDate))
          .sort((a, b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0));
        const chosen = eligible[0] || null;
        const newSlot = {
          id: `${addSlotDate}_custom_${Date.now()}`,
          date: addSlotDate, title: customSlotTitle.trim(),
          memberId: chosen ? chosen.id : null,
          isPenalty: false, isManual: true, locked: !!chosen, unassignedReason: null,
        };
        const nextSchedules = {
          ...schedules,
          [addSlotDate]: { ...day, slots: [...(day.slots || []), newSlot] },
        };
        applyManualChangeAndCascade(
          addSlotDate, nextSchedules,
          '➕ Добавлена задача',
          `${formatRuDate(addSlotDate)}: «${newSlot.title}» → ${chosen ? getName(chosen.id) : '—'}`,

        setCopyModalDate(fromDate);
        setCopyRange({ from: addDaysISO(fromDate, 1), to: addDaysISO(fromDate, 6) });
      };

        if (!copyModalDate || !copyRange.from || !copyRange.to) return;
        const fromDay = schedules[copyModalDate] || { slots: [] };
        const nextSchedules = { ...schedules };
        let cursor = copyRange.from;
        const guard = 400;
        let i = 0;
        while (cursor <= copyRange.to && i < guard) {
          const existing = nextSchedules[cursor] || { date: cursor, batteryDutyIds: [], slots: [] };
          const templateSlots = fromDay.slots.map((s, idx) => ({
            id: `${cursor}_copy_${idx}_${Math.random().toString(36).slice(2, 5)}`,
            date: cursor, title: s.title,
            memberId: null, isPenalty: false, isManual: false, locked: false, unassignedReason: null,
          }));
          nextSchedules[cursor] = { ...existing, date: cursor, slots: templateSlots };
          cursor = addDaysISO(cursor, 1);
          i++;

                      <div className="text-center py-4 text-xs text-slate-400 border border-dashed rounded-xl">Задач нет</div>
                    ) : (
                      schedules[quickViewDate].slots.map((slot) => {
                        const m = getMember(slot.memberId);
                        return (
                          <div key={slot.id} className={`p-2.5 rounded-xl border flex items-center justify-between ${slot.isPenalty ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                            <div className="min-w-0 flex-1">
                              <div className="text-[10px] font-extrabold uppercase text-indigo-600 dark:text-indigo-400 mb-0.5">{slot.title}</div>
                              <div className="flex items-center gap-1.5">
                                <span className={`text-sm font-bold truncate ${m ? 'text-slate-900 dark:text-white' : 'text-slate-400'}`}>
                                  {m ? m.fullName : 'Не назначен'}
                                </span>
                                {m && <span className={`text-[9px] font-bold px-1 rounded ${SQUAD_BADGE[m.squad]}`}>{m.squad} отд.</span>}
                              </div>
                            </div>
                            {isUserAdmin && (
                              <button 
                                onClick={() => { setQuickViewDate(null); setModalSlot({ date: quickViewDate, slot }); }} 
                                className="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-xs font-bold shadow-xs shrink-0"
                              >
                                ✏️
                              </button>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>

                  {isUserAdmin && (
                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button 
                        onClick={() => { setQuickViewDate(null); setAddSlotDate(quickViewDate); }}
                        className="py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold rounded-xl"
                      >
                        + Задача
                      </button>
                      <button 
                        onClick={() => { 
                          setQuickViewDate(null); 
                          setSelectedDayISO(quickViewDate); 
                          setDayFilterMode('SINGLE_DAY'); 
                          setTab('SCHEDULE'); 
                          setTimeout(() => document.getElementById(`day-card-${quickViewDate}`)?.scrollIntoView({behavior:'smooth'}), 100);
                        }}
                        className="py-2 bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-bold rounded-xl"
                      >
                        🔍 В списке
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ПОИСК */}
            {searchOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-start justify-center p-4 pt-16 modal-enter">
                <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-4 space-y-3 border shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-extrabold">🔍 Поиск бойца</h3>
                    <button onClick={() => setSearchOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <input autoFocus type="text" placeholder="Фамилия..." value={statSearch} onChange={(e) => setStatSearch(e.target.value)}
                    className="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-800" />
                  <div className="max-h-72 overflow-y-auto divide-y divide-slate-100">
                    {members.filter((m) => !statSearch.trim() || m.fullName.toLowerCase().includes(statSearch.toLowerCase())).map((m) => (
                      <button key={m.id} onClick={() => jumpToMember(m.id)} className="w-full text-left p-2 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800">
                        <div>
                          <div className="text-xs font-bold">{m.fullName}</div>
                          <div className="text-[10px] text-slate-500">{m.squad} отд. • {STATUS_INFO[m.status].label}</div>
                        </div>
                        <span className="text-indigo-600 font-bold text-xs">→</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* МОДАЛКА ЗАМЕТКИ */}
            {noteModalDate && (
              <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">📝 Заметка • {formatRuDate(noteModalDate)}</div>
                    <button onClick={() => setNoteModalDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <textarea rows="3" value={noteText} onChange={(e) => setNoteText(e.target.value)} placeholder="Например: ПХД после обеда"
                    className="w-full px-3 py-2 border rounded-xl text-xs dark:bg-slate-800" />
                  <button onClick={saveDayNote} className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">Сохранить</button>
                </div>
              </div>
            )}

            {/* МОДАЛКА КОПИРОВАНИЯ */}
            {copyModalDate && (
              <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">📋 Копировать структуру из {formatRuDate(copyModalDate)}</div>
                    <button onClick={() => setCopyModalDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">С</label>
                      <input type="date" value={copyRange.from} onChange={(e) => setCopyRange({ ...copyRange, from: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">По</label>
                      <input type="date" value={copyRange.to} onChange={(e) => setCopyRange({ ...copyRange, to: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                  </div>
                  <p className="text-[10px] text-slate-500">Копируется только структура (типы задач). Назначения будут пустыми.</p>
                  <button onClick={applyCopyDayStructure} className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">Применить</button>
                </div>
              </div>
            )}

            {/* МОДАЛКА ОТСУТСТВИЯ */}
            {absenceModalMember && (
              <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">🚫 Отсутствие • {absenceModalMember.fullName}</div>
                    <button onClick={() => setAbsenceModalMember(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">С</label>
                      <input type="date" value={absenceForm.from} onChange={(e) => setAbsenceForm({ ...absenceForm, from: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">По</label>
                      <input type="date" value={absenceForm.to} onChange={(e) => setAbsenceForm({ ...absenceForm, to: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                  </div>
                  <input type="text" placeholder="Причина (необязательно)" value={absenceForm.reason} onChange={(e) => setAbsenceForm({ ...absenceForm, reason: e.target.value })}
                    className="w-full px-3 py-2 border rounded-xl text-xs dark:bg-slate-800" />
                  <button onClick={addAbsence} className="w-full py-2 bg-rose-600 text-white text-xs font-bold rounded-xl">Добавить</button>
                </div>
              </div>
            )}

            {/* МОДАЛКА ПЕРЕСЧЕТА */}
            {recalcModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 modal-enter">
                <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-5 space-y-3 border shadow-2xl">
                  <h3 className="text-base font-extrabold">🔄 Пересчитать диапазон</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">От</label>
                      <input type="date" value={recalcRange.from} onChange={(e) => setRecalcRange({ ...recalcRange, from: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-500">До</label>
                      <input type="date" value={recalcRange.to} onChange={(e) => setRecalcRange({ ...recalcRange, to: e.target.value })} className="w-full px-2 py-1 border rounded-lg text-xs dark:bg-slate-800" />
                    </div>
                  </div>
                  <p className="text-[11px] text-slate-500">Выберите режим:</p>
                  <div className="space-y-2">
                    <button onClick={() => setRecalcConfirm({ resetAll: false })} className="w-full py-2.5 px-3 rounded-xl bg-indigo-600 text-white text-xs font-extrabold text-left">
                      ✅ Заполнить пустые
                      <span className="block text-[10px] font-normal text-indigo-100 mt-0.5">Существующие назначения остаются</span>
                    </button>
                    <button onClick={() => setRecalcConfirm({ resetAll: true })} className="w-full py-2.5 px-3 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-extrabold text-left">
                      ⚠️ Сбросить и пересчитать
                      <span className="block text-[10px] font-normal opacity-80 mt-0.5">Все назначения в диапазоне будут удалены</span>
                    </button>
                    <button onClick={() => setRecalcModalOpen(false)} className="w-full py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Отмена</button>
                  </div>
                </div>
              </div>
            )}

            {recalcConfirm && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 modal-enter">
                <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-5 space-y-3 border shadow-2xl">
                  <h3 className="text-base font-extrabold">⚠ Точно?</h3>
                  <p className="text-xs text-slate-600 dark:text-slate-300">
                    Диапазон {recalcRange.from} … {recalcRange.to}. Режим: {recalcConfirm.resetAll ? 'сброс и пересчёт' : 'дозаполнение пустых'}.
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => setRecalcConfirm(null)} className="py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Отмена</button>
                    <button onClick={() => executeRecalculateRange(recalcRange.from, recalcRange.to, recalcConfirm.resetAll)} className="py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">Подтвердить</button>
                  </div>
                </div>
              </div>
            )}

            {/* ПОДТВЕРЖДЕНИЕ */}
            {confirmDialog && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 modal-enter">
                <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-5 space-y-4 border shadow-2xl">
                  <h3 className="text-base font-extrabold">{confirmDialog.title}</h3>
                  <p className="text-xs text-slate-600 dark:text-slate-300">{confirmDialog.message}</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => setConfirmDialog(null)} className="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">Отмена</button>
                    <button onClick={confirmDialog.onConfirm} className="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">{confirmDialog.confirmLabel}</button>
                  </div>
                </div>
              </div>
            )}

            {/* БАТАРЕЯ */}
            {isUserAdmin && batteryModalDate && (
              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 max-h-[82vh] flex flex-col modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">🛡️ {formatRuDate(batteryModalDate)} ({schedules[batteryModalDate]?.batteryDutyIds?.length || 0})</div>
                    <button onClick={() => setBatteryModalDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <div className="overflow-y-auto divide-y divide-slate-100 border rounded-xl">
                    {members.map((m) => {
                      const checked = (schedules[batteryModalDate]?.batteryDutyIds || []).includes(m.id);
                      const absent = inAbsence(m, batteryModalDate);
                      return (
                        <div key={m.id} onClick={() => toggleBatteryDutyMember(batteryModalDate, m.id)} className={`p-2.5 flex items-center justify-between cursor-pointer ${checked ? 'bg-amber-50' : ''}`}>
                          <span className={`text-xs font-bold ${absent ? 'text-slate-400' : ''}`}>{m.fullName} {absent && '🚫'}</span>
                          <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${checked ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>{checked ? '✓' : 'Выбрать'}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* НАЗНАЧЕНИЕ */}
            {isUserAdmin && modalSlot && (
              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 max-h-[85vh] flex flex-col modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">{modalSlot.slot.title} • {formatRuDate(modalSlot.date)}</div>
                    <button onClick={() => setModalSlot(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <div className="grid grid-cols-2 gap-1">
                    <button onClick={() => replaceWithBestCandidate(modalSlot.date, modalSlot.slot)} className="w-full py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">⭐ Лучший</button>
                    <button onClick={() => replaceWithRandomLeastLoaded(modalSlot.date, modalSlot.slot)} className="w-full py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">🎲 Случайный</button>
                  </div>
                  <div className="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button onClick={() => setAssignMode('REGULAR')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'REGULAR' ? 'bg-white dark:bg-slate-900 text-indigo-600' : 'text-slate-500'}`}>Очередь</button>
                    <button onClick={() => setAssignMode('PENALTY')} className={`py-1.5 rounded-lg text-[11px] font-bold ${assignMode === 'PENALTY' ? 'bg-rose-600 text-white' : 'text-slate-500'}`}>Штраф</button>
                  </div>
                  <div className="overflow-y-auto border rounded-xl flex-1">
                    {(() => {
                      const day = schedules[modalSlot.date] || { batteryDutyIds: [], slots: [] };
                      const busy = new Set([
                        ...(day.batteryDutyIds || []),
                        ...(day.slots || []).filter((s) => s.id !== modalSlot.slot.id).map((s) => s.memberId).filter(Boolean),
                      ]);
                      const active = members.filter((m) => m.status === 'ACTIVE');
                      const recommended = active.filter((m) => !busy.has(m.id) && !inAbsence(m, modalSlot.date) && !isRecoveringFromBatteryDuty(m.id, modalSlot.date))
                        .sort((a, b) => (statsMap[a.id]?.totalAll || 0) - (statsMap[b.id]?.totalAll || 0)).slice(0, 5);
                      const freeToday = active.filter((m) => !busy.has(m.id) && !recommended.some((r) => r.id === m.id));
                      const others = members.filter((m) => m.status !== 'ACTIVE' || busy.has(m.id) || inAbsence(m, modalSlot.date));

                      const renderRow = (m, group) => {
                        const warns = getAssignmentWarnings(modalSlot.date, m.id);
                        return (
                          <div key={`${group}_${m.id}`} className="p-2.5 flex items-center justify-between border-b last:border-0">
                            <div className="min-w-0">
                              <div className="text-xs font-bold">{m.fullName} ({m.squad})</div>
                              <div className="text-[10px] text-slate-500">Смен: {statsMap[m.id]?.totalAll || 0}</div>
                              {warns.length > 0 && <div className="text-[10px] text-rose-600 mt-0.5">⚠ {warns.join(' • ')}</div>}
                            </div>
                            <button onClick={() => handleAssignMember(m.id)} className="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-xl ml-2">→</button>
                          </div>
                        );
                      };

                      return (
                        <>
                          {recommended.length > 0 && (
                            <div>
                              <div className="px-2.5 py-1.5 bg-emerald-50 dark:bg-emerald-950/40 text-[10px] font-extrabold uppercase text-emerald-700">⭐ Рекомендованные</div>
                              {recommended.map((m) => renderRow(m, 'rec'))}
                            </div>
                          )}
                          {freeToday.length > 0 && (
                            <div>
                              <div className="px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 text-[10px] font-extrabold uppercase text-slate-500">Свободные</div>
                              {freeToday.map((m) => renderRow(m, 'free'))}
                            </div>
                          )}
                          {others.length > 0 && (
                            <div>
                              <div className="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-800 text-[10px] font-extrabold uppercase text-slate-500">Остальные</div>
                              {others.map((m) => renderRow(m, 'other'))}
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            {/* ДОБАВЛЕНИЕ */}
            {isUserAdmin && addSlotDate && (
              <div className="fixed inset-0 z-40 bg-black/50 flex items-end justify-center">
                <form onSubmit={handleAddCustomSlotToDay} className="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-3xl p-4 space-y-3 modal-enter">
                  <div className="flex items-center justify-between border-b pb-2">
                    <div className="text-sm font-extrabold">+ Задача • {formatRuDate(addSlotDate)}</div>
                    <button type="button" onClick={() => setAddSlotDate(null)} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 font-bold">✕</button>
                  </div>
                  <input type="text" required placeholder="Название" value={customSlotTitle} onChange={(e) => setCustomSlotTitle(e.target.value)}
                    className="w-full px-3 py-2 border rounded-xl text-xs dark:bg-slate-800" />
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl">Добавить</button>
                </form>
              </div>
            )}

            {/* НАВИГАЦИЯ */}
            <nav className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-slate-900 border-t grid ${isUserAdmin ? 'grid-cols-4' : 'grid-cols-3'} py-2 z-30`}>
              <button onClick={() => setTab('TODAY')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'TODAY' ? 'text-indigo-600' : 'text-slate-400'}`}>
                <span>📌</span><span>Сегодня</span>
              </button>
              <button onClick={() => setTab('SCHEDULE')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'SCHEDULE' ? 'text-indigo-600' : 'text-slate-400'}`}>
                <span>📅</span><span>Календарь</span>
              </button>
              <button onClick={() => setTab('STATS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'STATS' ? 'text-indigo-600' : 'text-slate-400'}`}>
                <span>📊</span><span>Нагрузки</span>
              </button>
              {isUserAdmin && (
                <button onClick={() => setTab('TASKS')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'TASKS' ? 'text-indigo-600' : 'text-slate-400'}`}>
                  <span>⚙️</span><span>Правила</span>
                </button>
              )}
              <button onClick={() => setTab('CLOUD')} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === 'CLOUD' ? 'text-indigo-600' : 'text-slate-400'}`}>
                <span>☁️</span><span>Архив</span>
              </button>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BatteryDutyApp />);
  </script>
</body>
</html>
